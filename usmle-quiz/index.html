<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>USMLE Quiz</title>
    <meta name="description" content="A calm, timed USMLE practice quiz with explanations, a built-in calculator, a study playlist and a progress dashboard.">
    <meta name="theme-color" content="#050506">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23E4502B'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='white' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin="" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin="" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.18.0/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>

    <!-- Typography: Manrope (UI), Sora (display), Space Grotesk (numerals) + Inter Tight / Instrument Serif / Outfit for the site -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Sora:wght@300..700&family=Space+Grotesk:wght@400..700&family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter+Tight:wght@400..700&family=Montserrat:wght@400..700&family=Bebas+Neue&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        mono: ['"Space Grotesk"', 'ui-monospace', 'monospace'],
                        display: ['Sora', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <style>
        :root {
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-apple:    cubic-bezier(0.32, 0.72, 0, 1);
            --ease-soft:     cubic-bezier(0.4, 0, 0.2, 1);
            --dur-fast:  220ms;
            --dur-med:   420ms;
            --dur-slow:  600ms;
        }
        /* page scrolls normally; scrollbars are hidden only inside the quiz stage */
        .quiz-root * { scrollbar-width: none !important; -ms-overflow-style: none !important; }
        .quiz-root *::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
        body { font-family: 'Manrope', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
        .no-select { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none; }
        .screenshot-protected { transition: filter 0.1s ease-out; }
        .screenshot-protected.blur-protect { filter: blur(30px) brightness(0.3); }
        @media print { body * { display: none !important; } body::after { content: "Fun fact: The raw ingredients of a human body would cost over £116,000."; display: block; font-size: 24px; text-align: center; padding: 50px; } }

        .typing-cursor { display: inline-block; width: 2px; height: 1em; background: white; margin-left: 2px; animation: blink 1s step-end infinite; vertical-align: text-bottom; }
        @keyframes blink { from, to { background: transparent; } 50% { background: white; } }

        .glass-5-tilt { transition: transform 0.42s var(--ease-apple) !important; transform-style: preserve-3d; will-change: transform; }

        .liquid-glass-music-btn,
        .liquid-glass-music-dropdown,
        .liquid-glass-timer,
        .liquid-glass-calc-panel,
        .liquid-glass-player-card,
        .liquid-glass-playlist-card,
        .liquid-glass-play-btn,
        .liquid-glass-photo-frame,
        .liquid-glass-album-cover,
        .lg-toggle, .lg-nav, .calc-pill, .lg-glass-btn,
        .score-card {
            transition: transform var(--dur-med) var(--ease-apple),
                        background-color var(--dur-fast) var(--ease-soft),
                        box-shadow var(--dur-fast) var(--ease-soft),
                        border-color var(--dur-fast) var(--ease-soft),
                        opacity var(--dur-fast) var(--ease-soft);
        }
        .liquid-glass-music-dropdown { position: relative; border-radius: 28px; isolation: isolate; box-shadow: 0 20px 60px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.1), inset 0 1px 0 rgba(255,255,255,0.3); transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }
        .liquid-glass-music-dropdown::before { content: ""; position: absolute; inset: 0; z-index: 0; border-radius: inherit; box-shadow: inset 0 0 12px -4px #000; background: rgba(255,255,255,0.05); }
        .liquid-glass-music-dropdown::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; backdrop-filter: blur(0px); filter: url(#glass-distortion); }
        .liquid-glass-music-dropdown.dark::before { background: rgba(40,40,40,0.15); }

        .liquid-glass-timer { position: relative; border-radius: 20px; isolation: isolate; box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
        .liquid-glass-timer::before { content: ""; position: absolute; inset: 0; z-index: 0; border-radius: 20px; box-shadow: inset 0 0 10px -4px #000; background: rgba(255,255,255,0.03); }
        .liquid-glass-timer::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 20px; backdrop-filter: blur(0px); filter: url(#glass-distortion); }
        .liquid-glass-timer.dark::before { background: rgba(40,40,40,0.1); }
        .liquid-glass-music-btn { position: relative; border-radius: 16px; isolation: isolate; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: all 0.25s cubic-bezier(0.4,0,0.2,1); }
        .liquid-glass-music-btn::before { content: ""; position: absolute; inset: 0; z-index: 0; border-radius: 16px; box-shadow: inset 0 0 8px -3px #000; background: rgba(255,255,255,0.03); }
        .liquid-glass-music-btn::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 16px; backdrop-filter: blur(0px); filter: url(#glass-distortion); }
        .liquid-glass-music-btn.dark::before { background: rgba(50,50,50,0.1); }
        .liquid-glass-music-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
        .liquid-glass-player-card { position: relative; border-radius: 20px; isolation: isolate; box-shadow: 0 10px 40px rgba(0,0,0,0.15); transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }
        .liquid-glass-player-card::before { content: ""; position: absolute; inset: 0; z-index: 0; border-radius: 20px; box-shadow: inset 0 0 12px -4px #000; background: rgba(255,255,255,0.05); }
        .liquid-glass-player-card::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 20px; backdrop-filter: blur(0px); filter: url(#glass-distortion); }
        .liquid-glass-player-card.dark::before { background: rgba(40,40,40,0.15); }
        .liquid-glass-playlist-card { position: relative; border-radius: 20px; isolation: isolate; box-shadow: 0 8px 32px rgba(0,0,0,0.1); transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }
        .liquid-glass-playlist-card::before { content: ""; position: absolute; inset: 0; z-index: 0; border-radius: 20px; box-shadow: inset 0 0 10px -3px #000; background: rgba(255,255,255,0.03); }
        .liquid-glass-playlist-card::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 20px; backdrop-filter: blur(0px); filter: url(#glass-distortion); }
        .liquid-glass-playlist-card.dark::before { background: rgba(35,35,35,0.15); }
        .liquid-glass-playlist-card:hover { transform: translateY(-2px); }
        .liquid-glass-play-btn { position: relative; border-radius: 50%; isolation: isolate; box-shadow: 0 8px 32px rgba(0,0,0,0.15); transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }
        .liquid-glass-play-btn::before { content: ""; position: absolute; inset: 0; z-index: 0; border-radius: 50%; box-shadow: inset 0 0 10px -3px #000; background: rgba(255,255,255,0.1); }
        .liquid-glass-play-btn::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 50%; backdrop-filter: blur(0px); filter: url(#glass-distortion); }
        .liquid-glass-play-btn.dark::before { background: rgba(60,60,60,0.2); }
        .liquid-glass-play-btn:hover { transform: scale(1.1); }

        .liquid-glass-photo-frame { position: relative; border-radius: 50%; box-shadow: 0 8px 32px rgba(0,0,0,0.15); border: 3px solid rgba(255,255,255,0.35); overflow: hidden; }
        .liquid-glass-photo-frame.dark { border-color: rgba(255,255,255,0.25); }
        .liquid-glass-photo-frame:hover { border-color: rgba(255,255,255,0.45); }
        .liquid-glass-album-cover { position: relative; border-radius: 50%; box-shadow: 0 8px 32px rgba(0,0,0,0.2); border: 2px solid rgba(255,255,255,0.3); overflow: hidden; }
        .liquid-glass-album-cover.dark { border-color: rgba(255,255,255,0.2); }
        .liquid-glass-album-cover:hover { border-color: rgba(255,255,255,0.4); }
        .liquid-glass-content { position: relative; z-index: 1; }

        .spin-animation { animation: spinCover 9s linear infinite; }
        .spin-animation.paused { animation-play-state: paused; }
        @keyframes spinCover { to { transform: rotate(360deg); } }

        .sound-bar { transform-origin: bottom; animation: eqBob 0.85s ease-in-out infinite alternate; }
        .sound-bar:nth-child(2) { animation-delay: 0.22s; }
        .sound-bar:nth-child(3) { animation-delay: 0.44s; }
        @keyframes eqBob { from { transform: scaleY(0.5); } to { transform: scaleY(1.3); } }

        .lg-toggle { position: relative; isolation: isolate; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.15s cubic-bezier(0.4,0,0.2,1), box-shadow 0.15s cubic-bezier(0.4,0,0.2,1); }
        .lg-toggle::before { content: ""; position: absolute; inset: 0; z-index: 0; border-radius: inherit; box-shadow: inset 0 0 8px -3px #000; background: rgba(255,255,255,0.03); }
        .lg-toggle::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; backdrop-filter: blur(0px); filter: url(#glass-distortion); }
        .lg-toggle.dark::before { background: rgba(50,50,50,0.1); }
        .lg-toggle:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
        .lg-toggle:active { transform: scale(0.93); }
        .lg-toggle > * { position: relative; z-index: 1; }
        .calc-pill { position: relative; height: 44px; width: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; isolation: isolate; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.15s cubic-bezier(0.4,0,0.2,1), box-shadow 0.15s cubic-bezier(0.4,0,0.2,1); }
        .calc-pill::before { content: ""; position: absolute; inset: 0; z-index: 0; border-radius: inherit; box-shadow: inset 0 0 8px -3px #000; background: rgba(255,255,255,0.03); }
        .calc-pill::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; backdrop-filter: blur(0px); filter: url(#glass-distortion); }
        .calc-pill.dark::before { background: rgba(50,50,50,0.1); }
        .calc-pill:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
        .calc-pill:active { transform: scale(0.93); }
        .calc-icon { position: relative; z-index: 4; font-size: 22px; font-weight: 300; color: white; text-shadow: 0 1px 5px rgba(0,0,0,0.55); transition: transform 0.42s var(--ease-apple); user-select: none; line-height: 1; }
        .calc-pill.open .calc-icon { transform: rotate(45deg); }
        .liquid-glass-calc-panel { position: relative; border-radius: 24px; isolation: isolate; box-shadow: 0 20px 60px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.1), inset 0 1px 0 rgba(255,255,255,0.3); transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }
        .liquid-glass-calc-panel::before { content: ""; position: absolute; inset: 0; z-index: 0; border-radius: inherit; box-shadow: inset 0 0 12px -4px #000; background: rgba(255,255,255,0.05); }
        .liquid-glass-calc-panel::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; backdrop-filter: blur(0px); filter: url(#glass-distortion); }
        .liquid-glass-calc-panel.dark::before { background: rgba(40,40,40,0.15); }
        .liquid-glass-calc-panel:not(.dark) { background: rgba(0, 0, 0, 0.6); }
        .liquid-glass-calc-panel .calc-display, .liquid-glass-calc-panel .calc-grid { position: relative; z-index: 2; }
        .calc-display { padding: 16px 16px 6px; text-align: right; font-size: 38px; font-weight: 300; color: white; text-shadow: 0 2px 8px rgba(0,0,0,0.4); letter-spacing: -1.5px; word-break: break-all; min-height: 60px; font-family: 'Space Grotesk', monospace; }
        .calc-display.small { font-size: 22px; padding-top: 22px; }
        .calc-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; padding: 6px 12px 14px; }
        .calc-btn { border: none; border-radius: 50%; width: 52px; height: 52px; font-size: 18px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; color: white; transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), filter 0.1s ease; -webkit-user-select: none; user-select: none; font-family: 'Space Grotesk', monospace; }
        .calc-btn:hover { transform: scale(1.14); filter: brightness(1.18); }
        .calc-btn:active { transform: scale(0.88); }
        .calc-btn-zero { border-radius: 26px; width: auto; grid-column: span 2; justify-content: flex-start; padding-left: 20px; }
        .calc-btn-fn { background: rgba(180,180,192,0.38); box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), inset 0 -1px 0 rgba(0,0,0,0.18); }
        .calc-btn-num { background: rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), inset 0 -1px 0 rgba(0,0,0,0.14); }
        .calc-btn-op { background: rgba(255,159,10,0.90); box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), inset 0 -1px 0 rgba(0,0,0,0.22); }
        .calc-btn-op.active-op { background: rgba(255,255,255,0.95); color: #ff9f0a; }

        .score-card { position: relative; border-radius: 16px; padding: 20px; isolation: isolate; background: rgba(0, 0, 0, 0.65); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2); }
        .score-card::before { content: ""; position: absolute; inset: 0; z-index: 0; border-radius: inherit; box-shadow: inset 0 0 8px -3px #000; background: rgba(0,0,0,0.1); }
        .score-card.dark { background: rgba(0,0,0,0.7); border-color: rgba(255,255,255,0.12); }
        .score-card:hover { transform: translateY(-2px); box-shadow: 0 14px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1); }
        .score-card > * { position: relative; z-index: 2; }

        .lg-glass-btn { position: relative; cursor: pointer; isolation: isolate; box-shadow: 0 8px 32px rgba(0,0,0,0.15); border-radius: 18px; color: white; }
        .lg-glass-btn::before { content: ""; position: absolute; inset: 0; z-index: 0; border-radius: inherit; box-shadow: inset 0 0 10px -4px #000; background: rgba(255,255,255,0.03); }
        .lg-glass-btn::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; backdrop-filter: blur(0px); filter: url(#glass-distortion); }
        .lg-glass-btn.dark::before { background: rgba(40,40,40,0.1); }
        .lg-glass-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,0,0,0.18); }
        .lg-glass-btn:active { transform: translateY(0) scale(0.97); }
        .lg-glass-btn:disabled { opacity: 0.38; cursor: not-allowed; transform: none; }

        .opt-btn {
            width: 100%;
            padding: 12px 16px 12px 48px;
            margin-bottom: 8px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: white;
            text-align: left;
            font-family: 'Manrope', sans-serif;
            font-weight: 500;
            transition: background-color var(--dur-fast) var(--ease-soft),
                        border-color var(--dur-fast) var(--ease-soft),
                        transform 0.18s var(--ease-soft),
                        opacity var(--dur-fast) var(--ease-soft),
                        box-shadow var(--dur-fast) var(--ease-soft);
            position: relative;
            will-change: transform, background-color;
        }
        .opt-btn::before {
            content: attr(data-letter);
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            font-family: 'Space Grotesk', monospace;
            color: rgba(255,255,255,0.7);
            letter-spacing: 0;
            transition: all var(--dur-fast) var(--ease-soft);
        }
        .opt-btn:hover:not(.locked) { background: rgba(255,255,255,0.1); transform: translateX(2px); }
        .opt-btn:hover:not(.locked)::before { border-color: rgba(255,255,255,0.55); color: rgba(255,255,255,0.95); }
        .opt-btn:focus-visible { outline: 2px solid #FF9E7C; outline-offset: 2px; }
        .opt-btn.locked { cursor: default; }
        .opt-btn.opt-selected {
            background: rgba(255,255,255,0.18);
            border-color: rgba(255,255,255,0.45);
        }
        .opt-btn.opt-dim { opacity: 0.32; }

        .floating-bg-container {
            contain: layout paint style;
            will-change: contents;
        }
        .floating-bg-container img {
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        .progress-rail {
            display: flex;
            gap: 6px;
            margin-bottom: 18px;
            height: 3px;
        }
        .progress-seg {
            flex: 1;
            height: 100%;
            background: rgba(255,255,255,0.12);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }
        .progress-seg-fill {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #FF9E7C, #FFB899);
            transform-origin: left center;
            transform: scaleX(0);
            transition: transform 0.5s var(--ease-apple);
        }
        .progress-seg.done .progress-seg-fill { transform: scaleX(1); }
        .progress-seg.current .progress-seg-fill {
            transform: scaleX(0.5);
            animation: currentPulse 1.8s var(--ease-soft) infinite;
        }
        @keyframes currentPulse {
            0%, 100% { transform: scaleX(0.35); opacity: 0.7; }
            50%      { transform: scaleX(0.7); opacity: 1; }
        }

        /* ============================================================
           WAVE TEXT — canvas edition.
           The wave is now painted on a single <canvas>. There are NO
           per-letter DOM nodes anymore, so the browser never has to
           style/layout hundreds of spans on mount or on dark-mode
           toggle. Visually identical: same stagger, same 7px bob,
           same 1s ease-in-out per letter.
           ============================================================ */
        .question-text-container {
            position: relative;
            min-height: 3em;
            contain: layout style;
        }
        .question-text-container canvas { display: block; max-width: 100%; }
        .question-card-layer { will-change: transform, opacity; transform: translateZ(0); }

        /* ============================================================
           RESULTS SCREEN — mature dashboard cards
           ============================================================ */
        .nexus {
            font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
            letter-spacing: -0.005em;
            color: #FFFFFF;
        }
        .nexus .mono, .font-grotesk {
            font-family: 'Space Grotesk', ui-monospace, 'SF Mono', monospace;
            font-feature-settings: "tnum" 1, "ss01" 1;
        }
        .nexus-muted { color: #8b8b8b; }
        .nexus-heading {
            font-family: 'Sora', 'Manrope', sans-serif;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.12;
        }
        .nexus-subtitle {
            font-family: 'Manrope', sans-serif;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: #8b8b8b;
        }

        .qcard {
            position: relative;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.07);
            background:
                linear-gradient(165deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.015) 34%, rgba(255,255,255,0) 100%),
                rgba(13, 10, 8, 0.92);
            box-shadow: 0 10px 30px -18px rgba(0,0,0,0.9);
            transition: border-color 0.4s var(--ease-apple), box-shadow 0.4s var(--ease-apple);
            overflow: hidden;
        }
        .qcard::before {
            content: "";
            position: absolute;
            left: 12%; right: 12%; top: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,158,124,0.55), transparent);
            opacity: 0;
            transition: opacity 0.4s var(--ease-apple);
        }
        .qcard:hover {
            border-color: rgba(255,158,124,0.32);
            box-shadow: 0 22px 55px -20px rgba(0,0,0,0.85), 0 0 45px -18px rgba(255,158,124,0.4);
        }
        .qcard:hover::before { opacity: 1; }
        .qcard > * { position: relative; z-index: 1; }
        .qcard::after { pointer-events: none; }
        .qcard-featured {
            background:
                radial-gradient(130% 130% at 88% -12%, rgba(255,158,124,0.16) 0%, rgba(255,158,124,0.04) 38%, transparent 62%),
                linear-gradient(165deg, rgba(255,255,255,0.05), rgba(255,255,255,0) 60%),
                rgba(13, 10, 8, 0.92);
        }
        .qcard-shine::after {
            content: "";
            position: absolute;
            top: -30%; bottom: -30%; width: 38%; left: -70%;
            transform: skewX(-18deg);
            background: linear-gradient(105deg, transparent, rgba(255,255,255,0.055), transparent);
            animation: qshine 5s var(--ease-soft) infinite 1.6s;
            z-index: 0;
        }
        @keyframes qshine { 0% { left: -70%; } 45%, 100% { left: 140%; } }

        .qcard-label {
            font-size: 10.5px;
            font-weight: 800;
            letter-spacing: 0.14em;

        /* ============================================================
           QUIZ ADDITIONS (dock reserve, jelly physics, seek bar, mobile)

        body.quiz-locked { overflow: hidden; }

        .quiz-root.blur-protect { filter: blur(30px) brightness(0.3); }

        .jelly { transform-style: preserve-3d; will-change: transform; -webkit-tap-highlight-color: transparent;
                 transition: background-color .2s, box-shadow .2s, border-color .2s, opacity .2s, color .2s !important; }

        /* Content reserves room for whichever dock panel is open: cards shift away instead of being covered. */
        .reserve-pad { padding-right: var(--reserve-x, 0px);
                       padding-bottom: calc(var(--reserve-y, 0px) + var(--nav-space, 0px));

        .dock-sheet.sheet-dark, .dock-sheet.sheet-light { border-radius: 26px 26px 0 0; -webkit-backdrop-filter: blur(26px) saturate(1.6); backdrop-filter: blur(26px) saturate(1.6); box-shadow: 0 -20px 60px rgba(0,0,0,.35); }
        .dock-sheet.calc-sheet { display: flex; justify-content: center; pointer-events: none; }

        .seek-range { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 5px; border-radius: 99px; outline: none; cursor: pointer;
                      background: linear-gradient(to right, #FF9E7C var(--p, 0%), rgba(255,255,255,.24) var(--p, 0%)); }

                      box-shadow: 0 2px 10px rgba(0,0,0,.45); transition: transform .2s cubic-bezier(.34,1.56,.64,1); }
        .seek-range:active::-webkit-slider-thumb { transform: scale(1.4); }
        .seek-range::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 2px 10px rgba(0,0,0,.45); }

        @media (max-width: 767px) {

        /* Calm controls: no hover / press motion on the glass buttons */

        .liquid-glass-play-btn:hover, .lg-glass-btn:hover, .lg-glass-btn:active, .liquid-glass-playlist-card:hover,
        .liquid-glass-music-dropdown:hover { transform: none !important; }

        /* ==========================================================================
           SITE  —  one stylesheet, organised top to bottom:
           0 foundations · 1 liquid glass (nav) · 2 buttons · 3 nav · 4 home
           5 dashboard · 6 library · 7 footer · 8 find · 9 toasts · 10 responsive
           ========================================================================== */

        /* ---------- 0. foundations ---------- */
        :root { --paper: #F4F0E6; --paper2: #EBE5D6; --ink: #0B0A09; --umber: #3A2A20; --brown: #6B4A34; --sand: #D9C3A0; --gold: #E2B96F;
                --coral: #D79A6E; --coral-deep: #8F5A33; --ease: cubic-bezier(.32,.72,0,1); --ease-out: cubic-bezier(.22,1,.36,1); }
        html { scroll-behavior: smooth; }
        body { margin: 0; background: #0B0A09; font-family: 'Montserrat', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
        #site { min-height: 100dvh; }
        .site-view { animation: viewIn .7s var(--ease-out) backwards; }   /* no 'forwards': a lingering transform would hijack position:fixed children */
        @keyframes viewIn { from { opacity: 0; transform: translateY(14px); } }
        .quiz-host { position: fixed; inset: 0; z-index: 10; --nav-space: 84px; }
        .quiz-host[hidden] { display: none; }
        .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        .eyebrow { font: 600 11px/1 'Space Grotesk', monospace; letter-spacing: .16em; text-transform: uppercase; color: var(--mut, #888); }
        .kquiet { font: 600 12px/1 'Space Grotesk', monospace; letter-spacing: .18em; text-transform: uppercase; opacity: .55; }
        .hl { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 400; color: var(--acc, var(--coral)); letter-spacing: -.015em; }
        .reveal { opacity: 0; transform: translateY(28px); transition: opacity .9s var(--ease-out), transform .9s var(--ease-out); transition-delay: var(--d, 0ms); }
        .reveal.in { opacity: 1; transform: none; }
        .fanfade-in { animation: riseIn 1.1s var(--ease-out) both; }
        @keyframes riseIn { from { opacity: 0; transform: translateY(26px); filter: blur(10px); } }
        .sec { position: relative; color: var(--fg); font-family: 'Montserrat', sans-serif; padding: clamp(72px, 10vw, 150px) clamp(18px, 5vw, 80px);
               background: radial-gradient(70% 45% at 100% 0%, rgba(201,138,94,.13), transparent 62%), radial-gradient(60% 45% at 0% 100%, rgba(120,80,50,.14), transparent 62%), var(--bg); }
        [data-tone] { --bg: #0B0A09; --fg: #f4f4f6; --mut: rgba(244,244,246,.62); --acc: var(--coral); --line: rgba(255,255,255,.1); }
        .wrap { max-width: 1240px; margin: 0 auto; position: relative; }

        /* ---------- 1. LIQUID GLASS (nav board only) ----------
           This is the "Timer" recipe from the quiz, unchanged. It works because:
             • the element itself has NO backdrop-filter / filter / opacity / mask, and neither does any
               ancestor (any of those makes a "backdrop root" and the ::after layer then can't see the page)
             • ::after carries `backdrop-filter: blur(0)` + the displacement filter, sitting BELOW the content
           Only the tint changes with the section underneath, exactly like .dark did on the timer.        */
        .glass { position: relative; isolation: isolate; border: 0; box-shadow: 0 8px 32px rgba(0,0,0,.15); }
        .glass::before { content: ""; position: absolute; inset: 0; z-index: 0; border-radius: inherit; box-shadow: inset 0 0 10px -4px #000; background: rgba(40,40,40,.1); }
        .glass::after  { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; backdrop-filter: blur(0px); filter: url(#glass-distortion); }
        .brand > *, .find > *, .tab { position: relative; z-index: 1; }
        .glass[data-t="light"] { box-shadow: 0 8px 32px rgba(30,30,45,.2), 0 0 0 1px rgba(255,255,255,.35); }
        .glass[data-t="light"]::before { background: rgba(255,255,255,.16); box-shadow: inset 0 0 10px -4px #000; }
        .glass[data-t="mixed"]::before { background: rgba(16,16,20,.5); }

        /* frosted card (everything that is NOT the nav board) */
        .frost { background: linear-gradient(177deg, rgba(255,255,255,.09), rgba(255,255,255,.03)); border: 1px solid rgba(255,255,255,.12);
                 box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 12px 34px -8px rgba(0,0,0,.4); -webkit-backdrop-filter: blur(20px) saturate(1.5); backdrop-filter: blur(20px) saturate(1.5); }

        /* ---------- 2. buttons ---------- */
        .btn-orange, .btn-white, .btn-dark, .btn-ghost { display: inline-flex; align-items: center; justify-content: center; gap: 9px; height: 52px; padding: 0 28px; border-radius: 999px; cursor: pointer;
            border: 1px solid transparent; font: 600 15px/1 'Montserrat', sans-serif; letter-spacing: -.01em; white-space: nowrap;
            transition: transform .45s var(--ease), background .25s, color .25s, border-color .25s, box-shadow .25s; }
        .btn-orange svg, .btn-white svg, .btn-dark svg, .btn-ghost svg, .btn-orange i, .btn-dark i, .btn-white i, .btn-ghost i { transition: transform .45s var(--ease); }
        .btn-orange:hover i, .btn-dark:hover i, .btn-white:hover i, .btn-ghost:hover i { transform: translateX(3px); }
        .btn-orange:active, .btn-white:active, .btn-dark:active, .btn-ghost:active { transform: scale(.97); }
        .btn-dark { background: #0b0b0d; color: #fff; } .btn-dark:hover { background: #26262b; }
        .btn-white { background: #fff; color: #0b0b0d; } .btn-white:hover { background: #e9e7e0; }
        .btn-orange { background: var(--coral); color: #1b0d06; } .btn-orange:hover { background: #ffad90; box-shadow: 0 12px 34px -10px rgba(255,106,61,.6); }
        .btn-ghost { background: transparent; color: inherit; border-color: color-mix(in srgb, currentColor 30%, transparent); } .btn-ghost:hover { border-color: currentColor; }
        .btn-sm { height: 44px; padding: 0 20px; font-size: 14px; } .btn-lg { height: 60px; padding: 0 34px; font-size: 17px; }

        /* ---------- 3. nav ---------- */
        .progress { display: none; position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 120; transform-origin: left; transform: scaleX(var(--p, 0)); background: linear-gradient(90deg, #FF9E7C, #FF6A2B, #6a6bff); pointer-events: none; }
        .site-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 90; display: flex; align-items: center; justify-content: space-between; padding: 14px clamp(14px, 3vw, 32px); pointer-events: none; transition: opacity .5s, transform .6s var(--ease); }
        .site-nav > * { pointer-events: auto; }
        .site-nav[data-hide="true"] { opacity: 0; transform: translateY(-20px); pointer-events: none; }
        .site-nav[data-hide="true"] > * { pointer-events: none; }
        .nav-actions { display: flex; gap: 10px; align-items: center; margin-left: auto; }
        .brand, .find, .tab { color: #f4f4f6; font-family: 'Montserrat', sans-serif; cursor: pointer; }
        .brand { display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 20px 0 8px; border-radius: 999px; font-weight: 700; font-size: 14px; letter-spacing: -.01em; }
        .brand-mark { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: linear-gradient(145deg, #D9976B, #8A5230); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 3px 10px rgba(110,66,34,.45); font-size: 14px; }
        .find { display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 18px; border-radius: 999px; font-weight: 600; font-size: 14px; }
        .find kbd { font: 600 10px/1 'Space Grotesk', monospace; padding: 4px 6px; border-radius: 6px; border: 1px solid rgba(255,255,255,.28); opacity: .8; }
        .tabs { position: fixed; z-index: 91; left: 50%; top: 14px; transform: translateX(-50%); display: flex; padding: 5px; border-radius: 999px; height: 54px; transition: top .7s var(--ease), transform .55s var(--ease), opacity .4s; }
        .tabs[data-pos="bottom"] { top: calc(100dvh - 54px - 16px - env(safe-area-inset-bottom)); }
        .tab-thumb { position: absolute; z-index: 0; top: 5px; bottom: 5px; left: 0; border-radius: 999px; background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.35); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 4px 16px rgba(0,0,0,.2); transition: transform .5s var(--ease), width .5s var(--ease); }
        .tab { display: inline-flex; align-items: center; gap: 8px; padding: 0 20px; border-radius: 999px; font-weight: 600; font-size: 14px; opacity: .72; background: none; border: 0; transition: opacity .3s, color .3s; }
        .tab[aria-current="page"] { opacity: 1; } .tab i { font-size: 13px; }
        .brand:active, .find:active, .tab:active { transform: scale(.96); }
        .brand[data-t="light"], .find[data-t="light"], .tabs[data-t="light"] .tab { color: #17171c; }
        .find[data-t="light"] kbd { border-color: rgba(0,0,0,.25); }
        .tabs[data-t="light"] .tab-thumb { background: #0b0b0d; border-color: #0b0b0d; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
        .tabs[data-t="light"] .tab[aria-current="page"] { color: #fff; }

        /* ---------- 4. home ---------- */
        .home-sec { position: relative; font-family: 'Montserrat', ui-sans-serif, system-ui, sans-serif; }
        .home-dark { background: #0B0A09; color: #F4F0E6; }
        .home-light { background: #F2EDE0; color: #17120e; }
        .home-wrap { max-width: 1280px; margin: 0 auto; padding-inline: clamp(18px, 5vw, 72px); }
        .seam-top { border-radius: 44px 44px 0 0; margin-top: -44px; position: relative; z-index: 2; }
        .serif-i, .bs-h em, .bs-para em { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 400; }

        /* hero */
        .bs-hero { background-color: #F1EEE6; background-image: radial-gradient(55% 46% at 88% 0%, rgba(255,140,90,.34), transparent 62%), radial-gradient(48% 42% at 8% 2%, rgba(120,140,255,.28), transparent 62%), linear-gradient(180deg, #F1EEE6, #ECE8DF);
            color: #121216; overflow: hidden; min-height: 100svh; display: flex; flex-direction: column; align-items: center; text-align: center; padding: clamp(92px, 12vh, 132px) clamp(18px, 5vw, 72px) 0; }
        .bs-ghost { position: absolute; left: 50%; top: -1vw; transform: translateX(-50%); z-index: 0; pointer-events: none; user-select: none; white-space: nowrap;
            font: 700 clamp(240px, 40vw, 600px)/.8 'Montserrat', sans-serif; letter-spacing: -.05em; color: rgba(18,18,26,.055); }
        .bs-hero-top { position: relative; z-index: 6; max-width: 920px; }
        .bs-h { font-weight: 500; letter-spacing: -.04em; line-height: 1; font-size: clamp(40px, 6.2vw, 90px); margin: 16px 0 0; }
        .bs-h em { letter-spacing: -.02em; }
        .bs-sub { max-width: 580px; margin: 22px auto 0; font-size: clamp(15px, 1.35vw, 18px); line-height: 1.6; color: #45454d; }
        .bs-hero-cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }
        .scroll-hint { position: absolute; z-index: 6; left: 50%; bottom: 18px; transform: translateX(-50%); font: 600 11px/1 'Space Grotesk', monospace; letter-spacing: .22em; color: rgba(20,20,30,.4); text-transform: uppercase; animation: bob 2.4s ease-in-out infinite; }
        @keyframes bob { 50% { transform: translate(-50%, 8px); } }

        .name-field { position: relative; display: inline-grid; vertical-align: baseline; cursor: text; color: var(--coral-deep); }
        .name-field > * { grid-area: 1 / 1; }
        .nf-sizer, .name-field input { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 400; font-size: inherit; letter-spacing: -.02em; line-height: inherit; padding: 0 .05em; }
        .nf-sizer { visibility: hidden; white-space: pre; min-width: 2ch; }
        .name-field input { width: 0; min-width: 100%; color: inherit; background: transparent; border: 0; outline: none; text-align: center; }
        .nf-line { position: absolute; left: 0; right: 0; bottom: -.14em; width: 100%; height: .3em; overflow: visible; pointer-events: none; opacity: 0; transition: opacity .3s; }
        .name-field:hover .nf-line, .name-field:focus-within .nf-line { opacity: 1; }

        .name-field.nf-plain { color: inherit; display: inline-grid; }
        .name-field.nf-plain .nf-sizer, .name-field.nf-plain input { font-family: 'Montserrat', sans-serif; font-style: normal; font-weight: 600; letter-spacing: -.01em; text-align: left; }

        /* orbit: images circling a still centre (billboarded: each card counter-rotates to face you) */
        @property --spin { syntax: '<angle>'; inherits: true; initial-value: 0deg; }
        .orb-wrap { position: relative; z-index: 2; width: 100%; flex: 1; min-height: min(56vh, 540px); perspective: 1700px; perspective-origin: calc(50% + var(--mx, 0) * 50px) calc(32% + var(--my, 0) * 24px); display: grid; place-items: start center; }
        .orb { --R: clamp(124px, 30vw, 470px); --cw: clamp(88px, 14.5vw, 224px); --tilt: 11deg; --dur: 60s;
               position: relative; width: 0; height: 0; margin-top: calc(var(--cw) * 1.62); transform-style: preserve-3d; transform: rotateX(var(--tilt)) rotateY(var(--spin)); animation: orbSpin var(--dur) linear infinite; }
        @keyframes orbSpin { to { --spin: 360deg; } }
        .orb-card { position: absolute; left: 0; top: 0; width: var(--cw); aspect-ratio: 3/4; margin: calc(var(--cw) * -.667) 0 0 calc(var(--cw) * -.5);
                    transform: rotateY(var(--a)) translateZ(var(--R)) rotateY(calc(-1 * (var(--a) + var(--spin)))) rotateX(calc(-1 * var(--tilt)));
                    animation: orbDepth var(--dur) linear infinite; animation-delay: calc(var(--dur) * var(--ap) * -1); }
        @keyframes orbDepth { 0% { filter: brightness(1); } 25% { filter: brightness(.82); } 50% { filter: brightness(.46) saturate(.7); } 75% { filter: brightness(.82); } 100% { filter: brightness(1); } }
        .orb-img { width: 100%; height: 100%; border-radius: 20px; overflow: hidden; background: #111; box-shadow: 0 40px 70px -26px rgba(20,18,16,.55), 0 6px 16px -6px rgba(20,18,16,.3); animation: orbBob 7s ease-in-out infinite; animation-delay: calc(var(--i) * -.9s); }
        @keyframes orbBob { 50% { transform: translateY(-12px); } }
        .orb-img img, .orb-center img { width: 100%; height: 100%; object-fit: cover; }
        .orb-center { position: absolute; left: 0; top: 0; width: calc(var(--cw) * 1.45); aspect-ratio: 3/4; margin: calc(var(--cw) * 1.45 * -.667) 0 0 calc(var(--cw) * 1.45 * -.5); border-radius: 24px; overflow: hidden;
                      transform: rotateY(calc(-1 * var(--spin))) rotateX(calc(-1 * var(--tilt))); box-shadow: 0 60px 100px -30px rgba(20,18,16,.6), 0 0 0 1px rgba(242,86,43,.35), 0 0 80px -16px rgba(242,86,43,.45); }

        /* manifesto: words sharpen as you scroll */
        .bs-manifesto { padding: clamp(100px, 16vh, 200px) 0; }
        .bs-manifesto .home-wrap { max-width: 1180px; }
        .bs-para { font-weight: 500; letter-spacing: -.025em; line-height: 1.12; font-size: clamp(30px, 4.4vw, 66px); margin: 0; }
        .bs-para + .bs-para { margin-top: clamp(40px, 7vw, 96px); }
        .bs-word { display: inline-block; will-change: filter, opacity; }
        .bs-para em { color: var(--coral); }

        /* feature grid */

<script>
/* ==========================================================================
   CORE: shared services used by both the quiz and the site shell.
   1. AttemptStore    - persistent quiz history (localStorage) other tabs can read.
   2. Jelly physics   - spring-driven tilt / squash / giggle for any element with .jelly
   3. Quiz protection - copy / right-click / blur guards, active only on the Quiz tab
   ========================================================================== */
(() => {
  'use strict';

  /* ---------- 1. AttemptStore ---------- */
  const KEY = 'usmle-quiz:attempts:v2';
  const read = () => {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY) || '[]');
      return Array.isArray(raw) ? raw.filter(a => a && Number.isFinite(a.score) && Number.isFinite(a.total) && a.total > 0) : [];
    } catch { return []; }
  };
  let list = read();
  const subs = new Set();
  const emit = () => subs.forEach(fn => fn());
  window.AttemptStore = {
    get: () => list,                                   /* stable reference until it changes */
    subscribe(fn) { subs.add(fn); return () => subs.delete(fn); },
    add(attempt) {
      if (list.some(a => a.timestamp === attempt.timestamp)) return;
      list = [...list, attempt].slice(-200);
      try { localStorage.setItem(KEY, JSON.stringify(list)); } catch { /* storage unavailable */ }
      emit();
    },
    clear() {
      list = [];
      try { localStorage.removeItem(KEY); } catch { /* ignore */ }
      emit();
    },
  };

  /* ---------- 2. Jelly physics ---------- */
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const K = 230, D = 11;                       /* stiffness / damping: under-damped, so it wobbles */
    const states = new WeakMap();
    const live = new Set();
    let hovered = null, pressed = null, last = 0, raf = 0;

    const axis = (t = 0) => ({ p: t, v: 0, t });
    const stateOf = (el) => {
      let s = states.get(el);
      if (!s) {
        s = { x: axis(), y: axis(), z: axis(), s: axis(1),
              tilt: parseFloat(el.dataset.tilt || '6'),
              hover: parseFloat(el.dataset.hover || '1.04') };
        states.set(el, s);
      }
      return s;
    };
    const wake = (el) => { live.add(el); if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } };

    function tick(now) {
      const dt = Math.min(0.032, (now - last) / 1000);
      last = now;
      for (const el of live) {
        const s = states.get(el);
        let moving = false;
        for (const k of ['x', 'y', 'z', 's']) {
          const a = s[k];
          a.v += (-K * (a.p - a.t) - D * a.v) * dt;
          a.p += a.v * dt;
          if (Math.abs(a.p - a.t) > 0.0006 || Math.abs(a.v) > 0.008) moving = true;
        }
        if (moving) {
          el.style.transform = `perspective(900px) rotateX(${s.x.p.toFixed(3)}deg) rotateY(${s.y.p.toFixed(3)}deg) rotateZ(${s.z.p.toFixed(3)}deg) scale(${s.s.p.toFixed(4)})`;
        } else {
          for (const k of ['x', 'y', 'z', 's']) { s[k].p = s[k].t; s[k].v = 0; }
          const neutral = !s.x.t && !s.y.t && !s.z.t && s.s.t === 1;
          el.style.transform = neutral ? '' : `perspective(900px) rotateX(${s.x.t}deg) rotateY(${s.y.t}deg) scale(${s.s.t})`;
          live.delete(el);
        }
      }
      raf = live.size ? requestAnimationFrame(tick) : 0;
    }

    const rest = (el) => { const s = stateOf(el); s.x.t = 0; s.y.t = 0; s.z.t = 0; s.s.t = 1; wake(el); };
    const closest = (e) => (e.target && e.target.closest) ? e.target.closest('.jelly') : null;

    document.addEventListener('pointerover', (e) => {
      if (e.pointerType !== 'mouse') return;
      const el = closest(e);
      if (!el || el === hovered || el.disabled) return;
      hovered = el;
      const s = stateOf(el);
      s.s.t = s.hover;
      s.z.v += (Math.random() < 0.5 ? -1 : 1) * 42;        /* the giggle */
      wake(el);
    });
    document.addEventListener('pointermove', (e) => {
      if (!hovered || e.pointerType !== 'mouse') return;
      const r = hovered.getBoundingClientRect();
      if (!r.width || !r.height) return;
      const s = stateOf(hovered);
      s.y.t = ((e.clientX - r.left) / r.width - 0.5) * 2 * s.tilt;
      s.x.t = -((e.clientY - r.top) / r.height - 0.5) * 2 * s.tilt;
      wake(hovered);
    }, { passive: true });
    document.addEventListener('pointerout', (e) => {
      if (!hovered || e.pointerType !== 'mouse') return;
      if (e.relatedTarget && hovered.contains(e.relatedTarget)) return;
      const el = hovered; hovered = null; rest(el);
    });
    document.addEventListener('pointerdown', (e) => {
      const el = closest(e);
      if (!el || el.disabled) return;
      pressed = el;
      const s = stateOf(el); s.s.t = 0.9; wake(el);
    });
    const release = () => {
      if (!pressed) return;
      const el = pressed; pressed = null;
      const s = stateOf(el);
      s.s.t = el === hovered ? s.hover : 1;
      s.s.v += 1.4;                                          /* squash then spring back */
      s.z.v += (Math.random() < 0.5 ? -1 : 1) * 30;
      wake(el);
    };
    document.addEventListener('pointerup', release);
    document.addEventListener('pointercancel', release);
  }

  /* ---------- 3. Quiz protection (original behaviour, scoped to the Quiz tab) ---------- */
  window.__quizProtect = false;
  const guarded = (e) => window.__quizProtect && !(e.target && e.target.closest && e.target.closest('input, textarea'));
  ['contextmenu', 'selectstart', 'dragstart', 'copy', 'cut'].forEach(ev =>
    document.addEventListener(ev, (e) => { if (guarded(e)) e.preventDefault(); }, { passive: false }));
  document.addEventListener('keydown', (e) => {
    if (!guarded(e)) return;
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && ['c', 'x', 'u', 's', 'a', 'p'].includes(k)) e.preventDefault();
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i', 'c', 'j', '3', '4', '5'].includes(k)) e.preventDefault();
    if (e.key === 'F12' || e.key === 'PrintScreen') e.preventDefault();
  }, { passive: false });
  const setBlur = (on) => {
    const root = document.querySelector('.quiz-root');
    if (!root) return;
    if (on && window.__quizProtect) root.classList.add('blur-protect');
    else setTimeout(() => root.classList.remove('blur-protect'), 100);
  };
  document.addEventListener('visibilitychange', () => setBlur(document.hidden));
  window.addEventListener('blur', () => setBlur(true));
  window.addEventListener('focus', () => setBlur(false));
  document.addEventListener('keyup', (e) => {
    if (e.key === 'PrintScreen' && window.__quizProtect) {
      setBlur(true); navigator.clipboard && navigator.clipboard.writeText('').catch(() => {});
      setTimeout(() => setBlur(false), 1000);
    }
  });
})();

<script>
(() => {
        const { useState, useEffect, useLayoutEffect, useRef, createElement: h, useMemo, useImperativeHandle, useSyncExternalStore } = React;
        const { motion, AnimatePresence } = window.Motion;

        const EASE = {
            apple:    [0.32, 0.72, 0, 1],
            outExpo:  [0.16, 1, 0.3, 1],
            soft:     [0.4, 0, 0.2, 1],
            glide:    [0.45, 0.05, 0.25, 1],
        };
        const DUR = {
            fast: 0.22,
            med:  0.42,
            slow: 0.6,
            glide: 0.62,
        };
        const FEEDBACK_MS = 420;

        /* ============================================================
           Canvas wave-text engine.
           measureLines: pure-CPU line breaking (unchanged).
           buildLayout:  per-char x positions, measured once.
           paintFrame:   draws the text; with a time value it applies
                         the same 0 → -7px → 0 bob each letter had in
                         the old CSS keyframes.
           ============================================================ */
        let _measureCanvas = null;
        function measureLines(text, maxWidth, cssFont) {
            if (!_measureCanvas) _measureCanvas = document.createElement('canvas');
            const ctx = _measureCanvas.getContext('2d');
            ctx.font = cssFont;
            const tokens = text.split(/(\s+)/);
            const lines = [];
            let cur = '', curW = 0;
            for (const tok of tokens) {
                if (tok === '') continue;
                const tw = ctx.measureText(tok).width;
                if (cur && curW + tw > maxWidth) {
                    lines.push(cur);
                    if (/^\s+$/.test(tok)) { cur = ''; curW = 0; }
                    else { cur = tok; curW = tw; }
                } else { cur += tok; curW += tw; }
            }
            if (cur) lines.push(cur);
            return lines;
        }

        const WAVE_CHAR_STAGGER = 0.022;
        const WAVE_LINE_STAGGER = 0.07;
        const WAVE_DURATION = 1.0;
        const WAVE_AMP = 7;
        const easeInOutQuad = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

        function buildLayout(text, maxWidth, cssFont) {
            if (!_measureCanvas) _measureCanvas = document.createElement('canvas');
            const ctx = _measureCanvas.getContext('2d');
            const lines = measureLines(text, maxWidth, cssFont);
            ctx.font = cssFont;
            return lines.map((line) => {
                const xs = [];
                for (let i = 0; i < line.length; i++) xs.push(ctx.measureText(line.slice(0, i)).width);
                return { text: line, xs };
            });
        }

        function _WaveQuestionCard({ q, i, isActive, opaqueMode, currentQuestion, handleOption,
                                    musicDropdownOpen, calcDropdownOpen, isMobile,
                                    selected, locked, quizStarted }) {
            const containerRef = useRef(null);
            const canvasRef = useRef(null);
            const layoutRef = useRef(null);
            const fontRef = useRef({ cssFont: '16px sans-serif', fontSize: 16, lineHeight: 26, width: 0 });
            const rafRef = useRef(0);
            const [layoutVersion, setLayoutVersion] = useState(0);

            /* Paint one frame. t === null → static (full strings, perfect
               kerning). t === seconds → per-char wave offsets. */
            const paintFrame = (t) => {
                const canvas = canvasRef.current;
                const L = layoutRef.current;
                if (!canvas || !L || !L.length) return;
                const { cssFont, fontSize, lineHeight, width } = fontRef.current;
                const height = L.length * lineHeight + 2;
                const dpr = Math.min(2.5, window.devicePixelRatio || 1);
                const pw = Math.round(width * dpr), ph = Math.round(height * dpr);
                if (canvas.width !== pw || canvas.height !== ph) { canvas.width = pw; canvas.height = ph; }
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                const ctx = canvas.getContext('2d');
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.clearRect(0, 0, width, height);
                ctx.font = cssFont;
                ctx.fillStyle = '#FFFFFF';
                ctx.textBaseline = 'alphabetic';
                for (let li = 0; li < L.length; li++) {
                    const line = L[li];
                    const baseY = li * lineHeight + fontSize * 0.92;
                    if (t === null) {
                        ctx.fillText(line.text.replace(/\s+$/, ''), 0, baseY);
                    } else {
                        for (let ci = 0; ci < line.text.length; ci++) {
                            const ch = line.text[ci];
                            if (ch === ' ') continue;
                            const delay = ci * WAVE_CHAR_STAGGER + li * WAVE_LINE_STAGGER;
                            const local = t - delay;
                            let off = 0;
                            if (local > 0 && local < WAVE_DURATION) {
                                const half = WAVE_DURATION / 2;
                                off = local < half
                                    ? -WAVE_AMP * easeInOutQuad(local / half)
                                    : -WAVE_AMP * (1 - easeInOutQuad((local - half) / half));
                            }
                            ctx.fillText(ch, line.xs[ci], baseY + off);
                        }
                    }
                }
            };

            const computeAndSet = () => {
                const el = containerRef.current;
                if (!el) return;
                const cs = getComputedStyle(el);
                const cssFont = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
                const fontSize = parseFloat(cs.fontSize) || 16;
                const lineHeight = fontSize * 1.625; /* leading-relaxed */
                const maxW = el.clientWidth;
                if (maxW <= 0) return;
                fontRef.current = { cssFont, fontSize, lineHeight, width: maxW };
                layoutRef.current = buildLayout(q.question, maxW, cssFont);
                setLayoutVersion(v => v + 1);
            };

            useEffect(() => { computeAndSet(); }, [q.question]);

            useEffect(() => {
                let raf;
                const onResize = () => {
                    cancelAnimationFrame(raf);
                    raf = requestAnimationFrame(() => { cancelAnimationFrame(rafRef.current); computeAndSet(); });
                };
                window.addEventListener('resize', onResize);
                return () => { window.removeEventListener('resize', onResize); cancelAnimationFrame(raf); };
            }, [q.question]);

            /* Re-wrap the canvas text when the card width changes (e.g. a dock panel opens) */
            useEffect(() => {
                const el = containerRef.current;
                if (!el || !window.ResizeObserver) return;
                let raf, lastW = el.clientWidth;
                const ro = new ResizeObserver(() => {
                    if (Math.abs(el.clientWidth - lastW) < 2) return;
                    lastW = el.clientWidth;
                    cancelAnimationFrame(raf);
                    raf = requestAnimationFrame(computeAndSet);
                });
                ro.observe(el);
                return () => { ro.disconnect(); cancelAnimationFrame(raf); };
            }, [q.question]);

            /* Static frame whenever layout changes */
            useEffect(() => { paintFrame(null); }, [layoutVersion]);

            /* Webfonts resolve after first paint — re-measure once ready */
            useEffect(() => {
                let alive = true;
                if (document.fonts && document.fonts.ready) {
                    document.fonts.ready.then(() => { if (alive) computeAndSet(); });
                }
                return () => { alive = false; };
            }, []);

            /* Trigger the wave ~550ms after the card becomes active */
            useEffect(() => {
                if (!isActive || !quizStarted) return;
                const timer = setTimeout(() => {
                    cancelAnimationFrame(rafRef.current);
                    const L = layoutRef.current;
                    if (!L || !L.length) return;
                    let maxDelay = 0;
                    L.forEach((line, li) => { maxDelay = Math.max(maxDelay, line.text.length * WAVE_CHAR_STAGGER + li * WAVE_LINE_STAGGER); });
                    const total = maxDelay + WAVE_DURATION + 0.08;
                    const start = performance.now();
                    const step = (now) => {
                        const tt = (now - start) / 1000;
                        if (tt >= total) { paintFrame(null); return; }
                        paintFrame(Math.max(0, tt));
                        rafRef.current = requestAnimationFrame(step);
                    };
                    rafRef.current = requestAnimationFrame(step);
                }, 550);
                return () => { clearTimeout(timer); cancelAnimationFrame(rafRef.current); };
            }, [isActive, quizStarted, layoutVersion]);

            useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

            const hasImage = !!q.image;
            const isCur  = i === currentQuestion;
            const dropdownOpen = musicDropdownOpen || calcDropdownOpen;
            let targetX = '0%', targetScale = 1, targetOpacity = 0, zIndex = 0;
            if (isCur) {
                targetScale = hasImage ? (dropdownOpen ? 0.94 : (isMobile ? 1 : 1.03)) : (dropdownOpen ? 1 : (isMobile ? 1 : 1.03));
                targetOpacity = 1; zIndex = 20;
            } else if (i === currentQuestion - 1) {
                targetX = '-80%'; targetScale = 0.95; targetOpacity = (dropdownOpen || isMobile) ? 0 : 0.4; zIndex = 10;
            } else if (i === currentQuestion + 1) {
                targetX = '80%'; targetScale = 0.95; targetOpacity = (dropdownOpen || isMobile) ? 0 : 0.4; zIndex = 10;
            } else if (i < currentQuestion) {
                targetX = '-120%'; targetScale = 0.9; zIndex = 5;
            } else {
                targetX = '120%'; targetScale = 0.9; zIndex = 5;
            }
            const cardWidth = hasImage
                ? (isMobile ? 'calc(100vw - 20px)' : 'min(calc(100vw - var(--reserve-x, 0px) - 48px), 980px)')
                : 'min(calc(100vw - var(--reserve-x, 0px) - 28px), 560px)';

            const questionTextNode = h('div', {
                ref: containerRef,
                className: 'mb-6 leading-relaxed question-text-container',
            }, h('canvas', {
                ref: canvasRef,
                role: 'img',
                'aria-label': q.question
            }));

            const optionClass = (idx) => {
                if (!isCur || !locked || selected === null) return 'opt-btn';
                if (idx === selected) return 'opt-btn locked opt-selected';
                return 'opt-btn locked opt-dim';
            };

            const LETTERS = ['A','B','C','D','E','F','G','H','I','J'];
            const renderOptions = () => h('div', { className: 'space-y-2' },
                q.options.map((opt, idx) => h('button', {
                    key: idx,
                    onClick: () => isCur && !locked && handleOption(idx),
                    className: optionClass(idx),
                    disabled: locked,
                    'data-letter': LETTERS[idx] || (idx + 1),
                    'aria-label': `Option ${LETTERS[idx] || (idx+1)}: ${opt}`
                }, opt))
            );

            const totalQuestions = questions.length;
            const progressRail = h('div', { className: 'progress-rail' },
                Array.from({length: totalQuestions}, (_, segIdx) => h('div', {
                    key: segIdx,
                    className: `progress-seg${segIdx < i ? ' done' : segIdx === i ? ' current' : ''}`
                }, h('div', { className: 'progress-seg-fill' })))
            );
            const questionHeader = h('h2', { className: 'text-xl text-[#FF9E7C] font-semibold tracking-tight mb-4', style: { fontFamily: "'Sora', sans-serif" } },
                `Question ${i + 1}`
            );

            const cardInner = hasImage
                ? h('div', { className: 'flex flex-col md:flex-row gap-4 md:gap-6 items-stretch' },
                    h('div', {
                        className: `flex-shrink-0 border border-white/10 p-4 rounded-3xl ${opaqueMode ? 'bg-black/95' : 'bg-black/90'} flex items-center justify-center`,
                        style: { width: isMobile ? '100%' : '40%', minHeight: isMobile ? '200px' : '400px', maxHeight: isMobile ? '30dvh' : 'var(--card-max)' }
                    },
                        h('img', { src: q.image, alt: 'Question illustration', className: 'max-w-full max-h-full object-contain rounded-2xl' })
                    ),
                    h('div', {
                        className: `flex-1 border border-white/10 p-6 rounded-3xl overflow-y-auto ${opaqueMode ? 'bg-black/95' : 'bg-black/90'}`,
                        style: { maxHeight: isMobile ? 'none' : 'var(--card-max)' }
                    },
                        progressRail,
                        questionHeader,
                        questionTextNode,
                        renderOptions()
                    )
                )
                : h('div', {
                    className: `border border-white/10 p-6 rounded-3xl overflow-y-auto max-h-[var(--card-max)] ${opaqueMode ? 'bg-black/95' : 'bg-black/90'}`
                },
                    progressRail,
                    questionHeader,
                    questionTextNode,
                    renderOptions()
                );

            return h(motion.div, {
                className: 'absolute question-card-layer',
                animate: { x: targetX, scale: targetScale, opacity: targetOpacity },
                transition: { duration: DUR.glide, ease: EASE.glide },
                style: Object.assign({ width: cardWidth, zIndex }, isMobile ? { maxHeight: 'var(--card-max)', overflowY: 'auto', borderRadius: '24px' } : {}),
                initial: false
            }, cardInner);
        }
        const WaveQuestionCard = React.memo(_WaveQuestionCard);

        function Calculator({ isDarkMode, isMobile, isOpen, isAnimating, onToggle }) {
            const [disp, setDisp] = useState('0');
            const [prev, setPrev] = useState(null);
            const [op, setOp] = useState(null);
            const [fresh, setFresh] = useState(true);
            const [activeOp, setActiveOp] = useState(null);
            const wrapRef = useRef(null);
            const btnRef = useRef(null);
            const panelRef = useRef(null);

            useEffect(() => {
                const fn = (e) => { if (isOpen && wrapRef.current && !wrapRef.current.contains(e.target)) onToggle(false); };
                document.addEventListener('mousedown', fn);
                return () => document.removeEventListener('mousedown', fn);
            }, [isOpen, onToggle]);

            const toggleOpen = () => onToggle(!isOpen);

            const onTiltMove = (e, ref) => {
                if (!ref.current) return;
                const rect = ref.current.getBoundingClientRect();
                const x = e.clientX - rect.left, y = e.clientY - rect.top;
                const cx = rect.width/2, cy = rect.height/2;
                const rx = ((y-cy)/cy)*-6, ry = ((x-cx)/cx)*6;
                ref.current.style.transform = `perspective(800px) rotateX(${rx}deg) rotateY(${ry}deg) scale3d(1.03,1.03,1.03)`;
            };
            const onTiltLeave = (ref) => {
                if (!ref.current) return;
                ref.current.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg) scale3d(1,1,1)';
            };

            const fmt = (n) => { const s = String(n); return s.length > 10 ? parseFloat(n.toPrecision(7)).toString() : s; };
            const compute = (a, b, o) => { if (o === '+') return a + b; if (o === '-') return a - b; if (o === '*') return a * b; if (o === '/') return b !== 0 ? a / b : 0; return b; };
            const pressNum = (n) => { if (fresh) { setDisp(String(n)); setFresh(false); } else setDisp(d => d === '0' ? String(n) : (d.length < 10 ? d + n : d)); };
            const pressDot = () => { if (fresh) { setDisp('0.'); setFresh(false); return; } if (!disp.includes('.')) setDisp(d => d + '.'); };
            const pressOp = (o) => { const cur = parseFloat(disp); if (prev !== null && !fresh) { const res = compute(prev, cur, op); setDisp(fmt(res)); setPrev(res); } else setPrev(cur); setOp(o); setActiveOp(o); setFresh(true); };
            const pressEq = () => { if (op === null || prev === null) return; const res = compute(prev, parseFloat(disp), op); setDisp(fmt(res)); setPrev(null); setOp(null); setActiveOp(null); setFresh(true); };
            const pressClear = () => { setDisp('0'); setPrev(null); setOp(null); setActiveOp(null); setFresh(true); };
            const pressPM = () => setDisp(d => d.startsWith('-') ? d.slice(1) : (d !== '0' ? '-' + d : '0'));
            const pressPct = () => { setDisp(d => fmt(parseFloat(d)/100)); setFresh(true); };
            const Btn = ({ label, type, wide, fn, isAct }) => h('button', { className: `calc-btn calc-btn-${type}${wide?' calc-btn-zero':''}${isAct?' active-op':''}`, onClick: fn, style: wide ? { justifySelf: 'stretch' } : {} }, label);
            const rows = [
                [['C','fn',pressClear],['±','fn',pressPM],['%','fn',pressPct],['÷','op',()=>pressOp('/')]],
                [['7','num',()=>pressNum('7')],['8','num',()=>pressNum('8')],['9','num',()=>pressNum('9')],['×','op',()=>pressOp('*')]],
                [['4','num',()=>pressNum('4')],['5','num',()=>pressNum('5')],['6','num',()=>pressNum('6')],['−','op',()=>pressOp('-')]],
                [['1','num',()=>pressNum('1')],['2','num',()=>pressNum('2')],['3','num',()=>pressNum('3')],['+','op',()=>pressOp('+')]],
                [['0','num',()=>pressNum('0'),true],['.','num',pressDot],['=','op',pressEq]]
            ];
            return h('div',{ref:wrapRef,'data-anchor':'calc',style:{position:'relative',zIndex:9999}},
                h('div',{ref:btnRef,className:`calc-pill ${isOpen?' open':''}${isDarkMode?' dark':''}`,onClick:toggleOpen,'aria-label':'Calculator',title:"Calculator"}, h('span',{className:'calc-icon'},'+')),
                (isOpen || isAnimating) && h('div',{className:`${isMobile?'dock-sheet calc-sheet':'absolute top-full right-0 mt-2'} overflow-visible transition-all duration-150 ${isOpen?'opacity-100 scale-100':'opacity-0 scale-95 pointer-events-none'}`,style:isMobile?{transformOrigin:'bottom center'}:{width:'268px',transformOrigin:'top right',zIndex:9999}},
                    h('div',{ref:panelRef,className:`liquid-glass-calc-panel ${isDarkMode?'dark':''}`,style:{width:'260px',padding:'4px 0'}},
                        h('div',{className:`calc-display${disp.length>9?' small':''}`},disp),
                        h('div',{className:'calc-grid'},
                            rows.map((row,ri)=>row.map(([label,type,fn,wide],ci)=>
                                h(Btn,{key:`${ri}-${ci}`,label,type,wide:!!wide,fn,isAct:(label==='÷'&&activeOp==='/')||(label==='×'&&activeOp==='*')||(label==='−'&&activeOp==='-')||(label==='+'&&activeOp==='+')})
                            ))
                        )
                    )
                )
            );
        }

        const questions = [
            { question: "A 63-year-old man comes to the office due to poor urine flow for several months. The patient says that it takes about 10 seconds to initiate a urinary stream. He also needs to strain when urinating or the stream just stops before his bladder is empty. He has tried behavioral modifications, but the symptoms continue to be bothersome. The patient takes lisinopril for hypertension. He has smoked a pack of cigarettes a day for 30 years. His father had urothelial cancer of the bladder. He reports significant improvement several months after starting finasteride. A therapeutic effect on which of the following structures is most likely responsible for this patient's symptomatic improvement?", options: ["Structure A","Structure B","Structure C","Structure D","Structure E","Structure F"], answer: 2, image: "https://github.com/Bluegates77/Question-Images/blob/main/Question%201.png?raw=true" },
            { question: "A 54-year-old man comes to the office due to difficulty maintaining an erection for the last several weeks. He says, \"One night I was having sex with my wife and could not maintain an erection. Since then, it has continued to be a problem.\" The patient still has morning erections. His medical history is significant for hypertension, coronary artery disease, and depression. He has been married for 20 years but reports that he and his wife have been arguing since he began spending more time at work following a promotion 2 months ago. His current medications include amlodipine, lisinopril, and bupropion. Physical examination is unremarkable. Which of the following is the most likely cause of this patient's erectile dysfunction?", options: ["Advancing age","Antidepressant-induced sexual dysfunction","Antihypertensive-induced adverse effect","Psychological distress","Vascular insufficiency"], answer: 3 },
            { question: "A 21-year-old previously healthy man comes to the emergency department with acute onset of severe left scrotal pain and nausea. The pain started after he returned home from the gym following an intense workout. He denies any trauma, fever, or dysuria. Examination shows a swollen and tender left testis that lies higher than the right testis. Doppler ultrasound shows decreased arterial blood flow in the left spermatic cord entering the testis. Which of the following is the likely origin of the artery involved in this patient's condition?", options: ["Abdominal aorta","External iliac artery","Internal iliac artery","Internal pudendal artery","Obturator artery","Renal artery"], answer: 0 },
            {"question": "A 53-year-old woman comes to the office because of a 6-year history of stiffness and pain of her hands. She has difficulty buttoning her clothes because of the symptoms. She takes no medications. Physical examination shows the findings in the photograph. An abnormality of which of the following is most likely to confirm the diagnosis in this patient?", "options": ["Anti-citrullinated peptide antibody", "Antimitochondrial antibody assay", "Human leukocyte antigen-DQ2 antibody assay", "Precursor of the erythroid cell line", "Precursor of the thrombopoietic line"], "answer": 0, "image": "https://cdn.jsdelivr.net/gh/VeeVera123/Web-Crawler@211e233045daef6509b32705ff4f6025f6c3df20/usmle-quiz/assets/questions/usmle-step1-item02.png"},
            {"question": "An 80-year-old woman is evaluated in a subacute rehabilitation facility 6 months after she sustained a cerebral infarction. Her vital signs are within normal limits. When the patient is asked to look to the right, the right eye abducts and the left eye adducts. When she is asked to look to the left, the right eye adducts and the left eye remains midline. There is right-sided hemiparesis. Deep tendon reflexes are 3+ in the right biceps and quadriceps. Babinski sign is present on the right. Sensation to vibration and two-point discrimination are decreased on the right. The area affected by the cerebral infarction is indicated by the shaded area in the drawing of the brain stem shown. Which of the following additional findings is most likely in this patient?", "options": ["Anesthesia of the left side of the face", "Asymmetric smile", "Hoarseness", "Loss of accommodation", "Paralysis of the tongue"], "answer": 1, "image": "https://cdn.jsdelivr.net/gh/VeeVera123/Web-Crawler@211e233045daef6509b32705ff4f6025f6c3df20/usmle-quiz/assets/questions/usmle-step1-item03.png"},
            {"question": "A 63-year-old woman with a 2-year history of indigestion and heartburn volunteers for a research study in which a variety of drugs are administered and her gastric pH is measured. Which of the following sets of curves best represents the results in this patient after administration of cimetidine and omeprazole?", "options": ["Cimetidine A, omeprazole D", "Cimetidine B, omeprazole A", "Cimetidine B, omeprazole D", "Cimetidine C, omeprazole A", "Cimetidine C, omeprazole D", "Cimetidine D, omeprazole A"], "answer": 1, "image": "https://cdn.jsdelivr.net/gh/VeeVera123/Web-Crawler@211e233045daef6509b32705ff4f6025f6c3df20/usmle-quiz/assets/questions/usmle-step1-item15.png"},
            {"question": "A 65-year-old woman is brought to the emergency department because of a 10-minute history of chest tightness and severe pain of her left arm. Physical examination shows jugular venous distention. Crackles are heard over the lung fields. An ECG shows ST-segment elevation greater than 1 mm in leads V4 through V6 and new Q waves. Serum studies show an increased troponin I concentration. Which of the following labeled points in the graph best represents the changes in cardiac function that occurred during the first 10 seconds after the onset of pain in this patient?", "options": ["W → X", "W → Y", "W → Z", "X → W", "X → Y", "X → Z", "Z → W", "Z → X", "Z → Y"], "answer": 2, "image": "https://cdn.jsdelivr.net/gh/VeeVera123/Web-Crawler@211e233045daef6509b32705ff4f6025f6c3df20/usmle-quiz/assets/questions/usmle-step1-item24.png"},
            {"question": "A 25-year-old man is brought to the emergency department via ambulance 15 minutes after he sustained a gunshot wound to his back during a robbery. On arrival, he is conscious but appears confused. Temperature is 37.0°C (98.6°F), pulse is 120/min and weak, respirations are 20/min, and blood pressure is 110/50 mm Hg. Pulse oximetry on room air shows an oxygen saturation of 96%. Physical examination shows pale, cold, clammy skin and a single bullet entry wound in the posterior 10th intercostal space on the left side. Abdominal CT scan is shown. The bullet is most likely lodged in which of the following structures in this patient?", "options": ["Adrenal gland", "Colon", "Kidney", "Lung", "Spleen"], "answer": 4, "image": "https://cdn.jsdelivr.net/gh/VeeVera123/Web-Crawler@211e233045daef6509b32705ff4f6025f6c3df20/usmle-quiz/assets/questions/usmle-step1-item26.png"}
        ];

        const explanations = [
            { text: `This patient has signs of bladder outlet obstruction (eg, urinary hesitancy, need to strain) most likely due to benign prostatic hyperplasia (BPH), a condition that is present in >90% of men age >80. The diagnosis is based on history of urinary symptoms and digital rectal examination showing a smooth, homogenously enlarged prostate. The prostate is located just anterior to the anal canal (Choice D) and posterior to the symphysis pubis (the above CT image is just superior to the joining of the left and right pubic bones).\n\nBPH may cause static urinary obstruction (androgen-mediated enlargement of the prostate) or dynamic obstruction (prostate smooth muscle contraction via α-adrenoceptors). 5-α reductase inhibitors (eg, finasteride) inhibit the action of androgens on the prostate gland, preventing the conversion of testosterone to dihydrotestosterone and thereby limiting further prostate enlargement. α-adrenergic blockers (eg, tamsulosin) relax the smooth muscle in the bladder neck and prostate gland and are also used to control symptoms of BPH.\n\n(Choice B) The distal end of the anterior bladder wall may or may not be visible at this level depending on patient positioning and bladder filling.\n\nEducational objective:\nThe prostate is located between the pubic symphysis and the anal canal and is visible on inferior sections of the pelvis on CT scan. Benign prostatic hyperplasia is a common, age-related condition that causes urinary symptoms (eg, hesitancy, straining, incomplete voiding). It can be medically treated with α-adrenergic blockers and 5-α reductase inhibitors.`, images: ["https://github.com/Bluegates77/Question-Images/blob/main/Answer%201.jpeg?raw=true","https://github.com/Bluegates77/Question-Images/blob/main/Benign%20prostatic%20hyperplasia%20%28BPH%29.jpeg?raw=true","https://github.com/Bluegates77/Question-Images/blob/main/Benign%20prostatic%20hyperplasia.jpeg?raw=true"] },

                            y: { grid: { color: 'rgba(255,255,255,0.05)', drawBorder: false },

                    }

                return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
            }, [JSON.stringify(scores)]);
            return h('canvas', { ref: canvasRef, style: { width: '100%', height: '100%' } });
        }

        /* Performance History panel — the All / Last 5 tabs now actually filter */
        function HistoryPanel({ scores, delay = 0.4 }) {
            const [range, setRange] = useState('all');
            const data = range === 'all' ? scores : scores.slice(-5);
            return h(ResultCard, { delay, className: 'lg:col-span-2 p-6 flex flex-col', style: { height: 400 } },
                h('div', { className: 'flex justify-between items-center mb-6' },

                        [['all', 'All'], ['last', 'Last 5']].map(([val, label]) =>
                            h('button', {
                                key: val,

                            }, label)
