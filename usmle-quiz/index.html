<!DOCTYPE html>
<html lang="en" data-theme="dark" data-surface="glass">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USMLE Quiz</title>
<meta name="description" content="A focused, timed USMLE practice quiz with explanations, a built-in calculator and a study playlist.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23E4502B'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='white' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap">

<!-- Apply the saved theme before first paint so there is no light/dark flash. -->
<script>
  (function () {
    var root = document.documentElement;
    function read(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }
    var theme = read('usmle-quiz:theme');
    if (theme !== 'light' && theme !== 'dark') {
      theme = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    root.dataset.theme = theme;
    root.dataset.surface = read('usmle-quiz:surface') === 'solid' ? 'solid' : 'glass';
  })();
</script>

<style>
/* ==========================================================================
   1. DESIGN TOKENS
   Everything visual is driven from here. Components never hard-code colour.
   ========================================================================== */
:root {
  --font-ui: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --ease-in-out: cubic-bezier(.65, 0, .35, 1);
  --dur-1: 140ms;
  --dur-2: 240ms;
  --dur-3: 420ms;
  --dur-4: 640ms;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 22px;

  --topbar-h: 64px;
  --surface: var(--surface-glass);
}
:root[data-surface="solid"] { --surface: var(--surface-solid); }

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #F2EFE9;
  --ink: #1B1813;
  --ink-2: #514B42;
  --ink-3: #6F695F;
  --line: rgba(27, 24, 19, .10);
  --line-strong: rgba(27, 24, 19, .20);
  --surface-glass: rgba(255, 255, 255, .76);
  --surface-solid: #FFFFFF;
  --surface-hover: rgba(27, 24, 19, .05);
  --fill: rgba(27, 24, 19, .045);
  --accent: #E4502B;
  --accent-ink: #FFFFFF;
  --accent-text: #BF3A18;
  --accent-soft: rgba(228, 80, 43, .10);
  --teal: #0B7A85;
  --teal-soft: rgba(11, 122, 133, .10);
  --good: #14774A;
  --good-soft: rgba(20, 119, 74, .10);
  --bad: #C0283A;
  --bad-soft: rgba(192, 40, 58, .09);
  --warn: #B7640A;
  --shadow-md: 0 1px 2px rgba(27, 24, 19, .05), 0 14px 34px -14px rgba(27, 24, 19, .20);
  --shadow-lg: 0 2px 4px rgba(27, 24, 19, .06), 0 30px 70px -20px rgba(27, 24, 19, .32);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B0B0D;
  --ink: #F4F2EE;
  --ink-2: #B9B5AD;
  --ink-3: #8C8880;
  --line: rgba(255, 255, 255, .09);
  --line-strong: rgba(255, 255, 255, .17);
  --surface-glass: rgba(20, 20, 24, .74);
  --surface-solid: #151519;
  --surface-hover: rgba(255, 255, 255, .06);
  --fill: rgba(255, 255, 255, .05);
  --accent: #FF8B66;
  --accent-ink: #1D0B04;
  --accent-text: #FF9B7B;
  --accent-soft: rgba(255, 139, 102, .15);
  --teal: #62D2DC;
  --teal-soft: rgba(98, 210, 220, .13);
  --good: #4ADE9A;
  --good-soft: rgba(74, 222, 154, .12);
  --bad: #FF7A89;
  --bad-soft: rgba(255, 122, 137, .12);
  --warn: #F5B454;
  --shadow-md: 0 1px 2px rgba(0, 0, 0, .4), 0 16px 40px -16px rgba(0, 0, 0, .7);
  --shadow-lg: 0 2px 4px rgba(0, 0, 0, .5), 0 34px 80px -24px rgba(0, 0, 0, .85);
}

/* ==========================================================================
   2. BASE
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.55;
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; }
img { display: block; max-width: 100%; }
p { margin: 0; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -.015em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: var(--accent-soft); }

.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.eyebrow {
  font: 600 11px/1 var(--font-mono);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
kbd {
  font: 500 11px/1 var(--font-mono);
  padding: 3px 6px;
  border-radius: 6px;
  border: 1px solid var(--line-strong);
  color: var(--ink-2);
}

/* ==========================================================================
   3. SHELL  (topbar · stage · dock)
   ========================================================================== */
.app {
  position: relative;
  isolation: isolate;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

/* Ambient photo wall. Calm, dimmed, never competes with content. */
.backdrop { position: absolute; inset: 0; z-index: -1; overflow: hidden; background: var(--bg); }
.backdrop::after {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(120% 90% at 50% 35%,
    color-mix(in srgb, var(--bg) 92%, transparent),
    color-mix(in srgb, var(--bg) 80%, transparent));
}
.backdrop-cols {
  --gap: clamp(10px, 1.6vw, 22px);
  position: absolute; inset: 0 clamp(8px, 3vw, 44px);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: var(--gap);
}
.backdrop-col {
  display: flex; flex-direction: column;
  gap: var(--gap);
  padding-bottom: var(--gap);
  animation: drift 90s linear infinite;
  will-change: transform;
}
.backdrop-col:nth-child(even) { animation-direction: reverse; animation-duration: 120s; }
.backdrop-col:nth-child(3) { animation-duration: 105s; }
.backdrop-col img {
  flex: none; width: 100%; aspect-ratio: 3 / 4; object-fit: cover;
  border-radius: var(--r-lg);
  filter: saturate(.85);
}
@keyframes drift { to { transform: translateY(-50%); } }

/* Topbar */
.topbar {
  flex: none;
  display: flex; align-items: center; gap: 16px;
  height: var(--topbar-h);
  padding: 0 clamp(12px, 2vw, 24px);
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  backdrop-filter: blur(18px) saturate(1.4);
  z-index: 5;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
.brand-mark {
  width: 28px; height: 28px; border-radius: 9px;
  display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink);
}
.topbar-spacer { flex: 1; }
.toolbar { display: flex; align-items: center; gap: 8px; }

.timer {
  display: inline-flex; align-items: center; gap: 8px;
  height: 36px; padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  font: 500 14px/1 var(--font-mono);
  font-variant-numeric: tabular-nums;
  color: var(--ink-2);
  transition: color var(--dur-2), border-color var(--dur-2), background var(--dur-2);
}
.timer.is-warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
.timer.is-crit {
  color: var(--bad); border-color: color-mix(in srgb, var(--bad) 55%, transparent);
  background: var(--bad-soft); animation: pulse 1s ease-in-out infinite;
}
@keyframes pulse { 50% { opacity: .65; } }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 16px;
  border-radius: var(--r-md);
  border: 1px solid var(--line-strong);
  background: var(--surface);
  font-size: 14px; font-weight: 500; white-space: nowrap;
  transition: background var(--dur-1), border-color var(--dur-1), color var(--dur-1), transform var(--dur-1) var(--ease-out);
}
.btn:hover:not(:disabled) { background: var(--surface-hover); border-color: var(--ink-3); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .4; }
.btn-icon { width: 40px; padding: 0; }
.btn[aria-pressed="true"], .btn.is-open {
  background: var(--accent-soft);
  border-color: color-mix(in srgb, var(--accent) 50%, transparent);
  color: var(--accent-text);
}
.btn-primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn-primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-music { max-width: 280px; }
.btn-music .btn-label { overflow: hidden; text-overflow: ellipsis; }
.btn svg { flex: none; }

/* Workspace = stage + dock side by side. The dock pushes the stage; nothing overlaps. */
.workspace { flex: 1; min-height: 0; display: flex; }
.stage { position: relative; flex: 1; min-width: 0; container: stage / inline-size; }
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  overflow-x: hidden; overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}

.dock {
  --dock-w: 0px;
  position: relative; flex: none;
  width: var(--dock-w);
  overflow: hidden;
  transition: width var(--dur-4) var(--ease-out);
}
.app[data-dock="music"] .dock { --dock-w: clamp(320px, 30vw, 420px); }
.app[data-dock="calc"]  .dock { --dock-w: 304px; }
.dock-panel {
  position: absolute; top: 0; bottom: 0; right: 0;
  width: var(--panel-w);
  display: flex; flex-direction: column;
  background: var(--surface);
  border-left: 1px solid var(--line);
  -webkit-backdrop-filter: blur(18px) saturate(1.3);
  backdrop-filter: blur(18px) saturate(1.3);
  opacity: 0; visibility: hidden;
  transform: translateX(24px);
  transition: opacity var(--dur-3) var(--ease-out), transform var(--dur-3) var(--ease-out), visibility 0s var(--dur-3);
}
.dock-panel[data-panel="music"] { --panel-w: clamp(320px, 30vw, 420px); }
.dock-panel[data-panel="calc"]  { --panel-w: 304px; }
.dock-panel.is-active {
  opacity: 1; visibility: visible; transform: none;
  transition-delay: 60ms, 60ms, 0s;
}
.dock-head {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  padding: 16px 16px 12px 20px;
}
.dock-head h2 { font-size: 15px; }
.dock-body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; padding: 4px 16px 24px; }
.dock-scrim { display: none; }

/* Surfaces */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-md);
  -webkit-backdrop-filter: blur(18px) saturate(1.3);
  backdrop-filter: blur(18px) saturate(1.3);
}

/* ==========================================================================
   4. INTRO
   ========================================================================== */
.intro {
  position: absolute; inset: 0; z-index: 50;
  display: grid; place-items: center; align-content: center; gap: 28px;
  background: #0A0A0C; color: #F4F2EE;
  cursor: pointer;
  transition: opacity var(--dur-4) var(--ease-in-out), transform var(--dur-4) var(--ease-in-out);
}
.intro.is-leaving { opacity: 0; transform: scale(1.03); pointer-events: none; }
.intro-text {
  min-height: 1.2em;
  font: 400 clamp(44px, 9vw, 104px)/1.1 var(--font-display);
  letter-spacing: -.02em;
}
.caret {
  display: inline-block; width: 3px; height: .8em; margin-left: 6px;
  background: #FF8B66; vertical-align: -.05em;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.intro-skip {
  display: inline-flex; align-items: center; gap: 10px;
  font-size: 13px; color: #A8A49C;
}
.intro-skip:hover { color: #F4F2EE; }
.intro kbd { color: #A8A49C; border-color: rgba(255, 255, 255, .2); }

/* ==========================================================================
   5. QUIZ
   ========================================================================== */
.quiz { align-items: center; padding: clamp(16px, 3vh, 32px) 24px 32px; }
.quiz-progress { width: min(100%, 560px); margin-bottom: clamp(16px, 3vh, 28px); transition: width var(--dur-4) var(--ease-out); }
.quiz-progress.is-wide { width: min(100%, 1000px); }
.quiz-progress-meta {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 10px;
}
.quiz-hint { font-size: 12px; color: var(--ink-3); }
.rail { display: flex; gap: 6px; }
.rail-seg { flex: 1; height: 4px; border-radius: 999px; background: var(--line-strong); overflow: hidden; }
.rail-seg > span {
  display: block; height: 100%; border-radius: inherit; background: var(--accent);
  transform: scaleX(0); transform-origin: left;
  transition: transform var(--dur-4) var(--ease-out);
}
.rail-seg.is-done > span { transform: scaleX(1); }
.rail-seg.is-current > span { transform: scaleX(.5); }

.deck {
  width: 100%;
  margin-block: auto;
  display: grid;
  justify-items: center; align-items: center;
  overflow-x: clip;
}
.qcard {
  --o: 0;
  --card-w: 560px;
  grid-area: 1 / 1;
  width: min(100%, var(--card-w));
  padding: clamp(20px, 3vw, 32px);
  opacity: 0; z-index: 1; pointer-events: none;
  transform: translateX(calc(var(--o) * 72%)) scale(.93);
  transition: transform var(--dur-4) var(--ease-out), opacity var(--dur-3) var(--ease-out);
}
.qcard.has-image { --card-w: 1000px; }
.qcard[data-state="near"] { opacity: .32; z-index: 2; }
.qcard[data-state="active"] { opacity: 1; z-index: 3; pointer-events: auto; transform: none; }
.qcard-body { display: grid; gap: 24px; }
.qcard-main { min-width: 0; }
.qcard-kicker { margin-bottom: 14px; color: var(--accent-text); }
.qimage {
  margin: 0; min-width: 0;
  display: grid; place-items: center;
  padding: 12px;
  border-radius: var(--r-lg);
  background: var(--fill);
  border: 1px solid var(--line);
}
.qimage img { max-height: min(52vh, 480px); object-fit: contain; border-radius: var(--r-md); }
@container stage (min-width: 880px) {
  .qcard.has-image .qcard-body { grid-template-columns: minmax(0, .42fr) minmax(0, .58fr); align-items: start; }
}

.qtext { font-size: 17px; line-height: 1.7; font-weight: 450; margin-bottom: 24px; text-wrap: pretty; }
.wave-word { display: inline-block; }
.wave.is-waving .wave-word {
  animation: wave 900ms var(--ease-in-out) both;
  animation-delay: calc(var(--i) * 22ms + 450ms);
}
@keyframes wave {
  0%, 100% { transform: translateY(0); color: inherit; }
  50% { transform: translateY(-6px); color: var(--accent-text); }
}

.options { display: grid; gap: 8px; }
.option {
  position: relative;
  display: flex; align-items: center; gap: 14px;
  width: 100%; padding: 12px 14px; text-align: left;
  border-radius: 14px;
  border: 1px solid var(--line-strong);
  background: var(--fill);
  font-weight: 500; font-size: 15px; line-height: 1.4;
  transition: background var(--dur-1), border-color var(--dur-1), opacity var(--dur-2), transform var(--dur-2) var(--ease-out);
}
.option-key {
  flex: none; width: 28px; height: 28px; border-radius: 9px;
  display: grid; place-items: center;
  font: 600 12px/1 var(--font-mono);
  color: var(--ink-2);
  border: 1px solid var(--line-strong);
  transition: inherit;
}
.option-label { flex: 1; min-width: 0; }
.option:hover:not(:disabled) { background: var(--surface-hover); border-color: var(--ink-3); transform: translateX(3px); }
.option.is-selected { border-color: var(--accent); background: var(--accent-soft); }
.option.is-selected .option-key { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.option.is-dim { opacity: .4; }

/* ==========================================================================
   6. RESULTS
   ========================================================================== */
.results {
  width: min(100%, 1180px); margin: 0 auto;
  padding: clamp(20px, 4vh, 40px) clamp(16px, 3vw, 32px) 56px;
  display: flex; flex-direction: column; gap: 16px;
}
.results-head { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px; margin-bottom: 8px; }
.display {
  font: 400 clamp(38px, 5vw, 60px)/1.02 var(--font-display);
  letter-spacing: -.02em;
  margin: 10px 0 8px;
}
.muted { color: var(--ink-3); }
.sub { font-size: 14px; color: var(--ink-3); }
.actions { display: flex; gap: 10px; }

.grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@container stage (min-width: 620px) {
  .grid.metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid.stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@container stage (min-width: 980px) {
  .grid.metrics { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid.analytics { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
}

.reveal { animation: rise 700ms var(--ease-out) both; animation-delay: calc(var(--d, 0) * 1ms); }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } }

.metric { padding: 22px; min-height: 176px; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; transition: border-color var(--dur-2), transform var(--dur-3) var(--ease-out); }
.metric:hover { border-color: var(--line-strong); transform: translateY(-3px); }
.metric-head { display: flex; justify-content: space-between; align-items: center; }
.chip {
  width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center;
  background: var(--fill); border: 1px solid var(--line); color: var(--ink-2);
}
.big { font: 400 56px/1 var(--font-display); letter-spacing: -.02em; font-variant-numeric: lining-nums; }
.big small { font-size: .5em; color: var(--ink-3); }
.meter { height: 4px; border-radius: 999px; background: var(--line-strong); overflow: hidden; margin: 12px 0 8px; }
.meter > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); animation: fill 1.2s var(--ease-out) .5s both; }
@keyframes fill { from { width: 0; } }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

.ring { position: relative; flex: none; display: grid; place-items: center; }
.ring svg { transform: rotate(-90deg); overflow: visible; }
.ring-track { stroke: var(--line-strong); }
.ring-bar { stroke: var(--accent); stroke-linecap: round; animation: ring 1.5s var(--ease-out) .4s both; }
@keyframes ring { from { stroke-dashoffset: var(--c); } }
.ring-label { position: absolute; font: 400 34px/1 var(--font-display); font-variant-numeric: lining-nums; }

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px; border-radius: 999px;
  font: 600 11px/1.5 var(--font-mono); white-space: nowrap;
  animation: pop .5s var(--ease-out) 1.1s both;
}
.pill.up { color: var(--good); background: var(--good-soft); }
.pill.down { color: var(--bad); background: var(--bad-soft); }
.pill.plain { animation: none; }
@keyframes pop { from { opacity: 0; transform: scale(.5); } }

.bars { display: flex; align-items: flex-end; gap: 5px; height: 40px; }
.bars span {
  width: 8px; border-radius: 999px; background: var(--line-strong); transform-origin: bottom;
  animation: grow .7s var(--ease-out) both; animation-delay: calc(.6s + var(--i) * 70ms);
}
.bars span:last-child { background: var(--accent); }
@keyframes grow { from { transform: scaleY(0); } }

.panel { padding: 24px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 12px; }
.panel-head h3 { font-size: 16px; margin-top: 6px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--fill); border: 1px solid var(--line); }
.seg button { padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; color: var(--ink-3); transition: background var(--dur-1), color var(--dur-1); }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface-solid); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }
.chart { position: relative; height: 280px; }

/* Turns [{type:'type',...}] into a flat list of {text, wait} frames to play back. */
function buildFrames(sequence) {
  const frames = [];
  let text = '';
  for (const step of sequence) {
    if (step.type === 'type') {
      for (const ch of step.text) { text += ch; frames.push({ text, wait: step.speed }); }
    } else if (step.type === 'delete') {
      while (text.length) { text = text.slice(0, -1); frames.push({ text, wait: step.speed }); }
    } else {
      frames.push({ text, wait: step.ms });
    }
  }
  return frames;
}

/* Deadline-based countdown: stays accurate even if the tab is throttled. */
function useCountdown({ total, running, onExpire }) {
  const [remaining, setRemaining] = useState(total);
  const remainingRef = useRef(total);
  const onExpireRef = useRef(onExpire);
  onExpireRef.current = onExpire;

  useEffect(() => {
    if (!running) return undefined;
    const endsAt = Date.now() + remainingRef.current * 1000;
    const id = setInterval(() => {
      const left = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
      remainingRef.current = left;
      setRemaining(left);
      if (left === 0) { clearInterval(id); onExpireRef.current(); }
    }, 250);
    return () => clearInterval(id);
  }, [running]);

  const reset = useCallback(() => { remainingRef.current = total; setRemaining(total); }, [total]);
  return { remaining, remainingRef, reset };
}

/* One <audio> element for the whole app. Refs keep the event handlers free of stale state. */
function useAudioPlayer(playlists) {
  const audioRef = useRef(null);
  const [track, setTrack] = useState({ playlistId: playlists[0].id, index: 0 });
  const trackRef = useRef(track);
  const [isPlaying, setIsPlaying] = useState(false);
  const [progress, setProgress] = useState({ current: 0, duration: 0 });
  const [failed, setFailed] = useState(false);

  const playlistOf = useCallback((id) => playlists.find((p) => p.id === id), [playlists]);

  const load = useCallback((next, autoplay) => {
    const audio = audioRef.current;
    trackRef.current = next;
    setTrack(next);
    setFailed(false);
    setProgress({ current: 0, duration: 0 });
    audio.src = playlistOf(next.playlistId).songs[next.index].url;
    if (autoplay) audio.play().catch(() => setIsPlaying(false));
  }, [playlistOf]);

  const step = useCallback((dir) => {
    const { playlistId, index } = trackRef.current;
    const count = playlistOf(playlistId).songs.length;
    load({ playlistId, index: (index + dir + count) % count }, true);
  }, [load, playlistOf]);

  useEffect(() => {
    const audio = new Audio();
    audio.preload = 'none';
    audio.volume = 0.35;
    audio.src = playlistOf(trackRef.current.playlistId).songs[trackRef.current.index].url;
    audioRef.current = audio;

    const on = {
      play: () => setIsPlaying(true),
      pause: () => setIsPlaying(false),
      ended: () => step(1),
      error: () => { setFailed(true); setIsPlaying(false); },
      timeupdate: () => setProgress({ current: audio.currentTime, duration: audio.duration || 0 }),
      loadedmetadata: () => setProgress({ current: audio.currentTime, duration: audio.duration || 0 }),
    };
    Object.entries(on).forEach(([name, fn]) => audio.addEventListener(name, fn));
    return () => {
      Object.entries(on).forEach(([name, fn]) => audio.removeEventListener(name, fn));
      audio.pause();
      audio.removeAttribute('src');
      audioRef.current = null;
    };
  }, [playlistOf, step]);

  const toggle = useCallback(() => {
    const audio = audioRef.current;
    if (!audio) return;
    if (audio.paused) audio.play().catch(() => setFailed(true)); else audio.pause();
  }, []);

  const playTrack = useCallback((playlistId, index) => {
    const cur = trackRef.current;
    if (cur.playlistId === playlistId && cur.index === index) toggle();
    else load({ playlistId, index }, true);
  }, [load, toggle]);

  const seek = useCallback((seconds) => { if (audioRef.current) audioRef.current.currentTime = seconds; }, []);

  const playlist = playlistOf(track.playlistId);
  return { playlists, playlist, track, song: playlist.songs[track.index], isPlaying, progress, failed, toggle, playTrack, seek, next: () => step(1), prev: () => step(-1) };
}

function quizReducer(state, action) {
  switch (action.type) {
    case 'START':
      return state.phase === 'intro' ? { ...state, phase: 'quiz' } : state;
    case 'SELECT': {
      if (state.phase !== 'quiz' || state.locked) return state;
      const answers = state.answers.slice();
      answers[state.index] = action.choice;
      return { ...state, answers, locked: true };
    }
    case 'NEXT':
      return { ...state, index: state.index + 1, locked: false };
    case 'FINISH':
      return { ...state, phase: 'results', locked: false, timeUp: action.timeUp, timeUsed: action.timeUsed };
    case 'RETRY':
      return { ...initialQuizState(), phase: 'quiz' };
    case 'REVIEW':
      return { ...state, phase: 'review', reviewIndex: action.index ?? 0, viewerIndex: null };
    case 'RESULTS':
      return { ...state, phase: 'results', viewerIndex: null };
    case 'REVIEW_GO':
      return { ...state, reviewIndex: clamp(action.index, 0, QUESTIONS.length - 1) };
    case 'VIEWER_OPEN':
      return { ...state, viewerIndex: action.index };
    case 'VIEWER_GO': {
      const count = QUESTIONS[state.reviewIndex].explanation.images.length;
      return { ...state, viewerIndex: clamp(action.index, 0, count - 1) };
    }
    case 'VIEWER_CLOSE':
      return { ...state, viewerIndex: null };
    default:
      return state;
  }
}

const CALC_INITIAL = { display: '0', acc: null, op: null, fresh: true };

function formatCalc(n) {
  if (!Number.isFinite(n)) return 'Error';
  const s = String(parseFloat(n.toPrecision(10)));
  return s.length > 12 ? n.toExponential(5) : s;
}

function calcReducer(s, a) {
  const isError = s.display === 'Error';
  switch (a.type) {
    case 'digit':
      if (s.fresh || s.display === '0') return { ...s, display: a.value, fresh: false };
      if (s.display.replace(/[-.]/g, '').length >= 10) return s;
      return { ...s, display: s.display + a.value };
    case 'dot':
      if (s.fresh) return { ...s, display: '0.', fresh: false };
      return s.display.includes('.') ? s : { ...s, display: s.display + '.' };
    case 'op': {
      if (isError) return s;
      const current = parseFloat(s.display);
      if (s.op && s.acc !== null && !s.fresh) {

        const ok = Number.isFinite(result);
        return { display: formatCalc(result), acc: ok ? result : null, op: ok ? a.value : null, fresh: true };
      }

    }
    case 'equals': {
      if (!s.op || s.acc === null) return s;
      return { display: formatCalc(CALC_OPS[s.op](s.acc, parseFloat(s.display))), acc: null, op: null, fresh: true };
    }
    case 'clear':
      return CALC_INITIAL;
    case 'negate':
      if (isError || s.display === '0') return s;
      return { ...s, display: s.display.startsWith('-') ? s.display.slice(1) : '-' + s.display };
    case 'percent':
      return isError ? s : { ...s, display: formatCalc(parseFloat(s.display) / 100), fresh: true };
    case 'back': {
      if (s.fresh) return s;
      const next = s.display.slice(0, -1);
      return { ...s, display: next === '' || next === '-' ? '0' : next };

    const frames = buildFrames(INTRO_SEQUENCE);
    let i = 0;
    let timer;
    const tick = () => {
      if (i >= frames.length) { onDone(); return; }
      const frame = frames[i++];
      setText(frame.text);
      timer = setTimeout(tick, frame.wait);
    };
    timer = setTimeout(tick, 300);
    return () => clearTimeout(timer);
  }, [onDone]);

  return html`<div className=${cx('intro', leaving && 'is-leaving')} onClick=${onDone} role="dialog" aria-label="Welcome">
    <p className="intro-text" aria-live="off">${text}<span className="caret" /></p>
    <button className="intro-skip" onClick=${onDone}>Skip intro <kbd>Space</kbd></button>
  </div>`;
}

function WaveText({ text, play }) {
  const words = useMemo(() => text.split(/\s+/), [text]);
  return html`<p className=${cx('qtext', 'wave', play && 'is-waving')}>
    ${words.map((word, i) => html`<${Fragment} key=${i}>
      <span className="wave-word" style=${{ '--i': i }}>${word}</span>${i < words.length - 1 ? ' ' : ''}
    <//>`)}
  </p>`;
}

function AnimatedNumber({ value, suffix = '', duration = 1000 }) {
  const [shown, setShown] = useState(prefersReducedMotion() ? value : 0);
  useEffect(() => {
    if (prefersReducedMotion()) { setShown(value); return undefined; }
    const start = performance.now();
    let raf;
    const tick = (now) => {
      const t = Math.min(1, (now - start) / duration);
      setShown(Math.round(value * (1 - Math.pow(1 - t, 4))));
      if (t < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [value, duration]);
  return html`<${Fragment}>${shown}${suffix}<//>`;
}

function CalculatorPanel({ active, onClose }) {
  const [calc, dispatch] = useReducer(calcReducer, CALC_INITIAL);

  /* While the calculator is docked it owns the keyboard, so digits don't answer questions. */
  useEffect(() => {
    if (!active) return undefined;
    const onKey = (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const action = calcActionForKey(e);
      if (!action) return;
      e.preventDefault();
      dispatch(action);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [active]);

  const pending = calc.fresh ? calc.op : null;
  const expr = calc.op && calc.acc !== null ? `${formatCalc(calc.acc)} ${CALC_SYMBOL[calc.op]}` : '';
  return html`<${DockPanel} id="calc" title="Calculator" active=${active} onClose=${onClose}>
    <div className="calc">
      <div className="calc-screen" aria-live="polite">
        <div className="calc-expr">${expr}</div>
        <div className=${cx('calc-value', calc.display.length > 9 && 'is-small')}>${calc.display}</div>
      </div>
      <div className="calc-grid">
        ${CALC_KEYS.map((key) => html`<button key=${key.label} type="button"
          className=${cx('calc-key', key.kind, key.action.type === 'op' && key.action.value === pending && 'is-pending')}
          onMouseDown=${(e) => e.preventDefault()} onClick=${() => dispatch(key.action)}>${key.label}</button>`)}
      </div>
    </div>
  <//>`;
}

function ScoreRing({ percent, size = 120 }) {
  const stroke = 10;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  return html`<div className="ring" style=${{ width: size, height: size }}>
    <svg width=${size} height=${size} viewBox=${`0 0 ${size} ${size}`} aria-hidden="true">
      <circle className="ring-track" cx=${size / 2} cy=${size / 2} r=${r} fill="none" strokeWidth=${stroke} />
      <circle className="ring-bar" cx=${size / 2} cy=${size / 2} r=${r} fill="none" strokeWidth=${stroke}
        strokeDasharray=${c} strokeDashoffset=${c * (1 - percent / 100)} style=${{ '--c': c }} />
    </svg>
    <span className="ring-label"><${AnimatedNumber} value=${percent} suffix="%" duration=${1400} /></span>
  </div>`;
}

function AttemptBars({ history }) {
  return html`<div className="bars" aria-hidden="true">
    ${history.slice(-6).map((a, i) => html`<span key=${a.at + '-' + i} style=${{ '--i': i, height: `${Math.max(18, percentOf(a))}%` }} title=${`${percentOf(a)}%`} />`)}
  </div>`;
}

function withAlpha(hex, alpha) {
  const n = parseInt(hex.replace('#', ''), 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
}

function HistoryChart({ scores, theme }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current || typeof Chart === 'undefined') return undefined;
    const css = getComputedStyle(document.documentElement);
    const token = (name) => css.getPropertyValue(name).trim();
    const accent = token('--accent');
    const canvas = canvasRef.current;
    const gradient = canvas.getContext('2d').createLinearGradient(0, 0, 0, canvas.clientHeight || 280);
    gradient.addColorStop(0, withAlpha(accent, 0.28));
    gradient.addColorStop(1, withAlpha(accent, 0));
    const tickFont = { family: 'Inter', size: 11 };

    const chart = new Chart(canvas, {
      type: 'line',
      data: {
        labels: scores.map((_, i) => `#${i + 1}`),
        datasets: [{
          data: scores, borderColor: accent, borderWidth: 2.5, backgroundColor: gradient, fill: true, tension: 0.35,
          pointRadius: scores.length > 1 ? 3.5 : 5, pointHoverRadius: 6,
          pointBackgroundColor: token('--surface-solid'), pointBorderColor: accent, pointBorderWidth: 2,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        animation: { duration: prefersReducedMotion() ? 0 : 900, easing: 'easeOutQuart' },
        interaction: { intersect: false, mode: 'index' },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: token('--surface-solid'), titleColor: token('--ink-3'), bodyColor: token('--ink'),
            borderColor: token('--line-strong'), borderWidth: 1, padding: 12, displayColors: false,
            titleFont: tickFont, bodyFont: { family: 'JetBrains Mono', size: 13, weight: '600' },
            callbacks: { label: (c) => `${c.raw}%` },
          },
        },
        scales: {
          x: { grid: { display: false }, border: { display: false }, ticks: { color: token('--ink-3'), font: tickFont } },
          y: {
            min: 0, max: 100, border: { display: false }, grid: { color: token('--line') },
            ticks: { stepSize: 25, callback: (v) => `${v}%`, color: token('--ink-3'), font: tickFont },
          },
        },
      },
    });
    return () => chart.destroy();
  }, [scores.join(','), theme]);
  return html`<div className="chart"><canvas ref=${canvasRef} role="img" aria-label=${`Score history: ${scores.join('%, ')}%`} /></div>`;
}

function ResultsScreen({ state, history, theme, onReview, onRetry }) {
  const [range, setRange] = useState('all');
  const attempt = history[history.length - 1];
  const prev = history.length > 1 ? history[history.length - 2] : null;

  const scorePct = percentOf(attempt);
  const bestPct = Math.max(...history.map(percentOf));
  const avgPct = Math.round(history.reduce((sum, a) => sum + percentOf(a), 0) / history.length);
  const totalTime = history.reduce((sum, a) => sum + a.timeUsed, 0);
  const scoreDelta = prev ? scorePct - percentOf(prev) : null;
  const timeDelta = prev ? prev.timeUsed - attempt.timeUsed : null;
  const timePct = Math.min(100, Math.round((attempt.timeUsed / CONFIG.durationSeconds) * 100));
  const chartScores = (range === 'all' ? history : history.slice(-5)).map(percentOf);
  const stagger = (n) => ({ '--d': 80 + n * 80 });

  const stats = [
    { label: 'Correct answers', value: `${attempt.score}/${attempt.total}`, icon: 'check', tone: 'tone-good' },
    { label: 'Average score', value: `${avgPct}%`, icon: 'trend', tone: 'tone-accent' },
    { label: 'Total study time', value: formatClock(totalTime), icon: 'clock', tone: 'tone-teal' },
  ];

  return html`<section className="screen" aria-label="Results"><div className="results">
    <div className="results-head reveal">
      <div>
        <p className="eyebrow tone-accent">Session report</p>
        <h1 className="display">${state.timeUp ? "Time's up." : 'Quiz complete.'}</h1>
        <p className="sub">${attempt.total} questions · Attempt ${history.length} · ${new Date(attempt.at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</p>
      </div>
      <div className="actions">
        <button className="btn" onClick=${() => onReview(0)}><${Icon} name="fileText" size=${16} />Review answers</button>
        <button className="btn btn-primary" onClick=${onRetry}><${Icon} name="retry" size=${16} />Retry</button>
      </div>
    </div>

    <div className="grid metrics">
      <article className="card metric reveal" style=${stagger(0)}>
        <div className="row" style=${{ flexWrap: 'nowrap', gap: 18 }}>
          <${ScoreRing} percent=${scorePct} />
          <div style=${{ display: 'grid', gap: 8 }}>
            <span className="eyebrow">Score</span>
            <span className="sub">${attempt.score} of ${attempt.total} correct</span>
            ${scoreDelta !== null && html`<${Pill} tone=${scoreDelta >= 0 ? 'up' : 'down'}>${scoreDelta >= 0 ? '▲' : '▼'} ${Math.abs(scoreDelta)} pts vs prev<//>`}
          </div>
        </div>
      </article>

      <article className="card metric reveal" style=${stagger(1)}>
        <div className="metric-head"><span className="eyebrow">Time used</span><span className="chip"><${Icon} name="timer" size=${16} /></span></div>
        <div>
          <div className="big mono" style=${{ fontFamily: 'var(--font-display)' }}>${formatClock(attempt.timeUsed)}</div>
          <div className="meter"><span style=${{ width: `${timePct}%` }} /></div>
          <div className="row">
            <span className="sub" style=${{ fontSize: 12 }}>${timePct}% of ${formatClock(CONFIG.durationSeconds)}</span>
            ${timeDelta !== null && timeDelta !== 0 && html`<${Pill} tone=${timeDelta > 0 ? 'up' : 'down'}>${Math.abs(timeDelta)}s ${timeDelta > 0 ? 'faster' : 'slower'}<//>`}
          </div>
        </div>
      </article>

      <article className="card metric reveal" style=${stagger(2)}>
        <div className="metric-head"><span className="eyebrow">Best score</span><span className="chip"><${Icon} name="trophy" size=${16} /></span></div>
        <div>
          <div className="big"><${AnimatedNumber} value=${bestPct} suffix="%" /></div>
          <div className="row" style=${{ marginTop: 10 }}>
            <span className="sub" style=${{ fontSize: 12 }}>across ${history.length} attempt${history.length === 1 ? '' : 's'}</span>
            ${history.length > 1 && scorePct >= bestPct && html`<${Pill} tone="up">★ Personal best<//>`}
          </div>
        </div>
      </article>

      <article className="card metric reveal" style=${stagger(3)}>
        <div className="metric-head"><span className="eyebrow">Attempts</span><span className="chip"><${Icon} name="stack" size=${16} /></span></div>
        <div className="row" style=${{ alignItems: 'flex-end', flexWrap: 'nowrap' }}>
          <div className="big"><${AnimatedNumber} value=${history.length} /></div>
          <${AttemptBars} history=${history} />
        </div>
      </article>
    </div>

    <div className="grid analytics">
      <article className="card panel reveal" style=${stagger(4)}>
        <div className="panel-head">
          <div><p className="eyebrow">Analytics</p><h3>Performance history</h3></div>
          <div className="seg" role="group" aria-label="History range">
            <button aria-pressed=${range === 'all'} onClick=${() => setRange('all')}>All</button>
            <button aria-pressed=${range === 'last'} onClick=${() => setRange('last')}>Last 5</button>
          </div>
        </div>
        <${HistoryChart} scores=${chartScores} theme=${theme} />
      </article>

      <article className="card panel reveal" style=${stagger(5)}>
        <div className="panel-head">
          <div><p className="eyebrow">Breakdown</p><h3>Question results</h3></div>
          <span className="pill plain tone-accent mono" style=${{ background: 'var(--accent-soft)' }}>${attempt.score}/${attempt.total}</span>
        </div>
        ${QUESTIONS.map((q, i) => {
          const choice = state.answers[i];
          const right = choice === q.answer;
          return html`<button key=${q.id} className="break-row" style=${{ width: '100%', textAlign: 'left' }} onClick=${() => onReview(i)}>

            <${Icon} name="chevronRight" size=${16} />
          </button>`;

      </article>

    <div className="grid stats">
      ${stats.map((s, i) => html`<article key=${s.label} className="card stat reveal" style=${stagger(6 + i)}>

      </article>`)}
    </div>
  </div></section>`;
}

function Explanation({ text }) {
  return html`<div className="prose">
    ${text.split(/\n\n+/).map((para, i) => {
      if (para.startsWith('Educational objective:')) {
        return html`<div className="callout" key=${i}>
          <p className="eyebrow">Educational objective</p>
          <p>${para.replace(/^Educational objective:\s*/, '')}</p>
        </div>`;
      }
      const choice = para.match(/^\((Choices? [A-F](?: and [A-F])?)\)\s*([\s\S]*)$/);
      if (choice) return html`<p className="choice" key=${i}><b>${choice[1]}</b> ${choice[2]}</p>`;
      return html`<p key=${i}>${para}</p>`;
    })}
  </div>`;
}

function ReviewAnswers({ q, chosen }) {
  return html`<div role="list">
    ${q.options.map((opt, i) => {
      const correct = i === q.answer;
      const wrong = i === chosen && !correct;
      return html`<div key=${i} role="listitem" className=${cx('answer', correct && 'is-correct', wrong && 'is-wrong')}>
        <${Icon} name=${correct ? 'check' : wrong ? 'x' : 'plus'} size=${16} className=${correct || wrong ? '' : 'sr-only'} />
        <span>${opt}</span>

        ${wrong && html`<span className="answer-tag">Your answer</span>`}
      </div>`;
    })}

}

function ImageViewer({ q, index, dispatch }) {
  const images = q.explanation.images;
  const startX = useRef(null);
  const closeRef = useRef(null);
  useEffect(() => { if (closeRef.current) closeRef.current.focus(); }, []);

  const onPointerDown = (e) => { startX.current = e.clientX; };
  const onPointerUp = (e) => {
    if (startX.current === null) return;
    const dx = e.clientX - startX.current;
    startX.current = null;
    if (Math.abs(dx) > 40) dispatch({ type: 'VIEWER_GO', index: index + (dx < 0 ? 1 : -1) });
  };

  return html`<div className="viewer" role="dialog" aria-modal="true" aria-label="Explanation images">
    <div className="viewer-bar">
      <span className="eyebrow">Image <span className="mono">${index + 1} / ${images.length}</span></span>
      <button ref=${closeRef} className="btn" onClick=${() => dispatch({ type: 'VIEWER_CLOSE' })}><${Icon} name="x" size=${16} />Close</button>
    </div>
    <div className="viewer-body">
      <aside className="card viewer-side">
        <div className="pane-title"><span className="pane-badge q">${QUESTIONS.indexOf(q) + 1}</span><h2>Question</h2></div>
        <p className="review-stem" style=${{ fontSize: 13 }}>${q.stem}</p>
      </aside>
      <div className="card carousel" onPointerDown=${onPointerDown} onPointerUp=${onPointerUp} onPointerCancel=${() => { startX.current = null; }}>
        <div className="carousel-track" style=${{ '--idx': index }}>
          ${images.map((url, i) => html`<div className="carousel-slide" key=${i}><img src=${url} alt=${`Explanation image ${i + 1}`} draggable="false" /></div>`)}
        </div>
        <div className="carousel-foot">
          <button className="btn btn-icon" onClick=${() => dispatch({ type: 'VIEWER_GO', index: index - 1 })} disabled=${index === 0} aria-label="Previous image"><${Icon} name="chevronLeft" /></button>
          <div className="dots">${images.map((_, i) => html`<button key=${i} className=${cx('dot', i === index && 'is-current')} onClick=${() => dispatch({ type: 'VIEWER_GO', index: i })} aria-label=${`Image ${i + 1}`} />`)}</div>
          <button className="btn btn-icon" onClick=${() => dispatch({ type: 'VIEWER_GO', index: index + 1 })} disabled=${index === images.length - 1} aria-label="Next image"><${Icon} name="chevronRight" /></button>
        </div>
      </div>
      <aside className="card viewer-side">
        <div className="pane-title"><span className="pane-badge e">i</span><h2>Explanation</h2></div>
        <${Explanation} text=${q.explanation.text} />
      </aside>
    </div>
  </div>`;
}

function ReviewScreen({ state, dispatch }) {
  const i = state.reviewIndex;
  const q = QUESTIONS[i];
  const chosen = state.answers[i];
  const images = q.explanation.images;
  const last = QUESTIONS.length - 1;

  return html`<${Fragment}>
    <section className="screen" aria-label="Review"><div className="review">
      <div className="review-head">
        <button className="btn" onClick=${() => dispatch({ type: 'RESULTS' })}><${Icon} name="arrowLeft" size=${16} />Results</button>
        <h1 className="review-title">Question ${i + 1} <span className="muted">of ${QUESTIONS.length}</span></h1>
        <span style=${{ width: 100 }} className="topbar-spacer" />
      </div>

      <div className="review-grid">
        <article className="card panel">
          <div className="pane-title"><span className="pane-badge q">${i + 1}</span><h2>Question</h2></div>
          ${q.image && html`<figure className="review-q-image"><img src=${q.image} alt="Illustration for the question" onError=${hidePicture} /></figure>`}
          <p className="review-stem">${q.stem}</p>
          <${ReviewAnswers} q=${q} chosen=${chosen} />
          ${chosen === null && html`<p className="sub" style=${{ marginTop: 12 }}>You didn't answer this question.</p>`}
        </article>

        <article className="card panel">
          <div className="pane-title"><span className="pane-badge e">i</span><h2>Explanation</h2></div>
          ${images.length > 0 && html`<div className="thumbs">
            ${images.map((url, n) => html`<button key=${n} className="thumb" onClick=${() => dispatch({ type: 'VIEWER_OPEN', index: n })} aria-label=${`Open explanation image ${n + 1}`}>
              <img src=${url} alt="" loading="lazy" onError=${hidePicture} />
              <span className="thumb-zoom"><${Icon} name="zoom" size=${14} /></span>
            </button>`)}
          </div>`}
          <${Explanation} text=${q.explanation.text} />
        </article>
      </div>

      <nav className="pager" aria-label="Review navigation">
        <button className="btn" disabled=${i === 0} onClick=${() => dispatch({ type: 'REVIEW_GO', index: i - 1 })}><${Icon} name="chevronLeft" size=${16} />Previous</button>
        <div className="dots">${QUESTIONS.map((x, n) => html`<button key=${x.id} className=${cx('dot', n === i && 'is-current')} onClick=${() => dispatch({ type: 'REVIEW_GO', index: n })} aria-label=${`Question ${n + 1}`} />`)}</div>
        <button className="btn" disabled=${i === last} onClick=${() => dispatch({ type: 'REVIEW_GO', index: i + 1 })}>Next<${Icon} name="chevronRight" size=${16} /></button>
      </nav>
    </div></section>
    ${state.viewerIndex !== null && html`<${ImageViewer} q=${q} index=${state.viewerIndex} dispatch=${dispatch} />`}
  <//>`;
}

/* ==========================================================================
   13. APP
   ========================================================================== */
function App() {
  const [theme, setTheme] = useState(() => document.documentElement.dataset.theme);
  const [surface, setSurface] = useState(() => document.documentElement.dataset.surface);
  const [dock, setDock] = useState(null);                    // null | 'music' | 'calc'
  const [history, setHistory] = useState(loadHistory);
  const [state, dispatch] = useReducer(quizReducer, undefined, initialQuizState);
  const [introVisible, setIntroVisible] = useState(true);
  const [obscured, setObscured] = useState(false);

  const stateRef = useRef(state);
  stateRef.current = state;
  const dockRef = useRef(dock);
  dockRef.current = dock;

  const player = useAudioPlayer(PLAYLISTS);

  /* ---- finishing a run ---- */
  const countdownRef = useRef(null);
  const finish = useCallback((timeUp) => {
    const s = stateRef.current;
    if (s.phase !== 'quiz') return;
    const timeUsed = timeUp ? CONFIG.durationSeconds : CONFIG.durationSeconds - countdownRef.current.remainingRef.current;
    const attempt = { at: Date.now(), score: countCorrect(s.answers), total: QUESTIONS.length, timeUsed, timeUp };
    setHistory((h) => [...h, attempt]);
    dispatch({ type: 'FINISH', timeUp, timeUsed });
  }, []);

  const countdown = useCountdown({ total: CONFIG.durationSeconds, running: state.phase === 'quiz', onExpire: () => finish(true) });
  countdownRef.current = countdown;

  useEffect(() => { store.set(KEY.history, history.slice(-50)); }, [history]);

  /* Show feedback briefly, then move on (or finish after the last question). */
  useEffect(() => {
    if (!state.locked) return undefined;
    const timer = setTimeout(() => {
      if (stateRef.current.index + 1 < QUESTIONS.length) dispatch({ type: 'NEXT' });
      else finish(false);
    }, CONFIG.feedbackMs);
    return () => clearTimeout(timer);
  }, [state.locked, state.index, finish]);

  /* ---- appearance ---- */
  useEffect(() => { document.documentElement.dataset.theme = theme; }, [theme]);
  useEffect(() => { document.documentElement.dataset.surface = surface; }, [surface]);
  useEffect(() => {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = (e) => { if (store.get(KEY.theme, null) === null) setTheme(e.matches ? 'dark' : 'light'); };
    mq.addEventListener('change', onChange);
    return () => mq.removeEventListener('change', onChange);
  }, []);
  const toggleTheme = () => { const next = theme === 'dark' ? 'light' : 'dark'; store.set(KEY.theme, next); setTheme(next); };
  const toggleSurface = () => { const next = surface === 'solid' ? 'glass' : 'solid'; store.set(KEY.surface, next); setSurface(next); };
  const toggleDock = useCallback((name) => setDock((cur) => (cur === name ? null : name)), []);
  const closeDock = useCallback(() => setDock(null), []);

  /* ---- intro ---- */
  const startQuiz = useCallback(() => dispatch({ type: 'START' }), []);
  useEffect(() => {
    if (state.phase === 'intro') return undefined;
    const timer = setTimeout(() => setIntroVisible(false), 700);
    return () => clearTimeout(timer);
  }, [state.phase]);

  /* ---- actions ---- */
  const selectOption = useCallback((choice) => dispatch({ type: 'SELECT', choice }), []);
  const retry = useCallback(() => { countdownRef.current.reset(); dispatch({ type: 'RETRY' }); }, []);
  const openReview = useCallback((index) => dispatch({ type: 'REVIEW', index }), []);

  /* ---- keyboard ---- */
  useEffect(() => {
    const onKey = (e) => {
      if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.target.closest && e.target.closest('input[type="text"], textarea, select, [contenteditable]')) return;
      const s = stateRef.current;

      if (e.key === 'Escape') {
        if (s.viewerIndex !== null) dispatch({ type: 'VIEWER_CLOSE' });
        else if (dockRef.current) setDock(null);
        return;
      }
      if (s.phase === 'intro') {
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); dispatch({ type: 'START' }); }
        return;
      }
      if (dockRef.current === 'calc') return;   // the calculator owns the keyboard

      if (s.phase === 'quiz' && /^[1-9]$/.test(e.key)) {
        const choice = Number(e.key) - 1;
        if (choice < QUESTIONS[s.index].options.length && !s.locked) { e.preventDefault(); dispatch({ type: 'SELECT', choice }); }
      } else if (s.phase === 'results' && (e.key === 'r' || e.key === 'R')) {
        e.preventDefault(); countdownRef.current.reset(); dispatch({ type: 'RETRY' });
      } else if (s.phase === 'review') {
        const dir = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (!dir) return;
        e.preventDefault();
        if (s.viewerIndex !== null) dispatch({ type: 'VIEWER_GO', index: s.viewerIndex + dir });
        else dispatch({ type: 'REVIEW_GO', index: s.reviewIndex + dir });
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  /* ---- optional content protection ---- */
  useEffect(() => {
    if (!CONFIG.protectContent) return undefined;
    const block = (e) => e.preventDefault();
    const hide = () => setObscured(true);
    const show = () => setObscured(false);
    const onVisibility = () => setObscured(document.hidden);
    ['contextmenu', 'copy', 'cut', 'dragstart', 'selectstart'].forEach((n) => document.addEventListener(n, block));
    document.addEventListener('visibilitychange', onVisibility);
    window.addEventListener('blur', hide);
    window.addEventListener('focus', show);
    return () => {
      ['contextmenu', 'copy', 'cut', 'dragstart', 'selectstart'].forEach((n) => document.removeEventListener(n, block));
      document.removeEventListener('visibilitychange', onVisibility);
      window.removeEventListener('blur', hide);
      window.removeEventListener('focus', show);
    };
  }, []);

  const { phase } = state;
  return html`<div className=${cx('app', obscured && 'is-obscured')} data-dock=${dock || 'none'}>
    <${MemoBackdrop} />
    <${Topbar} phase=${phase} remaining=${countdown.remaining} theme=${theme} surface=${surface} dock=${dock}
      isPlaying=${player.isPlaying} onToggleDock=${toggleDock} onToggleTheme=${toggleTheme} onToggleSurface=${toggleSurface} />

    <div className="workspace">
      <main className="stage" id="main">
        ${(phase === 'intro' || phase === 'quiz') && html`<${QuizScreen} state=${state} onSelect=${selectOption} />`}
        ${phase === 'results' && html`<${ResultsScreen} key=${history.length} state=${state} history=${history} theme=${theme} onReview=${openReview} onRetry=${retry} />`}
        ${phase === 'review' && html`<${ReviewScreen} state=${state} dispatch=${dispatch} />`}
      </main>
      <aside className="dock" aria-label="Tools">
        <${MusicPanel} player=${player} active=${dock === 'music'} onClose=${closeDock} />
        <${CalculatorPanel} active=${dock === 'calc'} onClose=${closeDock} />
      </aside>
    </div>

    ${dock && html`<div className="dock-scrim" onClick=${closeDock} />`}
    ${introVisible && html`<${Intro} leaving=${phase !== 'intro'} onDone=${startQuiz} />`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
</body>
</html>
