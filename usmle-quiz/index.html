    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        mono: ['"Space Grotesk"', 'ui-monospace', 'monospace'],
                        display: ['Sora', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <style>
        :root {
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-apple:    cubic-bezier(0.32, 0.72, 0, 1);
            --ease-soft:     cubic-bezier(0.4, 0, 0.2, 1);
            --dur-fast:  220ms;
            --dur-med:   420ms;
            --dur-slow:  600ms;
        }
        * { scrollbar-width: none !important; -ms-overflow-style: none !important; }
        *::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
        html, body { overflow: hidden; }
        body { font-family: 'Manrope', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
        .no-select { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none; }
        .screenshot-protected { transition: filter 0.1s ease-out; }
        .screenshot-protected.blur-protect { filter: blur(30px) brightness(0.3); }
        @media print { body * { display: none !important; } body::after { content: "Fun fact: The raw ingredients of a human body would cost over £116,000."; display: block; font-size: 24px; text-align: center; padding: 50px; } }

        .typing-cursor { display: inline-block; width: 2px; height: 1em; background: white; margin-left: 2px; animation: blink 1s step-end infinite; vertical-align: text-bottom; }
        @keyframes blink { from, to { background: transparent; } 50% { background: white; } }

        .glass-5-tilt { transition: transform 0.42s var(--ease-apple) !important; transform-style: preserve-3d; will-change: transform; }

        .liquid-glass-music-btn,
        .liquid-glass-music-dropdown,
        .liquid-glass-timer,
        .liquid-glass-calc-panel,
        .liquid-glass-player-card,
        .liquid-glass-playlist-card,
        .liquid-glass-play-btn,
        .liquid-glass-photo-frame,
        .liquid-glass-album-cover,
        .lg-toggle, .lg-nav, .calc-pill, .lg-glass-btn,
        .score-card {
            transition: transform var(--dur-med) var(--ease-apple),
                        background-color var(--dur-fast) var(--ease-soft),
                        box-shadow var(--dur-fast) var(--ease-soft),
                        border-color var(--dur-fast) var(--ease-soft),
                        opacity var(--dur-fast) var(--ease-soft);
        }
        .liquid-glass-music-dropdown { position: relative; border-radius: 28px; isolation: isolate; box-shadow: 0 20px 60px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.1), inset 0 1px 0 rgba(255,255,255,0.3); transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }
        .liquid-glass-music-dropdown::before { content: ""; position: absolute; inset: 0; z-index: 0; border-radius: inherit; box-shadow: inset 0 0 12px -4px #000; background: rgba(255,255,255,0.05); }
        .liquid-glass-music-dropdown::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; backdrop-filter: blur(0px); filter: url(#glass-distortion); }
        .liquid-glass-music-dropdown.dark::before { background: rgba(40,40,40,0.15); }

        .liquid-glass-timer { position: relative; border-radius: 20px; isolation: isolate; box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
        .liquid-glass-timer::before { content: ""; position: absolute; inset: 0; z-index: 0; border-radius: 20px; box-shadow: inset 0 0 10px -4px #000; background: rgba(255,255,255,0.03); }
        .liquid-glass-timer::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 20px; backdrop-filter: blur(0px); filter: url(#glass-distortion); }
        .liquid-glass-timer.dark::before { background: rgba(40,40,40,0.1); }
        .liquid-glass-music-btn { position: relative; border-radius: 16px; isolation: isolate; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: all 0.25s cubic-bezier(0.4,0,0.2,1); }
        .liquid-glass-music-btn::before { content: ""; position: absolute; inset: 0; z-index: 0; border-radius: 16px; box-shadow: inset 0 0 8px -3px #000; background: rgba(255,255,255,0.03); }
        .liquid-glass-music-btn::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 16px; backdrop-filter: blur(0px); filter: url(#glass-distortion); }
        .liquid-glass-music-btn.dark::before { background: rgba(50,50,50,0.1); }
        .liquid-glass-music-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
        .liquid-glass-player-card { position: relative; border-radius: 20px; isolation: isolate; box-shadow: 0 10px 40px rgba(0,0,0,0.15); transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }
        .liquid-glass-player-card::before { content: ""; position: absolute; inset: 0; z-index: 0; border-radius: 20px; box-shadow: inset 0 0 12px -4px #000; background: rgba(255,255,255,0.05); }
        .liquid-glass-player-card::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 20px; backdrop-filter: blur(0px); filter: url(#glass-distortion); }
        .liquid-glass-player-card.dark::before { background: rgba(40,40,40,0.15); }
        .liquid-glass-playlist-card { position: relative; border-radius: 20px; isolation: isolate; box-shadow: 0 8px 32px rgba(0,0,0,0.1); transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }
        .liquid-glass-playlist-card::before { content: ""; position: absolute; inset: 0; z-index: 0; border-radius: 20px; box-shadow: inset 0 0 10px -3px #000; background: rgba(255,255,255,0.03); }
        .liquid-glass-playlist-card::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 20px; backdrop-filter: blur(0px); filter: url(#glass-distortion); }
        .liquid-glass-playlist-card.dark::before { background: rgba(35,35,35,0.15); }
        .liquid-glass-playlist-card:hover { transform: translateY(-2px); }
        .liquid-glass-play-btn { position: relative; border-radius: 50%; isolation: isolate; box-shadow: 0 8px 32px rgba(0,0,0,0.15); transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }
        .liquid-glass-play-btn::before { content: ""; position: absolute; inset: 0; z-index: 0; border-radius: 50%; box-shadow: inset 0 0 10px -3px #000; background: rgba(255,255,255,0.1); }
        .liquid-glass-play-btn::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 50%; backdrop-filter: blur(0px); filter: url(#glass-distortion); }
        .liquid-glass-play-btn.dark::before { background: rgba(60,60,60,0.2); }
        .liquid-glass-play-btn:hover { transform: scale(1.1); }

        .liquid-glass-photo-frame { position: relative; border-radius: 50%; box-shadow: 0 8px 32px rgba(0,0,0,0.15); border: 3px solid rgba(255,255,255,0.35); overflow: hidden; }
        .liquid-glass-photo-frame.dark { border-color: rgba(255,255,255,0.25); }
        .liquid-glass-photo-frame:hover { border-color: rgba(255,255,255,0.45); }
        .liquid-glass-album-cover { position: relative; border-radius: 50%; box-shadow: 0 8px 32px rgba(0,0,0,0.2); border: 2px solid rgba(255,255,255,0.3); overflow: hidden; }
        .liquid-glass-album-cover.dark { border-color: rgba(255,255,255,0.2); }
        .liquid-glass-album-cover:hover { border-color: rgba(255,255,255,0.4); }
        .liquid-glass-content { position: relative; z-index: 1; }

        .spin-animation { animation: spinCover 9s linear infinite; }
        .spin-animation.paused { animation-play-state: paused; }
        @keyframes spinCover { to { transform: rotate(360deg); } }

        .sound-bar { transform-origin: bottom; animation: eqBob 0.85s ease-in-out infinite alternate; }
        .sound-bar:nth-child(2) { animation-delay: 0.22s; }
        .sound-bar:nth-child(3) { animation-delay: 0.44s; }
        @keyframes eqBob { from { transform: scaleY(0.5); } to { transform: scaleY(1.3); } }

        .lg-toggle { position: relative; isolation: isolate; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.15s cubic-bezier(0.4,0,0.2,1), box-shadow 0.15s cubic-bezier(0.4,0,0.2,1); }
        .lg-toggle::before { content: ""; position: absolute; inset: 0; z-index: 0; border-radius: inherit; box-shadow: inset 0 0 8px -3px #000; background: rgba(255,255,255,0.03); }
        .lg-toggle::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; backdrop-filter: blur(0px); filter: url(#glass-distortion); }
        .lg-toggle.dark::before { background: rgba(50,50,50,0.1); }
        .lg-toggle:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
        .lg-toggle:active { transform: scale(0.93); }
        .lg-toggle > * { position: relative; z-index: 1; }
        .calc-pill { position: relative; height: 44px; width: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; isolation: isolate; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.15s cubic-bezier(0.4,0,0.2,1), box-shadow 0.15s cubic-bezier(0.4,0,0.2,1); }
        .calc-pill::before { content: ""; position: absolute; inset: 0; z-index: 0; border-radius: inherit; box-shadow: inset 0 0 8px -3px #000; background: rgba(255,255,255,0.03); }
        .calc-pill::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; backdrop-filter: blur(0px); filter: url(#glass-distortion); }
        .calc-pill.dark::before { background: rgba(50,50,50,0.1); }
        .calc-pill:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
        .calc-pill:active { transform: scale(0.93); }
        .calc-icon { position: relative; z-index: 4; font-size: 22px; font-weight: 300; color: white; text-shadow: 0 1px 5px rgba(0,0,0,0.55); transition: transform 0.42s var(--ease-apple); user-select: none; line-height: 1; }
        .calc-pill.open .calc-icon { transform: rotate(45deg); }
        .liquid-glass-calc-panel { position: relative; border-radius: 24px; isolation: isolate; box-shadow: 0 20px 60px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.1), inset 0 1px 0 rgba(255,255,255,0.3); transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }
        .liquid-glass-calc-panel::before { content: ""; position: absolute; inset: 0; z-index: 0; border-radius: inherit; box-shadow: inset 0 0 12px -4px #000; background: rgba(255,255,255,0.05); }
        .liquid-glass-calc-panel::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; backdrop-filter: blur(0px); filter: url(#glass-distortion); }
        .liquid-glass-calc-panel.dark::before { background: rgba(40,40,40,0.15); }
        .liquid-glass-calc-panel:not(.dark) { background: rgba(0, 0, 0, 0.6); }
        .liquid-glass-calc-panel .calc-display, .liquid-glass-calc-panel .calc-grid { position: relative; z-index: 2; }
        .calc-display { padding: 16px 16px 6px; text-align: right; font-size: 38px; font-weight: 300; color: white; text-shadow: 0 2px 8px rgba(0,0,0,0.4); letter-spacing: -1.5px; word-break: break-all; min-height: 60px; font-family: 'Space Grotesk', monospace; }
        .calc-display.small { font-size: 22px; padding-top: 22px; }
        .calc-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; padding: 6px 12px 14px; }
        .calc-btn { border: none; border-radius: 50%; width: 52px; height: 52px; font-size: 18px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; color: white; transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), filter 0.1s ease; -webkit-user-select: none; user-select: none; font-family: 'Space Grotesk', monospace; }
        .calc-btn:hover { transform: scale(1.14); filter: brightness(1.18); }
        .calc-btn:active { transform: scale(0.88); }
        .calc-btn-zero { border-radius: 26px; width: auto; grid-column: span 2; justify-content: flex-start; padding-left: 20px; }
        .calc-btn-fn { background: rgba(180,180,192,0.38); box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), inset 0 -1px 0 rgba(0,0,0,0.18); }
        .calc-btn-num { background: rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), inset 0 -1px 0 rgba(0,0,0,0.14); }
        .calc-btn-op { background: rgba(255,159,10,0.90); box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), inset 0 -1px 0 rgba(0,0,0,0.22); }
        .calc-btn-op.active-op { background: rgba(255,255,255,0.95); color: #ff9f0a; }

        .score-card { position: relative; border-radius: 16px; padding: 20px; isolation: isolate; background: rgba(0, 0, 0, 0.65); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2); }
        .score-card::before { content: ""; position: absolute; inset: 0; z-index: 0; border-radius: inherit; box-shadow: inset 0 0 8px -3px #000; background: rgba(0,0,0,0.1); }
        .score-card.dark { background: rgba(0,0,0,0.7); border-color: rgba(255,255,255,0.12); }
        .score-card:hover { transform: translateY(-2px); box-shadow: 0 14px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1); }
        .score-card > * { position: relative; z-index: 2; }

        .lg-glass-btn { position: relative; cursor: pointer; isolation: isolate; box-shadow: 0 8px 32px rgba(0,0,0,0.15); border-radius: 18px; color: white; }
        .lg-glass-btn::before { content: ""; position: absolute; inset: 0; z-index: 0; border-radius: inherit; box-shadow: inset 0 0 10px -4px #000; background: rgba(255,255,255,0.03); }
        .lg-glass-btn::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; backdrop-filter: blur(0px); filter: url(#glass-distortion); }
        .lg-glass-btn.dark::before { background: rgba(40,40,40,0.1); }
        .lg-glass-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,0,0,0.18); }
        .lg-glass-btn:active { transform: translateY(0) scale(0.97); }
        .lg-glass-btn:disabled { opacity: 0.38; cursor: not-allowed; transform: none; }

        .opt-btn {
            width: 100%;
            padding: 12px 16px 12px 48px;
            margin-bottom: 8px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: white;
            text-align: left;
            font-family: 'Manrope', sans-serif;
            font-weight: 500;
            transition: background-color var(--dur-fast) var(--ease-soft),
                        border-color var(--dur-fast) var(--ease-soft),
                        transform 0.18s var(--ease-soft),
                        opacity var(--dur-fast) var(--ease-soft),
                        box-shadow var(--dur-fast) var(--ease-soft);
            position: relative;
            will-change: transform, background-color;
        }
        .opt-btn::before {
            content: attr(data-letter);
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            font-family: 'Space Grotesk', monospace;
            color: rgba(255,255,255,0.7);
            letter-spacing: 0;
            transition: all var(--dur-fast) var(--ease-soft);
        }
        .opt-btn:hover:not(.locked) { background: rgba(255,255,255,0.1); transform: translateX(2px); }
        .opt-btn:hover:not(.locked)::before { border-color: rgba(255,255,255,0.55); color: rgba(255,255,255,0.95); }
        .opt-btn:focus-visible { outline: 2px solid #FF9E7C; outline-offset: 2px; }
        .opt-btn.locked { cursor: default; }
        .opt-btn.opt-selected {
            background: rgba(255,255,255,0.18);
            border-color: rgba(255,255,255,0.45);
        }
        .opt-btn.opt-dim { opacity: 0.32; }

        .floating-bg-container {
            contain: layout paint style;
            will-change: contents;
        }
        .floating-bg-container img {
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        .progress-rail {
            display: flex;
            gap: 6px;
            margin-bottom: 18px;
            height: 3px;
        }
        .progress-seg {
            flex: 1;
            height: 100%;
            background: rgba(255,255,255,0.12);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }
        .progress-seg-fill {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #FF9E7C, #FFB899);
            transform-origin: left center;
            transform: scaleX(0);
            transition: transform 0.5s var(--ease-apple);
        }
        .progress-seg.done .progress-seg-fill { transform: scaleX(1); }
        .progress-seg.current .progress-seg-fill {
            transform: scaleX(0.5);
            animation: currentPulse 1.8s var(--ease-soft) infinite;
        }
        @keyframes currentPulse {
            0%, 100% { transform: scaleX(0.35); opacity: 0.7; }
            50%      { transform: scaleX(0.7); opacity: 1; }
        }

        /* ============================================================
           WAVE TEXT — canvas edition.
           The wave is now painted on a single <canvas>. There are NO
           per-letter DOM nodes anymore, so the browser never has to
           style/layout hundreds of spans on mount or on dark-mode
           toggle. Visually identical: same stagger, same 7px bob,
           same 1s ease-in-out per letter.
           ============================================================ */
        .question-text-container {
            position: relative;
            min-height: 3em;
            contain: layout style;
        }
        .question-text-container canvas { display: block; max-width: 100%; }
        .question-card-layer { will-change: transform, opacity; transform: translateZ(0); }

        /* ============================================================
           RESULTS SCREEN — mature dashboard cards
           ============================================================ */
        .nexus {
            font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
            letter-spacing: -0.005em;
            color: #FFFFFF;
        }
        .nexus .mono, .font-grotesk {
            font-family: 'Space Grotesk', ui-monospace, 'SF Mono', monospace;
            font-feature-settings: "tnum" 1, "ss01" 1;
        }
        .nexus-muted { color: #8b8b8b; }
        .nexus-heading {
            font-family: 'Sora', 'Manrope', sans-serif;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.12;
        }
        .nexus-subtitle {
            font-family: 'Manrope', sans-serif;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: #8b8b8b;
        }

        .qcard {
            position: relative;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.07);
            background:
                linear-gradient(165deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.015) 34%, rgba(255,255,255,0) 100%),
                rgba(13, 10, 8, 0.92);
            box-shadow: 0 10px 30px -18px rgba(0,0,0,0.9);
            transition: border-color 0.4s var(--ease-apple), box-shadow 0.4s var(--ease-apple);
            overflow: hidden;
        }
        .qcard::before {
            content: "";
            position: absolute;
            left: 12%; right: 12%; top: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,158,124,0.55), transparent);
            opacity: 0;
            transition: opacity 0.4s var(--ease-apple);
        }
        .qcard:hover {
            border-color: rgba(255,158,124,0.32);
            box-shadow: 0 22px 55px -20px rgba(0,0,0,0.85), 0 0 45px -18px rgba(255,158,124,0.4);
        }

<script>
/* ==========================================================================
   CORE: shared services used by both the quiz and the site shell.
   1. AttemptStore    - persistent quiz history (localStorage) other tabs can read.
   2. Jelly physics   - spring-driven tilt / squash / giggle for any element with .jelly
   3. Quiz protection - copy / right-click / blur guards, active only on the Quiz tab
   ========================================================================== */
(() => {
  'use strict';

  /* ---------- 1. AttemptStore ---------- */
  const KEY = 'usmle-quiz:attempts:v2';
  const read = () => {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY) || '[]');
      return Array.isArray(raw) ? raw.filter(a => a && Number.isFinite(a.score) && Number.isFinite(a.total) && a.total > 0) : [];
    } catch { return []; }
  };
  let list = read();
  const subs = new Set();
  const emit = () => subs.forEach(fn => fn());
  window.AttemptStore = {
    get: () => list,                                   /* stable reference until it changes */
    subscribe(fn) { subs.add(fn); return () => subs.delete(fn); },
    add(attempt) {
      if (list.some(a => a.timestamp === attempt.timestamp)) return;
      list = [...list, attempt].slice(-200);
      try { localStorage.setItem(KEY, JSON.stringify(list)); } catch { /* storage unavailable */ }
      emit();
    },
    clear() {
      list = [];
      try { localStorage.removeItem(KEY); } catch { /* ignore */ }
      emit();
    },
  };

  /* ---------- 2. Jelly physics ---------- */
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const K = 230, D = 11;                       /* stiffness / damping: under-damped, so it wobbles */
    const states = new WeakMap();
    const live = new Set();
    let hovered = null, pressed = null, last = 0, raf = 0;

    const axis = (t = 0) => ({ p: t, v: 0, t });
    const stateOf = (el) => {
      let s = states.get(el);
      if (!s) {
        s = { x: axis(), y: axis(), z: axis(), s: axis(1),
              tilt: parseFloat(el.dataset.tilt || '6'),
              hover: parseFloat(el.dataset.hover || '1.04') };
        states.set(el, s);
      }
      return s;
    };
    const wake = (el) => { live.add(el); if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } };

    function tick(now) {
      const dt = Math.min(0.032, (now - last) / 1000);
      last = now;
      for (const el of live) {
        const s = states.get(el);
        let moving = false;
        for (const k of ['x', 'y', 'z', 's']) {
          const a = s[k];
          a.v += (-K * (a.p - a.t) - D * a.v) * dt;
          a.p += a.v * dt;
          if (Math.abs(a.p - a.t) > 0.0006 || Math.abs(a.v) > 0.008) moving = true;
        }
        if (moving) {
          el.style.transform = `perspective(900px) rotateX(${s.x.p.toFixed(3)}deg) rotateY(${s.y.p.toFixed(3)}deg) rotateZ(${s.z.p.toFixed(3)}deg) scale(${s.s.p.toFixed(4)})`;
        } else {
          for (const k of ['x', 'y', 'z', 's']) { s[k].p = s[k].t; s[k].v = 0; }
          const neutral = !s.x.t && !s.y.t && !s.z.t && s.s.t === 1;
          el.style.transform = neutral ? '' : `perspective(900px) rotateX(${s.x.t}deg) rotateY(${s.y.t}deg) scale(${s.s.t})`;
          live.delete(el);
        }
      }
      raf = live.size ? requestAnimationFrame(tick) : 0;
    }

    const rest = (el) => { const s = stateOf(el); s.x.t = 0; s.y.t = 0; s.z.t = 0; s.s.t = 1; wake(el); };
    const closest = (e) => (e.target && e.target.closest) ? e.target.closest('.jelly') : null;

    document.addEventListener('pointerover', (e) => {
      if (e.pointerType !== 'mouse') return;
      const el = closest(e);
      if (!el || el === hovered || el.disabled) return;
      hovered = el;
      const s = stateOf(el);
      s.s.t = s.hover;
      s.z.v += (Math.random() < 0.5 ? -1 : 1) * 42;        /* the giggle */
      wake(el);
    });
    document.addEventListener('pointermove', (e) => {
      if (!hovered || e.pointerType !== 'mouse') return;
      const r = hovered.getBoundingClientRect();
      if (!r.width || !r.height) return;
      const s = stateOf(hovered);
      s.y.t = ((e.clientX - r.left) / r.width - 0.5) * 2 * s.tilt;
      s.x.t = -((e.clientY - r.top) / r.height - 0.5) * 2 * s.tilt;
      wake(hovered);
    }, { passive: true });
    document.addEventListener('pointerout', (e) => {
      if (!hovered || e.pointerType !== 'mouse') return;
      if (e.relatedTarget && hovered.contains(e.relatedTarget)) return;
      const el = hovered; hovered = null; rest(el);
    });
    document.addEventListener('pointerdown', (e) => {
      const el = closest(e);
      if (!el || el.disabled) return;
      pressed = el;
      const s = stateOf(el); s.s.t = 0.9; wake(el);
    });
    const release = () => {
      if (!pressed) return;
      const el = pressed; pressed = null;
      const s = stateOf(el);
      s.s.t = el === hovered ? s.hover : 1;
      s.s.v += 1.4;                                          /* squash then spring back */
      s.z.v += (Math.random() < 0.5 ? -1 : 1) * 30;
      wake(el);
    };
    document.addEventListener('pointerup', release);
    document.addEventListener('pointercancel', release);
  }

  /* ---------- 3. Quiz protection (original behaviour, scoped to the Quiz tab) ---------- */
  window.__quizProtect = false;
  const guarded = (e) => window.__quizProtect && !(e.target && e.target.closest && e.target.closest('input, textarea'));
  ['contextmenu', 'selectstart', 'dragstart', 'copy', 'cut'].forEach(ev =>
    document.addEventListener(ev, (e) => { if (guarded(e)) e.preventDefault(); }, { passive: false }));
  document.addEventListener('keydown', (e) => {
    if (!guarded(e)) return;
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && ['c', 'x', 'u', 's', 'a', 'p'].includes(k)) e.preventDefault();
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i', 'c', 'j', '3', '4', '5'].includes(k)) e.preventDefault();
    if (e.key === 'F12' || e.key === 'PrintScreen') e.preventDefault();
  }, { passive: false });
  const setBlur = (on) => {
    const root = document.querySelector('.quiz-root');
    if (!root) return;
    if (on && window.__quizProtect) root.classList.add('blur-protect');
    else setTimeout(() => root.classList.remove('blur-protect'), 100);
  };
  document.addEventListener('visibilitychange', () => setBlur(document.hidden));
  window.addEventListener('blur', () => setBlur(true));
  window.addEventListener('focus', () => setBlur(false));
  document.addEventListener('keyup', (e) => {
    if (e.key === 'PrintScreen' && window.__quizProtect) {
      setBlur(true); navigator.clipboard && navigator.clipboard.writeText('').catch(() => {});
      setTimeout(() => setBlur(false), 1000);
    }
  });
})();

(() => {
        const { useState, useEffect, useLayoutEffect, useRef, createElement: h, useMemo, useImperativeHandle, useSyncExternalStore } = React;
        const { motion, AnimatePresence } = window.Motion;

        const EASE = {
            apple:    [0.32, 0.72, 0, 1],
            outExpo:  [0.16, 1, 0.3, 1],
            soft:     [0.4, 0, 0.2, 1],
            glide:    [0.45, 0.05, 0.25, 1],
        };
        const DUR = {
            fast: 0.22,
            med:  0.42,
            slow: 0.6,
            glide: 0.62,
        };
        const FEEDBACK_MS = 420;

        /* ============================================================
           Canvas wave-text engine.
           measureLines: pure-CPU line breaking (unchanged).
           buildLayout:  per-char x positions, measured once.
           paintFrame:   draws the text; with a time value it applies
                         the same 0 → -7px → 0 bob each letter had in
                         the old CSS keyframes.
           ============================================================ */
        let _measureCanvas = null;
        function measureLines(text, maxWidth, cssFont) {
            if (!_measureCanvas) _measureCanvas = document.createElement('canvas');
            const ctx = _measureCanvas.getContext('2d');
            ctx.font = cssFont;
            const tokens = text.split(/(\s+)/);
            const lines = [];
            let cur = '', curW = 0;
            for (const tok of tokens) {
                if (tok === '') continue;
                const tw = ctx.measureText(tok).width;
                if (cur && curW + tw > maxWidth) {
                    lines.push(cur);
                    if (/^\s+$/.test(tok)) { cur = ''; curW = 0; }
                    else { cur = tok; curW = tw; }
                } else { cur += tok; curW += tw; }

            return lines;

        const WAVE_LINE_STAGGER = 0.07;

        const WAVE_AMP = 7;

            const ctx = _measureCanvas.getContext('2d');

                const xs = [];
                for (let i = 0; i < line.length; i++) xs.push(ctx.measureText(line.slice(0, i)).width);
                return { text: line, xs };
            });

        function _WaveQuestionCard({ q, i, isActive, opaqueMode, currentQuestion, handleOption,
                                    musicDropdownOpen, calcDropdownOpen, isMobile,
                                    selected, locked, quizStarted }) {
            const containerRef = useRef(null);
            const canvasRef = useRef(null);
            const layoutRef = useRef(null);
            const fontRef = useRef({ cssFont: '16px sans-serif', fontSize: 16, lineHeight: 26, width: 0 });

                const canvas = canvasRef.current;
                const L = layoutRef.current;
                if (!canvas || !L || !L.length) return;

                            const local = t - delay;
                            let off = 0;
                            if (local > 0 && local < WAVE_DURATION) {

                                off = local < half

<script>

const normExp = (e) => (typeof e === 'string' ? { text: e, images: [] } : { text: e.text, images: e.images || [] });
const CASE_META = [
  { code: 'CASE_001', tag: 'Urology · Anatomy', title: 'Prostate on CT', short: 'Prostate', wiki: 'Benign prostatic hyperplasia', cls: '' },
  { code: 'CASE_002', tag: 'Urology · Psychiatry', title: 'Erectile dysfunction', short: 'Erectile', wiki: 'Erectile dysfunction', cls: 'c2' },
  { code: 'CASE_003', tag: 'Urology · Embryology', title: 'Testicular torsion', short: 'Torsion', wiki: 'Testicular torsion', cls: 'c3' },
];
const CASES = QS.map((q, i) => {
  const exp = normExp(EX[i]);
  const m = exp.text.match(/Educational objective:\s*([\s\S]*)$/);
  return { ...CASE_META[i], id: 'q' + (i + 1), index: i, q, exp, objective: m ? m[1].trim() : '' };
});
const DURATION = 1800;

/* ---------- helpers ---------- */
const pad2 = (n) => String(n).padStart(2, '0');
const clock = (s) => { s = Math.max(0, Math.round(s || 0)); return `${pad2(Math.floor(s / 60))}:${pad2(s % 60)}`; };
const pctOf = (a) => Math.round((a.score / a.total) * 100);
const dayKey = (t) => new Date(t).toDateString();
const fmtDate = (t) => new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
const fmtTime = (t) => new Date(t).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });

function summarize(list) {
  const n = list.length;
  const best = n ? Math.max(...list.map(pctOf)) : 0;
  const avg = n ? Math.round(list.reduce((s, a) => s + pctOf(a), 0) / n) : 0;
  const time = list.reduce((s, a) => s + a.timeUsed, 0);
  const days = new Set(list.map(a => dayKey(a.timestamp)));
  let streak = 0;
  const d = new Date();
  if (!days.has(d.toDateString())) d.setDate(d.getDate() - 1);
  while (days.has(d.toDateString())) { streak++; d.setDate(d.getDate() - 1); }
  const today = list.filter(a => dayKey(a.timestamp) === new Date().toDateString()).length;
  return { n, best, avg, time, streak, today, last: n ? pctOf(list[n - 1]) : 0, prev: n > 1 ? pctOf(list[n - 2]) : null };
}

const SAMPLE = (() => {
  const day = 864e5, now = Date.now();
  const scores = [1, 1, 2, 2, 1, 2, 3, 3];
  return scores.map((s, i) => ({
    score: s, total: 3, sample: true,
    timeUsed: 700 + ((i * 197) % 380) - i * 24,
    timestamp: now - (scores.length - i) * day * 1.25,
    correct: [0, 1, 2].filter(k => (s === 3) || (s === 2 && k !== (i % 3)) || (s === 1 && k === (i % 3))),
  }));
})();

/* ---------- hooks ---------- */
const useAttempts = () => useSyncExternalStore(window.AttemptStore.subscribe, window.AttemptStore.get);

const ROUTES = ['home', 'quiz', 'dashboard', 'library'];
function useRoute() {

}

function usePref(key, fallback) {

  const set = useCallback((n) => { setV(n); try { localStorage.setItem(k, JSON.stringify(n)); } catch { /* ignore */ } }, [k]);
  return [v, set];
}

/* ---------- Wikipedia (public REST API, no key) ---------- */
const wikiMem = {};
async function wikiSummary(title) {
  if (wikiMem[title]) return wikiMem[title];
  try { const c = sessionStorage.getItem('wiki:' + title); if (c) return (wikiMem[title] = JSON.parse(c)); } catch { /* ignore */ }
  const r = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title.replace(/ /g, '_')));
  if (!r.ok) throw new Error('wiki ' + r.status);
  const j = await r.json();
  const out = { extract: j.extract, desc: j.description, thumb: j.thumbnail && j.thumbnail.source, url: j.content_urls && j.content_urls.desktop && j.content_urls.desktop.page };
  wikiMem[title] = out;
  try { sessionStorage.setItem('wiki:' + title, JSON.stringify(out)); } catch { /* ignore */ }
  return out;
}
async function wikiSearch(q, signal) {
  const url = 'https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=' + encodeURIComponent(q) +
    '&gsrlimit=5&prop=pageimages%7Cextracts&exintro=1&explaintext=1&exchars=170&piprop=thumbnail&pithumbsize=120&format=json&formatversion=2&origin=*';
  const r = await fetch(url, { signal });
  const j = await r.json();
  const pages = (j.query && j.query.pages) || [];
  return pages.sort((a, b) => a.index - b.index).map(p => ({
    title: p.title, extract: p.extract || '', thumb: p.thumbnail && p.thumbnail.source,
    url: 'https://en.wikipedia.org/wiki/' + encodeURIComponent(p.title.replace(/ /g, '_')),
  }));
}
function useWiki(title, enabled) {
  const [data, setData] = useState(wikiMem[title] || null);
  const [failed, setFailed] = useState(false);
  useEffect(() => {
    if (!enabled || data) return;
    let live = true;
    wikiSummary(title).then(d => live && setData(d)).catch(() => live && setFailed(true));
    return () => { live = false; };
  }, [title, enabled]);
  return { data, failed };
}

/* ---------- tiny components ---------- */
function AN({ value, prefix = '', suffix = '', ms = 1300 }) {
  const ref = useRef(null);
  const [v, setV] = useState(reduceMotion() ? value : 0);
  useEffect(() => {
    if (reduceMotion()) { setV(value); return undefined; }
    let raf, started = false;
    const run = () => {
      if (started) return; started = true;
      const t0 = performance.now();
      const tick = (now) => { const t = Math.min(1, (now - t0) / ms); setV(Math.round(value * (1 - Math.pow(1 - t, 4)))); if (t < 1) raf = requestAnimationFrame(tick); };
      raf = requestAnimationFrame(tick);
    };
    const io = new IntersectionObserver((es) => { if (es.some(e => e.isIntersecting)) { run(); io.disconnect(); } }, { threshold: 0.2 });
    if (ref.current) io.observe(ref.current);
    return () => { io.disconnect(); cancelAnimationFrame(raf); };
  }, [value, ms]);
  return html`<span ref=${ref}>${prefix}${v}${suffix}</span>`;
}
const Icon = ({ n, cls }) => html`<i className=${cx('fas', n, cls)} aria-hidden="true"></i>`;

}

function GreenCard({ st }) {

  </div>`;
}

function BarsCard({ list }) {
  const items = list.slice(-6);
  const cols = [...Array(6 - items.length).fill(null), ...items];
  const bestIdx = items.length ? cols.indexOf(items.reduce((m, a) => (pctOf(a) >= pctOf(m) ? a : m), items[0])) : -1;
  const [hover, setHover] = useState(null);
  const on = hover === null ? bestIdx : hover;
  const bub = (a, i) => { const prev = cols[i - 1]; const d = prev ? pctOf(a) - pctOf(prev) : null; return d === null ? `${pctOf(a)}%` : `${d >= 0 ? '+' : ''}${d}%`; };
  return html`<article className="dc c-bars">
    <div className="dc-head"><div><h4>Score by attempt</h4><p className="sub">Last six sessions</p></div><button className="arrow-btn jelly" aria-label="Open history"><${Icon} n="fa-arrow-up-right-from-square" /></button></div>
    <div className="chart" onPointerLeave=${() => setHover(null)}>
      ${[0, 1, 2, 3, 4].map(k => html`<div key=${k} className="gl" style=${{ '--k': k }}><span>${100 - k * 25}</span></div>`)}
      <div className="plot">
        ${cols.map((a, i) => html`<div key=${i} className=${cx('bcol', !a && 'ghost', on === i && a && 'on')} onPointerEnter=${() => a && setHover(i)}>
          <div className="barwrap">${a && html`<div className="bub" style=${{ '--h': Math.max(pctOf(a), 6) + '%' }}>${bub(a, i)}</div>`}
            <div className="bar" style=${{ '--h': (a ? Math.max(pctOf(a), 6) : 22 + ((i * 17) % 30)) + '%', '--i': i }}></div></div>
          <div className="xl">${a ? fmtDate(a.timestamp) : ''}</div>
        </div>`)}
      </div>
    </div>
  </article>`;
}

function smoothPath(pts) {
  if (!pts.length) return '';
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += ` C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)},${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)},${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d;
}
function TrendCard({ list }) {
  const [mode, setMode] = useState('score');
  const vals = list.map(a => (mode === 'score' ? pctOf(a) : Math.min(100, Math.round((a.timeUsed / DURATION) * 100))));
  const W = 300, H = 120;
  const pts = vals.map((v, i) => [vals.length > 1 ? (i * W) / (vals.length - 1) : W / 2, H - 10 - (v / 100) * (H - 24)]);
  const d = smoothPath(pts);
  const latest = vals.length ? vals[vals.length - 1] : 0;
  const delta = vals.length > 1 ? latest - vals[vals.length - 2] : null;
  return html`<article className="dc c-trend">
    <div className="dc-head"><div><h4>${mode === 'score' ? 'Accuracy trend' : 'Time used'}</h4><p className="sub">${mode === 'score' ? 'Score per attempt' : 'Share of the 30:00 budget'}</p></div>
      <div className="mini-tabs"><button className=${cx(mode === 'score' && 'on')} onClick=${() => setMode('score')}>Score</button><button className=${cx(mode === 'time' && 'on')} onClick=${() => setMode('time')}>Time</button></div></div>
    <div style=${{ display: 'flex', alignItems: 'baseline', gap: 10, marginBottom: 6 }}><span className="bigmetric">${latest}<span className="dim">%</span></span>${delta !== null && html`<span className=${cx('chip-up', delta < 0 && 'chip-dn')}>${delta >= 0 ? '+' : ''}${delta}%</span>`}</div>
    ${vals.length ? html`<svg key=${mode} className="line" viewBox=${`0 0 ${W} ${H}`} preserveAspectRatio="none" role="img" aria-label="Trend line">
      <defs><linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#14804F" stopOpacity=".28" /><stop offset="1" stopColor="#14804F" stopOpacity="0" /></linearGradient></defs>
      ${pts.length > 1 && html`<path d=${`${d} L${W},${H} L0,${H} Z`} fill="url(#trendFill)" />`}
      ${pts.length > 1 && html`<path className="stroke" pathLength="1" d=${d} />`}
      ${pts.map((p, i) => html`<circle key=${i} className="dot" cx=${p[0]} cy=${p[1]} r="4"><title>${vals[i]}%</title></circle>`)}
    </svg>` : html`<p className="sub" style=${{ padding: '34px 0' }}>Your line appears after the first attempt.</p>`}
  </article>`;
}

function WeekCard({ st }) {

    <div className="ringwrap"><svg width="148" height="148" viewBox="0 0 148 148" style=${{ transform: 'rotate(-90deg)' }}><circle cx="74" cy="74" r=${R} fill="none" stroke="#eef1ee" strokeWidth="12" />
      <circle cx="74" cy="74" r=${R} fill="none" stroke="#14804F" strokeWidth="12" strokeLinecap="round" strokeDasharray=${C} strokeDashoffset=${C * (1 - p)} style=${{ transition: 'stroke-dashoffset 1s cubic-bezier(.22,1,.36,1)' }} /></svg>

  return html`<div className=${cx('file', c.cls, active && 'active')} role="button" tabIndex=${active ? -1 : 0} aria-expanded=${active} aria-label=${`Open ${c.title}`} onClick=${() => !active && onActivate()} onKeyDown=${onKey}>
    <span className="tab-n">${c.code} //</span>

function Reader({ c, onClose }) {

          <p>${c.q.question}</p>${c.q.options.map((o, i) => html`<div key=${i} className=${cx('opt', i === c.q.answer && 'ok')}>${i === c.q.answer ? '✓ ' : ''}${o}</div>`)}</div>

function Explorer() {
  const [q, setQ] = useState('');
  const [res, setRes] = useState([]);
  const [state, setState] = useState('idle');
  const run = useCallback((term) => { setQ(term); }, []);
  useEffect(() => {
    if (q.trim().length < 2) { setRes([]); setState('idle'); return undefined; }
    const ctl = new AbortController();
    setState('loading');
    const t = setTimeout(() => { wikiSearch(q, ctl.signal).then(r => { setRes(r); setState(r.length ? 'ok' : 'none'); }).catch(e => { if (e.name !== 'AbortError') setState('error'); }); }, 350);
    return () => { clearTimeout(t); ctl.abort(); };
  }, [q]);
  return html`<div className="explorer">
    <div><p className="eyebrow">Topic explorer · live from Wikipedia</p><h2 style=${{ fontSize: 'clamp(30px,4.6vw,56px)', fontWeight: 700, margin: '14px 0 0', lineHeight: 1 }}>Go <span className="hl">deeper.</span></h2></div>
    <label className="explorer-input"><${Icon} n="fa-magnifying-glass" /><input value=${q} onChange=${(e) => setQ(e.target.value)} placeholder="Search a topic, drug or structure…" aria-label="Search topics" /></label>
    <div style=${{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>${['Prostate', 'Finasteride', 'Tamsulosin', 'Spermatic cord', 'Bupropion'].map(t => html`<button key=${t} className="btn-ghost jelly" onClick=${() => run(t)}>${t}</button>`)}</div>
    ${state === 'loading' && html`<p className="sub" style=${{ color: 'var(--mut)' }}>Searching…</p>`}
    ${state === 'none' && html`<p style=${{ color: 'var(--mut)' }}>No matches. Try a simpler term.</p>`}
    ${state === 'error' && html`<p style=${{ color: 'var(--mut)' }}>Couldn't reach Wikipedia. Check your connection and try again.</p>`}
    <div className="wiki-grid">${res.map(r => html`<a key=${r.url} className="wcard" href=${r.url} target="_blank" rel="noopener noreferrer">${r.thumb ? html`<img src=${r.thumb} alt="" loading="lazy" />` : html`<div className="ph"></div>`}<div><b>${r.title}</b><span>${r.extract}</span></div></a>`)}</div>
  </div>`;
}

    <div className="footer-word" aria-hidden="true">USMLE</div>
    <div className="footer-bar"><span>© ${new Date().getFullYear()} USMLE Quiz · A practice tool, not a substitute for your curriculum.</span>
      <button className="totop jelly" onClick=${() => window.scrollTo({ top: 0, behavior: 'smooth' })} aria-label="Back to top"><${Icon} n="fa-arrow-up" /></button></div>
  </footer>`;
}

/* ==========================================================================
   FIND  (⌘K / "/")  local questions + live Wikipedia
   ========================================================================== */
function highlight(text, tokens) {
  if (!tokens.length) return text;
  const re = new RegExp('(' + tokens.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'ig');
  return text.split(re).map((part, i) => (i % 2 ? html`<mark key=${i}>${part}</mark>` : part));
}
function snippet(text, tokens) {
  const flat = text.replace(/\s+/g, ' ');
  const low = flat.toLowerCase();
  let at = -1;
  for (const t of tokens) { const i = low.indexOf(t); if (i >= 0 && (at < 0 || i < at)) at = i; }
  if (at < 0) return flat.slice(0, 120);
  const s = Math.max(0, at - 50);
  return (s ? '…' : '') + flat.slice(s, s + 150) + '…';
}

function Palette({ onClose, go, openCase }) {
  const [q, setQ] = useState('');
  const [sel, setSel] = useState(0);
  const [wiki, setWiki] = useState([]);
  const [busy, setBusy] = useState(false);
  const inputRef = useRef(null);
  useEffect(() => { inputRef.current && inputRef.current.focus(); }, []);
  const tokens = q.toLowerCase().split(/\s+/).filter(Boolean);

  const actions = useMemo(() => [
    { id: 'a1', ic: 'fa-pen-to-square', t: 'Start the quiz', s: '30:00 timed run', run: () => go('quiz') },
    { id: 'a2', ic: 'fa-chart-simple', t: 'Open the dashboard', s: 'Scores, streak and history', run: () => go('dashboard') },
    { id: 'a3', ic: 'fa-folder-open', t: 'Browse case files', s: 'Explanations and Wikipedia', run: () => go('library') },
    { id: 'a4', ic: 'fa-house', t: 'Go home', s: '', run: () => go('home') },
  ].filter(a => !tokens.length || tokens.every(t => (a.t + ' ' + a.s).toLowerCase().includes(t))), [q]);

  const cases = useMemo(() => CASES.map(c => {
    const hay = (c.title + ' ' + c.q.question + ' ' + c.q.options.join(' ') + ' ' + c.exp.text);
    if (tokens.length && !tokens.every(t => hay.toLowerCase().includes(t))) return null;
    return { id: c.id, ic: 'fa-file-medical', t: `${c.code} · ${c.title}`, s: tokens.length ? snippet(hay.slice(c.title.length), tokens) : c.tag, run: () => { openCase(c.index); go('library'); } };
  }).filter(Boolean), [q]);

  useEffect(() => {
    if (q.trim().length < 3) { setWiki([]); setBusy(false); return undefined; }
    const ctl = new AbortController();
    setBusy(true);
    const t = setTimeout(() => { wikiSearch(q, ctl.signal).then(r => { setWiki(r); setBusy(false); }).catch(e => { if (e.name !== 'AbortError') setBusy(false); }); }, 380);
    return () => { clearTimeout(t); ctl.abort(); };
  }, [q]);

  const wikiItems = wiki.map(w => ({ id: 'w' + w.url, ic: 'fa-globe', img: w.thumb, t: w.title, s: w.extract, run: () => window.open(w.url, '_blank', 'noopener') }));
  const groups = [['Go to', actions], ['Case files', cases], ['Wikipedia', wikiItems]].filter(g => g[1].length);
  const flat = groups.flatMap(g => g[1]);
  useEffect(() => { setSel(0); }, [q, wiki.length]);

  const choose = (item) => { if (!item) return; onClose(); item.run(); };
  const onKey = (e) => {
    if (e.key === 'Escape') { e.preventDefault(); onClose(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); setSel(s => Math.min(flat.length - 1, s + 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setSel(s => Math.max(0, s - 1)); }
    else if (e.key === 'Enter') { e.preventDefault(); choose(flat[sel]); }
  };
  useEffect(() => { const el = document.querySelector('.pal-item.sel'); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' }); }, [sel]);

  let idx = -1;
  return html`<div className="pal-back" onMouseDown=${(e) => e.target === e.currentTarget && onClose()}>
    <div className="pal lg" role="dialog" aria-modal="true" aria-label="Find" onKeyDown=${onKey}>
      <div className="pal-in"><${Icon} n="fa-magnifying-glass" /><input ref=${inputRef} value=${q} onChange=${(e) => setQ(e.target.value)} placeholder="Find questions, explanations, topics…" aria-label="Find" />${busy && html`<i className="fas fa-circle-notch fa-spin" style=${{ opacity: .6 }}></i>`}</div>
      <div className="pal-list">
        ${!flat.length && html`<p style=${{ padding: 24, color: 'rgba(255,255,255,.55)', fontSize: 14 }}>${busy ? 'Searching Wikipedia…' : 'No matches yet. Keep typing.'}</p>`}
        ${groups.map(([name, items]) => html`<div key=${name}><div className="pal-grp">${name}</div>
          ${items.map(it => { idx++; const me = idx; return html`<button key=${it.id} className=${cx('pal-item', sel === me && 'sel')} onMouseEnter=${() => setSel(me)} onClick=${() => choose(it)}>
            <span className="ic">${it.img ? html`<img src=${it.img} alt="" />` : html`<${Icon} n=${it.ic} />`}</span>
            <span><b>${highlight(it.t, tokens)}</b>${it.s && html`<small>${name === 'Case files' && tokens.length ? highlight(it.s, tokens) : it.s}</small>`}</span>
            <${Icon} n="fa-arrow-turn-down" cls="rot" /></button>`; })}</div>`)}
      </div>
      <div className="pal-foot"><span><kbd>↑↓</kbd>navigate</span><span><kbd>↵</kbd>open</span><span><kbd>esc</kbd>close</span></div>
    </div>
  </div>`;
}

/* ==========================================================================
   APP
   ========================================================================== */
function App() {
  const [route, go] = useRoute();
  const attempts = useAttempts();
  const [quizMounted, setQuizMounted] = useState(route === 'quiz');
  const [findOpen, setFindOpen] = useState(false);
  const [pendingCase, setPendingCase] = useState(null);
  const [reader, setReader] = useState(null);
  const progressRef = useRef(null);

  useEffect(() => {
    if (route === 'quiz') setQuizMounted(true);
    document.body.classList.toggle('quiz-locked', route === 'quiz');
    document.body.dataset.route = route;
    window.__quizProtect = PROTECT_QUIZ && route === 'quiz';
    window.scrollTo(0, 0);
  }, [route]);

  /* scroll progress + nav tone follows the section under the nav */
  useEffect(() => {
    let raf = 0;
    const update = () => {
      raf = 0;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      if (progressRef.current) progressRef.current.style.setProperty('--p', max > 0 ? Math.min(1, window.scrollY / max) : 0);
      let tone = 'dark';
      document.querySelectorAll('[data-nav]').forEach(el => { const r = el.getBoundingClientRect(); if (r.top <= 40 && r.bottom > 40) tone = el.dataset.nav; });
      document.body.dataset.navtone = route === 'quiz' ? 'dark' : tone;
    };
    const on = () => { if (!raf) raf = requestAnimationFrame(update); };
    window.addEventListener('scroll', on, { passive: true });
    window.addEventListener('resize', on);
    const t = setInterval(update, 600);
    update();
    return () => { window.removeEventListener('scroll', on); window.removeEventListener('resize', on); clearInterval(t); cancelAnimationFrame(raf); };
  }, [route]);

  /* reveal-on-scroll + cursor spotlight */
  useEffect(() => {
    const io = new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
    const scan = () => document.querySelectorAll('.reveal:not(.in)').forEach(el => io.observe(el));
    scan();
    const mo = new MutationObserver(scan);
    mo.observe(document.getElementById('site'), { childList: true, subtree: true });
    const spot = (e) => { const el = e.target.closest && e.target.closest('.spot'); if (!el) return; const r = el.getBoundingClientRect(); el.style.setProperty('--mx', (e.clientX - r.left) + 'px'); el.style.setProperty('--my', (e.clientY - r.top) + 'px'); };
    document.addEventListener('pointermove', spot, { passive: true });
    return () => { io.disconnect(); mo.disconnect(); document.removeEventListener('pointermove', spot); };
  }, []);

  /* find shortcut */
  const openFind = useCallback(() => setFindOpen(true), []);
  useEffect(() => {
    const k = (e) => {
      const typing = e.target.closest && e.target.closest('input, textarea, [contenteditable]');
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setFindOpen(o => !o); }
      else if (e.key === '/' && !typing && !e.metaKey && !e.ctrlKey) { e.preventDefault(); setFindOpen(true); }
    };
    window.addEventListener('keydown', k);
    return () => window.removeEventListener('keydown', k);
  }, []);

  const openCase = useCallback((i) => setPendingCase(i), []);
  const onRead = useCallback((c) => setReader(c), []);

  return html`<${Fragment}>
    <div className="progress" ref=${progressRef} aria-hidden="true"></div>
    <${SiteNav} route=${route} go=${go} openFind=${openFind} />
    <${Tabs} route=${route} go=${go} />
    <main id="site">
      ${route === 'home' && html`<div className="site-view">
        <${Hero} go=${go} attempts=${attempts} /><${Benefits} go=${go} /><${DashPreview} go=${go} attempts=${attempts} />
        <${CasesSection} pending=${pendingCase} onRead=${onRead} /><${Cta} go=${go} /><${Footer} go=${go} openFind=${openFind} /></div>`}
      ${route === 'dashboard' && html`<div className="site-view"><${Dashboard} go=${go} /><${Footer} go=${go} openFind=${openFind} /></div>`}
      ${route === 'library' && html`<div className="site-view"><${CasesSection} pending=${pendingCase} onRead=${onRead} withExplorer=${true} /><${Footer} go=${go} openFind=${openFind} /></div>`}
    </main>
    ${quizMounted && html`<div className="quiz-host" hidden=${route !== 'quiz'}><${window.QuizApp} active=${route === 'quiz'} /></div>`}
    ${reader && html`<${Reader} c=${reader} onClose=${() => setReader(null)} />`}
    ${findOpen && html`<${Palette} onClose=${() => setFindOpen(false)} go=${go} openCase=${openCase} />`}
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();

</script>
</body>
</html>
