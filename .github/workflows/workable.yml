name: Workable

# jobs.workable.com's visible search page never paginates for a plain
# fetch, but a real, public, unauthenticated JSON API sits behind it
# (found via live network capture, not guessed):
# GET https://jobs.workable.com/api/v1/jobs?pageToken=... — no query =
# the WHOLE board (170k+ jobs, confirmed), real cursor pagination, and
# each job already embeds its company's real website directly. See
# workable_seed.py's module docstring for the full research.
#
# Two-stage pipeline, same shape as people_data_labs.yml/bigpicture.yml/
# opendata.yml — with one addition on top of that shape: the seed stage
# is ITSELF sharded (see below), since a single sequential seed run hit a
# real 429 (Too Many Requests) wall at ~400 pages, twice, at very
# different paging speeds (73s and 293s) — a per-runner quota, not a
# burst-rate limit, that only spreading the work across multiple
# runners (each its own IP) actually fixes. See workable_seed.py's
# module docstring for the full research (why page-range sharding is
# impossible, why location= query-space sharding is the real fix, the
# disclosed coverage caveat, and the 24-hour Retry-After bug already
# fixed there).
#
#   seed:           N shards, each pages ONE bucket of countries (see
#                   workable_seed.py's bucket_locations() — shard 0 is
#                   United States alone, the rest round-robin the other
#                   121 countries + Remote) and uploads its own partial
#                   CSV as a build artifact. Auto-resumes per-shard from
#                   its own Supabase checkpoint (crawl_checkpoints table,
#                   source="workable_seed") — no more manual Restart
#                   Token. Manual/occasional, not part of the daily
#                   schedule.
#   seed-finalize:  downloads every shard's partial CSV, merges +
#                   dedupes them by domain into one workable_companies.csv,
#                   and publishes THAT as a single GitHub Release asset
#                   named "Workable" — same stable shape the crawl stage
#                   already expects, so crawl.yml/the crawl job below
#                   never needs to know sharding happened upstream.
#   crawl:          downloads that Release asset, shards the CRAWL across
#                   its own N jobs — same node.py engine, same Quality
#                   Index gate, as every other probe here. Independent
#                   shard_count from the seed stage's — the two are
#                   sharded for different reasons (seed: dodge a 429
#                   quota wall; crawl: parallelize checking companies).
on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: "Seed only (skip crawling)"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag to use"
        required: false
        default: "workable-seed-data"
      seed_shard_count:
        description: "Seed shards (shard 0 = US alone, rest split remaining countries)"
        required: false
        default: "8"
      seed_time_budget_minutes:
        description: "Each seed shard self-stops after this many minutes"
        required: false
        default: "330"
      request_delay_seconds:
        description: "Pause between pages, in seconds"
        required: false
        default: "0.5"
      reset_seed:
        description: "Force every seed shard to restart from the top, ignoring its checkpoint"
        required: false
        type: boolean
        default: false
      shard_count:
        description: "Parallel crawl shards"
        required: false
        default: "10"
      concurrency:
        description: "Companies crawled in parallel per crawl shard"
        required: false
        default: "700"
      run_time_minutes:
        description: "Crawl phase self-stops after this many minutes"
        required: false
        default: "330"
      restart_index:
        description: "Resume override per crawl shard. Blank = auto-resume. 0 = full restart"
        required: false
        default: ""

concurrency:
  group: workable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-seed-matrix:
    if: ${{ github.event.inputs.run_seed == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build seed shard-index matrix from seed_shard_count input
        id: build
        run: |
          SHARD_COUNT="${{ github.event.inputs.seed_shard_count || '8' }}"
          MATRIX_JSON=$(python3 -c "
          import json
          shard_count = int('$SHARD_COUNT')
          print(json.dumps({'include': [{'shard': s} for s in range(shard_count)]}))
          ")
          echo "seed_shard_count: $SHARD_COUNT"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  seed:
    needs: prepare-seed-matrix
    if: ${{ github.event.inputs.run_seed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false   # one shard's 429/timeout shouldn't cancel the others
      matrix: ${{ fromJson(needs.prepare-seed-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: "Page this shard's location bucket (shard ${{ matrix.shard }}/${{ github.event.inputs.seed_shard_count || '8' }})"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          RESET_ARGS=()
          if [ "${{ github.event.inputs.reset_seed }}" = "true" ]; then
            RESET_ARGS=(--reset)
          fi
          exec python "Workable/workable_seed.py" \
            --output "workable_shard_${{ matrix.shard }}.csv" \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ github.event.inputs.seed_shard_count || '8' }} \
            --time-budget-minutes ${{ github.event.inputs.seed_time_budget_minutes || '330' }} \
            --request-delay-seconds ${{ github.event.inputs.request_delay_seconds || '0.5' }} \
            "${RESET_ARGS[@]}"

      - name: Upload this shard's partial CSV
        uses: actions/upload-artifact@v4
        with:
          name: workable-seed-shard-${{ matrix.shard }}
          path: workable_shard_${{ matrix.shard }}.csv
          retention-days: 14
          if-no-files-found: error

  seed-finalize:
    needs: seed
    if: ${{ always() && github.event.inputs.run_seed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download every shard's partial CSV
        uses: actions/download-artifact@v4
        with:
          pattern: workable-seed-shard-*
          path: shards
          merge-multiple: true

      - name: Merge + dedupe every shard's CSV by domain
        run: |
          python3 -c "
          import csv
          import glob

          seen = set()
          rows = []
          for path in sorted(glob.glob('shards/workable_shard_*.csv')):
              with open(path, newline='', encoding='utf-8') as f:
                  reader = csv.reader(f)
                  header = next(reader, None)
                  for row in reader:
                      if len(row) < 2 or not row[1] or row[1] in seen:
                          continue
                      seen.add(row[1])
                      rows.append(row)
              print(f'{path}: {sum(1 for _ in open(path)) - 1} rows')

          with open('workable_companies.csv', 'w', newline='', encoding='utf-8') as f:
              writer = csv.writer(f)
              writer.writerow(['name', 'domain'])
              writer.writerows(rows)
          print(f'Merged total: {len(rows)} unique companies -> workable_companies.csv')
          "

      - name: Publish merged CSV to Release (replacing any existing asset on this tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag || 'workable-seed-data' }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Workable" \
            --notes "Company seed data from jobs.workable.com's public jobs API — see Workable/workable_seed.py. Merged from ${{ github.event.inputs.seed_shard_count || '8' }} location-bucketed shards. Regenerated $(date -u +%Y-%m-%d)."
          gh release upload "$TAG" workable_companies.csv --clobber

  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build crawl shard-index matrix from shard_count input
        id: build
        run: |
          SHARD_COUNT="${{ github.event.inputs.shard_count || '10' }}"
          MATRIX_JSON=$(python3 -c "
          import json
          shard_count = int('$SHARD_COUNT')
          print(json.dumps({'include': [{'shard': s} for s in range(shard_count)]}))
          ")
          echo "shard_count: $SHARD_COUNT  |  total jobs: $SHARD_COUNT"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  crawl:
    needs: [seed-finalize, prepare-matrix]
    if: ${{ always() && github.event.inputs.run_seed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false   # one shard's issue shouldn't cancel the others
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp aiodns selectolax requests python-dotenv

      - name: Download Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag || 'workable-seed-data' }}"
          gh release download "$TAG" --pattern "workable_companies.csv" --dir .
          wc -l workable_companies.csv

      - name: "Crawl companies (shard ${{ matrix.shard }}/${{ github.event.inputs.shard_count || '10' }})"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          WORKABLE_DATASET_PATH: workable_companies.csv
        run: |
          ulimit -n 65536   # high --concurrency can exceed the runner's default 1024 fd limit and crash aiodns/c-ares (native segfault, not a catchable Python error)
          RESTART_ARGS=()
          if [ -n "${{ github.event.inputs.restart_index }}" ]; then
            RESTART_ARGS=(--restart-index "${{ github.event.inputs.restart_index }}")
          fi
          exec python "Workable/workable_probe.py" \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ github.event.inputs.shard_count || '10' }} \
            --concurrency ${{ github.event.inputs.concurrency || '700' }} \
            --time-budget-minutes ${{ github.event.inputs.run_time_minutes || '330' }} \
            "${RESTART_ARGS[@]}"
