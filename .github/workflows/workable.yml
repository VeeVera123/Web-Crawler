name: Workable

# jobs.workable.com's visible search page never paginates for a plain
# fetch, but a real, public, unauthenticated JSON API sits behind it
# (found via live network capture, not guessed):
# GET https://jobs.workable.com/api/v1/jobs?pageToken=... — no query =
# the WHOLE board (170k+ jobs, confirmed), real cursor pagination, and
# each job already embeds its company's real website directly. See
# workable_seed.py's module docstring for the full research.
#
# Two-stage pipeline, same shape as people_data_labs.yml/bigpicture.yml/
# opendata.yml:
#
#   seed:  pages through the whole public jobs feed (see workable_seed.py),
#          uploads the resulting company CSV as a single GitHub Release
#          asset named "Workable". Manual, occasional — not part of the
#          daily schedule. Small enough (thousands, not millions, of rows)
#          to need no chunking the way PDL's dataset does.
#
#   crawl: downloads that Release asset, shards the crawl across N jobs —
#          same node.py engine, same Quality Index gate, as every other
#          probe here.
on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: "Seed only (skip crawling)"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag to use"
        required: false
        default: "workable-seed-data"
      restart_token:
        description: "Resume seed from this token. Blank = start over"
        required: false
        default: ""
      request_delay_seconds:
        description: "Pause between pages, in seconds"
        required: false
        default: "0.5"
      shard_count:
        description: "Parallel shards"
        required: false
        default: "10"
      concurrency:
        description: "Companies crawled in parallel per shard"
        required: false
        default: "700"
      run_time_minutes:
        description: "Self-stop after this many minutes"
        required: false
        default: "330"
      restart_index:
        description: "Resume override per shard. Blank = auto-resume. 0 = full restart"
        required: false
        default: ""

concurrency:
  group: workable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    if: ${{ github.event.inputs.run_seed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360   # the hard ceiling — this step cannot be sharded (sequential cursor pagination)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: "Resume: download this run's own prior partial output"
        if: ${{ github.event.inputs.restart_token != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag || 'workable-seed-data' }}"
          if gh release download "$TAG" --pattern "workable_companies.csv" --dir . 2>/dev/null; then
            echo "Downloaded prior partial output: $(wc -l < workable_companies.csv) lines"
          else
            echo "No prior Release asset found for tag $TAG — starting a fresh lap despite Restart Token being set."
          fi

      - name: Page jobs.workable.com's public jobs API
        run: |
          python "Workable/workable_seed.py" \
            --output workable_companies.csv \
            --start-token "${{ github.event.inputs.restart_token }}" \
            --time-budget-minutes ${{ github.event.inputs.run_time_minutes || '330' }} \
            --request-delay-seconds ${{ github.event.inputs.request_delay_seconds || '0.5' }}

      - name: Upload to Release (replacing any existing asset on this tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag || 'workable-seed-data' }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Workable" \
            --notes "Company seed data from jobs.workable.com's public jobs API — see Workable/workable_seed.py. Regenerated $(date -u +%Y-%m-%d)."
          gh release upload "$TAG" workable_companies.csv --clobber

  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build shard-index matrix from shard_count input
        id: build
        run: |
          SHARD_COUNT="${{ github.event.inputs.shard_count || '10' }}"
          MATRIX_JSON=$(python3 -c "
          import json
          shard_count = int('$SHARD_COUNT')
          print(json.dumps({'include': [{'shard': s} for s in range(shard_count)]}))
          ")
          echo "shard_count: $SHARD_COUNT  |  total jobs: $SHARD_COUNT"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  crawl:
    needs: [seed, prepare-matrix]
    if: ${{ always() && github.event.inputs.run_seed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false   # one shard's issue shouldn't cancel the others
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp aiodns selectolax requests python-dotenv

      - name: Download Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag || 'workable-seed-data' }}"
          gh release download "$TAG" --pattern "workable_companies.csv" --dir .
          wc -l workable_companies.csv

      - name: "Crawl companies (shard ${{ matrix.shard }}/${{ github.event.inputs.shard_count || '10' }})"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          WORKABLE_DATASET_PATH: workable_companies.csv
        run: |
          ulimit -n 65536   # high --concurrency can exceed the runner's default 1024 fd limit and crash aiodns/c-ares (native segfault, not a catchable Python error)
          RESTART_ARGS=()
          if [ -n "${{ github.event.inputs.restart_index }}" ]; then
            RESTART_ARGS=(--restart-index "${{ github.event.inputs.restart_index }}")
          fi
          exec python "Workable/workable_probe.py" \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ github.event.inputs.shard_count || '10' }} \
            --concurrency ${{ github.event.inputs.concurrency || '700' }} \
            --time-budget-minutes ${{ github.event.inputs.run_time_minutes || '330' }} \
            "${RESTART_ARGS[@]}"
