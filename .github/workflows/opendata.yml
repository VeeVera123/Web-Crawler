name: OpenData

# Two-stage pipeline for opendata.org's "Organizations" dataset:
#
#   seed:  downloads + filters the raw source (one job, can't be sharded),
#          uploads the result as GitHub Release asset chunks. Manual,
#          occasional — not part of the daily schedule.
#
#   probe: downloads the Release chunks, shards the crawl across N jobs.

on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: "Check to seed only (download+filter+upload). Leave unchecked to crawl only, using what's already on the Release."
        required: false
        type: boolean
        default: false
      release_tag:
        description: "GitHub Release tag to upload to / download from"
        required: false
        default: "opendata-organizations"
      restart_id:
        description: "Seed only: resume from this row number (from a prior 'Restart ID' log line). 0 = start over."
        required: false
        default: "0"
      seed_time_budget_minutes:
        description: "Seed only: self-stop after this many minutes and log a Restart ID"
        required: false
        default: "340"
      shard_count:
        description: "Crawl stage: parallel shards"
        required: false
        default: "15"

concurrency:
  group: opendata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    if: ${{ github.event.inputs.run_seed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360   # the hard ceiling — see module docstring; this step cannot be sharded
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: "Resume: download + rejoin this run's own prior partial output"
        # Each run gets a fresh runner/filesystem — resuming (Restart ID >
        # 0) means opendata_seed.py's append-mode write needs the PRIOR
        # run's partial CSV already sitting here first, or there's nothing
        # to append onto and progress would be silently lost instead of
        # continued. Best-effort: a missing/never-uploaded prior file just
        # means this becomes a fresh run from row 0 despite Restart ID
        # being set — not fatal, just not actually resuming.
        if: ${{ github.event.inputs.restart_id != '0' && github.event.inputs.restart_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag || 'opendata-organizations' }}"
          if gh release download "$TAG" --pattern "opendata_chunk_*.csv" --dir chunks 2>/dev/null; then
            cat chunks/opendata_chunk_*.csv > opendata_organizations_filtered.csv
            echo "Rejoined prior partial output: $(wc -l < opendata_organizations_filtered.csv) lines"
          else
            echo "No prior Release assets found for tag $TAG — starting fresh despite Restart ID being set."
          fi

      - name: Download + stream-filter opendata.org Organizations
        env:
          OPENDATA_SOURCE_URL: ${{ secrets.OPENDATA_SOURCE_URL }}
        run: |
          python OpenData/opendata_seed.py \
            --output opendata_organizations_filtered.csv \
            --skip-rows ${{ github.event.inputs.restart_id || '0' }} \
            --time-budget-minutes ${{ github.event.inputs.seed_time_budget_minutes || '340' }}

      - name: Split filtered output into <2GB chunks (GitHub Release asset cap)
        run: |
          # split at 1.9GB to stay safely under the 2GiB-per-asset limit —
          # header-only-on-the-first-chunk so a plain `cat chunk_* > joined.csv`
          # on download reconstructs one valid CSV (see opendata_probe.py's
          # module docstring / this session's earlier join-strategy discussion).
          split -b 1900m -d --additional-suffix=.csv opendata_organizations_filtered.csv opendata_chunk_
          ls -la opendata_chunk_*.csv

      - name: Upload chunks to Release (replacing any existing assets on this tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag || 'opendata-organizations' }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "OpenData Organizations (filtered)" \
            --notes "Filtered opendata.org Organizations dataset — see OpenData/opendata_seed.py. Regenerated $(date -u +%Y-%m-%d)."
          # Clear old chunks first so a smaller re-filter never leaves stale
          # extra chunk files behind that a naive `cat chunk_*` would wrongly include.
          gh release view "$TAG" --json assets -q '.assets[].name' | grep '^opendata_chunk_' | \
            xargs -r -I{} gh release delete-asset "$TAG" {} -y || true
          gh release upload "$TAG" opendata_chunk_*.csv --clobber

  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build shard-index matrix from shard_count input
        id: build
        run: |
          SHARD_COUNT="${{ github.event.inputs.shard_count || '15' }}"
          MATRIX_JSON=$(python3 -c "
          import json
          shard_count = int('$SHARD_COUNT')
          print(json.dumps({'include': [{'shard': s} for s in range(shard_count)]}))
          ")
          echo "shard_count: $SHARD_COUNT"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  crawl:
    needs: [seed, prepare-matrix]
    # Checking run_seed means "seed only" — skip crawl entirely that run.
    # Unchecked means "crawl only" (seed itself is skipped via its own
    # `if`, so `always()` here just means "don't block on a skipped seed").
    if: ${{ always() && github.event.inputs.run_seed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp aiodns selectolax requests python-dotenv

      - name: Download + rejoin Release asset chunks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag || 'opendata-organizations' }}"
          gh release download "$TAG" --pattern "opendata_chunk_*.csv" --dir chunks
          # Header-only-on-first-chunk (see the seed job's split step) — a
          # plain concatenation is a valid single CSV.
          cat chunks/opendata_chunk_*.csv > opendata_organizations_filtered.csv
          wc -l opendata_organizations_filtered.csv

      - name: "OpenData probe — shard ${{ matrix.shard }}/${{ github.event.inputs.shard_count || '15' }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python OpenData/opendata_probe.py \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ github.event.inputs.shard_count || '15' }}
