name: CT Logs — Verify Slugs (Phase 2)

# Phase 2 of the CT-logs discovery pipeline: for each of the 4 platforms
# extracted by ctlog_extract.yml, hit every candidate slug's real board
# URL live and drop the ones that redirect to the ATS vendor's own
# marketing/root domain (confirmed pattern: acty.bamboohr.com ->
# https://www.bamboohr.com/) — a CT-log cert proves a hostname was once
# ISSUED, not that the tenant is still active today. A genuine job-board
# response (even zero current openings) is kept. Deliberately its OWN
# workflow, separate from ctlog_extract.yml (Phase 1), per explicit
# direction — this hits live third-party servers and can be slower/
# flakier than the crt.sh sweep itself, and neither phase should block or
# force a rerun of the other. Run this AFTER extract has populated
# ctlog_probe_results for the platforms you want verified.
#
# One shard per platform (4 total) — verification doesn't have the same
# page-cursor bottleneck extraction does (see ctlog_extract.yml's
# hostname-sharding comment); it's already a flat, fully async, bounded-
# concurrency sweep over that platform's rows within a single job, so
# there's no equivalent win to splitting a single platform's row range
# across multiple jobs the way extraction's alphabetical hostname shards
# help. workday removed along with the platform itself (see
# ctlog_extract.yml's comment on why).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report live/dead counts without deleting anything"
        required: false
        type: boolean
        default: false
      limit:
        description: "Only check the first N rows per platform (0 = no limit)"
        required: false
        default: "0"

concurrency:
  group: ctlog-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false   # one platform's flakiness shouldn't cancel the other 3
      matrix:
        platform: [bamboohr, icims, rippling, teamtailor]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp python-dotenv

      - name: "Verify ${{ matrix.platform }} slugs against live boards"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python ctlog_verify_async.py \
            --platform ${{ matrix.platform }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            ${{ github.event.inputs.limit != '0' && format('--limit {0}', github.event.inputs.limit) || '' }}
