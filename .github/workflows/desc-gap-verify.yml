name: Description Gap Verification

# One-off, temporary workflow: verifies the PageUp description-enrichment
# fix and investigates the BrassRing description gap using the real
# (unmodified) ats_scrapers.py against real tenants. Removed again once
# confirmed. Push-triggered (this branch only) since the Claude GitHub
# App's token can't call the workflow_dispatch API (403 "Resource not
# accessible by integration") — same as jobylon-diag.yml/jobylon-verify.yml
# earlier this session.

on:
  workflow_dispatch: {}
  push:
    branches: [claude/cloud-lg97bh]
    paths: [pageup_verify.py, .github/workflows/desc-gap-verify.yml]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run description-gap verification
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: python pageup_verify.py
