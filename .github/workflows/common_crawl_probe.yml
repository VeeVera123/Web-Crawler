name: Common Crawl

# One combined seed+crawl+detect pass over Common Crawl's Host Index — no
# queue tables, no separate seed step. Country is detected when found but
# never filters (most rows have no country). Streams one Parquet file at
# a time so memory stays bounded regardless of how many partitions run.
on:
  workflow_dispatch:
    inputs:
      crawl_partition:
        description: "Starting partition (e.g. CC-MAIN-2025-18). Blank = auto-detect the latest. Ignored if crawl_list is set."
        required: false
        default: ""
      partitions:
        description: "How many partitions to crawl, walking backward from the start. Ignored if crawl_list is set."
        required: false
        default: "1"
      crawl_list:
        description: "Comma-separated exact partitions instead, e.g. CC-MAIN-2025-18,CC-MAIN-2024-42. Overrides crawl_partition/partitions."
        required: false
        default: ""
      start_file_index:
        description: "Skip this many files in the first partition before starting"
        required: false
        default: "0"
      shard_count:
        description: "Parallel shards to split the crawl across"
        required: false
        default: "10"
      concurrency:
        description: "Hosts crawled in parallel per shard"
        required: false
        default: "700"
      time_budget_minutes:
        description: "Each shard self-stops after this many minutes (shared across all its requested partitions)"
        required: false
        default: "330"

concurrency:
  group: common-crawl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build shard-index matrix from shard_count input
        id: build
        run: |
          SHARD_COUNT="${{ github.event.inputs.shard_count || '10' }}"
          MATRIX_JSON=$(python3 -c "
          import json
          shard_count = int('$SHARD_COUNT')
          print(json.dumps({'include': [{'shard': s} for s in range(shard_count)]}))
          ")
          echo "shard_count: $SHARD_COUNT  |  total jobs: $SHARD_COUNT"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  crawl:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    # 350 keeps headroom under GitHub's 360min hard ceiling. Each shard
    # also pays the DuckDB seed-query cost up front, not just crawl time —
    # a stalled Hugging Face connection can eat into this margin; setting
    # the HF_TOKEN secret is the real fix for that, not a bigger number.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp aiodns selectolax requests python-dotenv duckdb

      - name: "Host Crawl v2 (shard ${{ matrix.shard }}/${{ github.event.inputs.shard_count || '10' }})"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          CRAWL_ARGS=()
          if [ -n "${{ github.event.inputs.crawl_list }}" ]; then
            CRAWL_ARGS=(--crawl-list "${{ github.event.inputs.crawl_list }}")
          elif [ -n "${{ github.event.inputs.crawl_partition }}" ]; then
            CRAWL_ARGS=(--crawl "${{ github.event.inputs.crawl_partition }}")
          fi

          python "Common Crawl/common_crawl_probe.py" \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ github.event.inputs.shard_count || '10' }} \
            --partitions ${{ github.event.inputs.partitions || '1' }} \
            --concurrency ${{ github.event.inputs.concurrency || '700' }} \
            --start-file-index ${{ github.event.inputs.start_file_index || '0' }} \
            --time-budget-minutes ${{ github.event.inputs.time_budget_minutes || '330' }} \
            "${CRAWL_ARGS[@]}"
