name: CT Logs — Extract Slugs (Phase 1)

# Phase 1 of the CT-logs discovery pipeline: sweep crt.sh's Certificate
# Transparency data for subdomain-based ATS platforms and write net-new
# candidate slugs into ctlog_probe_results. Deliberately its own workflow,
# SEPARATE from ctlog_verify.yml (Phase 2) — a slow/flaky live-verification
# pass should never block or force a rerun of extraction, and vice versa.
# Verification itself is on hold until every ATS in the active lineup has
# been extracted — a single unified verification pass covers everything
# in ctlog_probe_results at once, rather than growing per-platform as we
# go (per explicit direction).
#
# CLASS C RETIRED (2026-08) — every genuinely subdomain-per-tenant ATS has
# now been tried (bamboohr, icims, rippling, teamtailor, breezyhr,
# personio, recruitee, softgarden, zoho, hrmdirect, avature, eploy — see
# ctlog_extract.py's module docstring for the full per-platform history).
# Nothing left in Class C. This workflow now runs CLASS B instead:
# platforms where CT logs confirm a subdomain/tenant exists, but the full
# slug also needs a path or query segment a certificate can't carry —
# ctlog_extract.py live-fetches each confirmed host to try to recover
# that missing piece (see resolve_slugs_live()).
#
# SINGLE MATRIX: platform x hostname-shard, 3 platforms x 6 shards each
# = 18 jobs, under the 20-job account-wide concurrent cap (confirmed
# against GitHub's own docs, same budget note as this project's other
# workflows — see host_crawl.yml's comment on the same cap). More shards
# per platform than the old Class C matrix since there are only 3
# platforms now — plenty of headroom under the cap to split each one's
# hostname range finer. Each platform's crt.sh hostname range is
# genuinely splittable because the underlying query is already ORDER BY
# NAME_VALUE (alphabetical) — each shard keyset-paginates its own slice
# of that range independently, no coordination needed between shards
# (see ctlog_extract.py's query_certwatch_pages/_shard_bounds docstrings
# for the full mechanics). This is a REAL speedup, unlike naive
# over-sharding would be — crt.sh's guest Postgres role is one connection
# at a time, but that's PER SHARD.
#
# PLATFORMS (2026-08) — Class B, live-resolve: taleo, oracle_cloud_hcm,
# successfactors. workday was ALSO Class B and tried first — TRIED AND
# REMOVED (2026-08): two live runs confirmed crt.sh only surfaces
# ~115-123 hosts total for myworkdayjobs.com, over 90% of which is
# Workday's own internal infrastructure, not customer tenants (see
# ctlog_extract.py's module docstring for the full history). taleo/
# oracle_cloud_hcm/successfactors get a fresh try since nothing suggests
# they share that "mostly internal infra" problem — same abandon-if-
# mostly-noise bar applies once real numbers come back. jobadder/
# brassring considered and REJECTED as Class B — both actually live on
# ONE shared host with no subdomain-per-tenant shape at all
# (clientapps.jobadder.com/{client}/{board}, brassring.com?partnerId=&
# siteId=), so they're really Class A, same wall as greenhouse/lever.
on:
  workflow_dispatch:       # manual trigger — this pipeline is still new/
                            # being proven out, no schedule yet (add a
                            # cron: once Phase 1 + Phase 2 have both run
                            # clean a few times)

concurrency:
  group: ctlog-extract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false   # one shard's crt.sh hiccup shouldn't cancel the other 17
      matrix:
        platform: [taleo, oracle_cloud_hcm, successfactors]
        shard: [0, 1, 2, 3, 4, 5]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp psycopg2-binary python-dotenv requests

      - name: "Extract ${{ matrix.platform }} slugs (shard ${{ matrix.shard }}/6)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python ctlog_extract.py \
            --platform ${{ matrix.platform }} \
            --shard-index ${{ matrix.shard }} \
            --shard-count 6
