name: Probe Gusto Jobs (temporary)

# Temporary, manual, read-only: does jobs.gusto.com answer a plain request from a GitHub runner?
# (From the dev sandbox it returned a Cloudflare 403 challenge.) Prints status/size/title and, if HTML
# comes back, the form labels. No bypassing: an ordinary browser User-Agent and nothing else.
# Delete this file once the question is answered.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Plain requests to jobs.gusto.com
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"
          B="https://jobs.gusto.com/postings/lynx-customer-success-manager-ecdb1cf7-4348-42ee-b34c-3d88741c0d49"
          for u in "https://jobs.gusto.com/robots.txt" "$B" "$B/applicants/new"; do
            code=$(curl -s -m 30 -A "$UA" -L -o /tmp/out.html -w "%{http_code} %{size_download}b" "$u")
            title=$(grep -o '<title>[^<]*' /tmp/out.html | head -1 | sed 's/<title>//')
            echo "== $u -> $code | title: $title"
            if [ "${u##*/}" = "robots.txt" ]; then head -c 500 /tmp/out.html; echo; fi
          done
          echo "--- form labels on the apply page (if readable)"
          python3 - <<'PY'
          import re
          h = open("/tmp/out.html", errors="ignore").read()
          print("controls:", len(re.findall(r"<(?:input|select|textarea)\b", h)))
          labs = [re.sub(r"<[^>]+>|\s+", " ", x).strip() for x in re.findall(r"<label[^>]*>(.*?)</label>", h, re.S)]
          print("labels:", [l[:80] for l in labs[:20]])
          print("legends:", [re.sub(r"<[^>]+>|\s+", " ", x).strip()[:80] for x in re.findall(r"<legend[^>]*>(.*?)</legend>", h, re.S)][:10])
          PY
