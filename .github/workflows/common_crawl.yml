name: Common Crawl

# One combined seed+crawl+detect pass over Common Crawl's own CC-Index
# Table (queried directly — no third-party mirror) — no queue tables, no
# separate seed step. Country is detected when found but never filters
# (most rows have no country). Streams one Parquet file at a time so
# memory stays bounded regardless of how many partitions run.
#
# 2026-09: RELOOP — a partition can carry ~900 files, more than one
# GitHub Actions job can chew through inside its own timeout. Check
# "Loop until done" and finalize re-dispatches this same workflow the
# moment a run stops with files left, using each shard's own Supabase
# checkpoint (source, shard_index, shard_count, partition, resume_offset
# — see common_crawl_probe.py/node.py) to pick up exactly where it left
# off — no manual bookkeeping between runs. Stoppable the same way
# Discovery is: cancel the run (or just don't let the next one start) —
# the loop is nothing but one normal, individually-cancellable dispatch
# triggering the next.
on:
  workflow_dispatch:
    inputs:
      crawl_partition:
        description: "Starting partition. Blank = latest"
        required: false
        default: ""
      partitions:
        description: "How many partitions to crawl"
        required: false
        default: "1"
      crawl_list:
        description: "Exact partitions instead (comma-separated)"
        required: false
        default: ""
      start_file_index:
        description: "Skip this many files. Blank = auto-resume"
        required: false
        default: ""
      shard_count:
        description: "Parallel shards"
        required: false
        default: "10"
      concurrency:
        description: "Hosts crawled in parallel per shard"
        required: false
        default: "700"
      run_time_minutes:
        description: "Self-stop after this many minutes"
        required: false
        default: "330"
      loop_runs:
        description: "Auto-run again if files are left"
        type: boolean
        required: false
        default: false
      reset_stats:
        description: "Wipe this campaign's cumulative stats before starting (fresh count, not mixed with an older run of the same partitions). Never set this on a loop's own redispatch."
        type: boolean
        required: false
        default: false

concurrency:
  group: common-crawl-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write   # finalize needs this to dispatch the next loop run

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      resolved_partition: ${{ steps.resolve.outputs.resolved_partition }}
      campaign: ${{ steps.campaign.outputs.campaign }}
    steps:
      - name: Build shard-index matrix from shard_count input
        id: build
        run: |
          SHARD_COUNT="${{ github.event.inputs.shard_count || '10' }}"
          MATRIX_JSON=$(python3 -c "
          import json
          shard_count = int('$SHARD_COUNT')
          print(json.dumps({'include': [{'shard': s} for s in range(shard_count)]}))
          ")
          echo "shard_count: $SHARD_COUNT  |  total jobs: $SHARD_COUNT"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

      # 2026-09: resolve "blank = latest" to a CONCRETE partition name
      # exactly once here, instead of letting every shard (and, on a
      # looped run, every later dispatch) independently re-detect
      # "latest" — Common Crawl only ships a new monthly partition every
      # few weeks, but a multi-day loop chain crossing that boundary
      # would otherwise silently start crawling a different partition
      # list mid-chain. Ignored (and left blank) when crawl_list is set,
      # since that's already a concrete, unambiguous list.
      - name: Resolve starting partition (blank -> latest, pinned)
        id: resolve
        if: github.event.inputs.crawl_list == ''
        run: |
          python3 -c "
          import json, urllib.request
          pinned = '${{ github.event.inputs.crawl_partition }}'
          with urllib.request.urlopen('https://index.commoncrawl.org/collinfo.json', timeout=30) as r:
              names = [row['id'] for row in json.load(r) if row.get('id', '').startswith('CC-MAIN-')]
          resolved = pinned if pinned in names else (names[0] if names else pinned)
          print(f'resolved_partition={resolved}')
          " >> "$GITHUB_OUTPUT"

      # 2026-09: one stable id for this whole crawl request — every shard
      # and every loop redispatch of it passes the SAME string to
      # common_crawl_probe.py's --campaign, so their cumulative stat
      # flushes (see node.flush_stat_tallies) all land in the same bucket
      # regardless of which shard or which loop iteration produced them.
      # Computed here (not re-derived independently in the crawl job AND
      # the finalize job) so there is exactly one place this logic lives —
      # two separately-written bash expressions computing "the same"
      # string is exactly how they'd eventually drift apart. Always runs
      # (no `if`), unlike the "resolve" step above, since a --crawl-list
      # request still needs a campaign id even though it skips that step.
      - name: Compute this request's campaign id
        id: campaign
        run: |
          if [ -n "${{ github.event.inputs.crawl_list }}" ]; then
            echo "campaign=list::${{ github.event.inputs.crawl_list }}" >> "$GITHUB_OUTPUT"
          else
            echo "campaign=start::${{ steps.resolve.outputs.resolved_partition }}::${{ github.event.inputs.partitions || '1' }}" >> "$GITHUB_OUTPUT"
          fi

      # 2026-09: done HERE, once, rather than letting every one of the
      # crawl job's up-to-20 parallel shards each call --reset-stats on
      # its own startup — `crawl` depends on this whole job finishing
      # first, so this is guaranteed to complete before any shard can
      # possibly flush its first file's stats. Doing the reset per-shard
      # instead would race: whichever shard's own reset call happened to
      # run AFTER a faster sibling shard's first flush would silently wipe
      # that sibling's already-flushed numbers back to zero.
      - name: Reset this campaign's cumulative stats, if requested
        if: github.event.inputs.reset_stats == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "--reset-stats requested — wiping cumulative tallies for campaign '${{ steps.campaign.outputs.campaign }}'"
          curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/reset_stat_tallies" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"p_source\": \"common_crawl_probe\", \"p_campaign\": \"${{ steps.campaign.outputs.campaign }}\"}"

  crawl:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    # 350 keeps headroom under GitHub's 360min hard ceiling. Each shard
    # also pays the DuckDB seed-query cost up front, not just crawl time.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp aiodns selectolax requests python-dotenv duckdb

      - name: "Host Crawl v2 (shard ${{ matrix.shard }}/${{ github.event.inputs.shard_count || '10' }})"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # 2026-09: WebGraph domain-authority rank bands (S+/S/A/B/C) —
          # see webgraph.yml (builds/refreshes this Release asset) and
          # node.py's _load_webgraph_ranks() (downloads it once per
          # process, holds it in memory — not a live per-domain lookup).
          WEBGRAPH_TIERS_URL: https://github.com/${{ github.repository }}/releases/download/webgraph-domain-tiers/webgraph_domain_tiers.csv.gz
        run: |
          CRAWL_ARGS=()
          if [ -n "${{ github.event.inputs.crawl_list }}" ]; then
            CRAWL_ARGS=(--crawl-list "${{ github.event.inputs.crawl_list }}")
          else
            # Use prepare-matrix's pinned resolved_partition, not the raw
            # (possibly blank) input — see that job's "Resolve starting
            # partition" step for why every shard needs the SAME concrete
            # name, not each independently re-detecting "latest".
            CRAWL_ARGS=(--crawl "${{ needs.prepare-matrix.outputs.resolved_partition }}")
          fi
          # start_file_index is a MANUAL override only — blank (the
          # default) omits the flag entirely so common_crawl_probe.py's
          # own default (None) kicks in and auto-resumes from this
          # shard's Supabase checkpoint. This is also what makes the
          # reloop's re-dispatch (see the finalize job) work: it never
          # sets start_file_index, so every looped run auto-resumes.
          if [ -n "${{ github.event.inputs.start_file_index }}" ]; then
            CRAWL_ARGS+=(--start-file-index "${{ github.event.inputs.start_file_index }}")
          fi
          # NOTE: reset_stats is deliberately NOT passed as --reset-stats
          # here — prepare-matrix's own "Reset this campaign's cumulative
          # stats" step already did it exactly once, before any shard in
          # this matrix could start (see that step's comment for why doing
          # it per-shard here instead would race).

          ulimit -n 65536   # high --concurrency can exceed the runner's default 1024 fd limit and crash aiodns/c-ares (native segfault, not a catchable Python error)
          # 2026-09: `exec` (see people_data_labs.yml for the full explanation) makes GitHub's Cancel-workflow signal reach python directly instead of stopping at bash.
          exec python "Common Crawl/common_crawl_probe.py" \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ github.event.inputs.shard_count || '10' }} \
            --partitions ${{ github.event.inputs.partitions || '1' }} \
            --concurrency ${{ github.event.inputs.concurrency || '700' }} \
            --time-budget-minutes ${{ github.event.inputs.run_time_minutes || '330' }} \
            --campaign "${{ needs.prepare-matrix.outputs.campaign }}" \
            "${CRAWL_ARGS[@]}"

  finalize:
    needs: [prepare-matrix, crawl]
    # 2026-09: now ALWAYS runs (used to be gated on loop_runs=='true', so
    # a plain non-looped dispatch never got a summary at all — see the
    # "Print cumulative summary so far" step below, which every dispatch
    # now reaches). Looping itself is still opt-in: the redispatch step
    # further down only fires when loop_runs=='true' AND files are left.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp aiodns selectolax requests python-dotenv

      - name: Check for remaining checkpoints and re-dispatch if any
        id: checkpoints
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A checkpoint row surviving past this run means that shard
          # stopped on its time budget with files still left (a clean
          # finish always clears its own row — see
          # common_crawl_probe.py's run_host_crawl). ANY row left across
          # ANY shard means the overall crawl of the requested
          # partition(s) isn't done yet.
          #
          # Filtered to THIS run's own shard_count, same as workable.yml's
          # reloop job — otherwise a leftover row from a differently-sized
          # past run (e.g. an old shard_count=10 crawl) would inflate this
          # count and could trigger a loop even when every shard from the
          # CURRENT request has already finished.
          SHARD_COUNT="${{ github.event.inputs.shard_count || '10' }}"
          REMAINING=$(curl -sS "$SUPABASE_URL/rest/v1/crawl_checkpoints?source=eq.common_crawl_probe&shard_count=eq.$SHARD_COUNT&select=shard_index" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "Shards with a remaining checkpoint: $REMAINING"
          echo "remaining=$REMAINING" >> "$GITHUB_OUTPUT"

          if [ "$REMAINING" = "0" ]; then
            echo "status_line=FINAL — every requested partition fully covered, across every shard and every loop iteration" >> "$GITHUB_OUTPUT"
            echo "All requested partition(s) fully covered — not looping."
            exit 0
          fi

          echo "status_line=IN PROGRESS — $REMAINING/$SHARD_COUNT shard(s) still have files left" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event.inputs.loop_runs }}" != "true" ]; then
            echo "Files left, but loop_runs is off — not auto-redispatching (run again manually, or with Loop until done checked)."
            exit 0
          fi

          echo "Files left — dispatching the next loop run."
          # --repo is required: this job has no checkout step (nothing
          # else it does needs the repo contents), so gh has no local git
          # context to infer the repo from otherwise — without this it
          # fails with "fatal: not a git repository" and the loop silently
          # stops re-dispatching (same fix as workable.yml's reloop job).
          gh workflow run "common_crawl.yml" \
            --repo "${{ github.repository }}" \
            -f crawl_partition="${{ needs.prepare-matrix.outputs.resolved_partition }}" \
            -f partitions="${{ github.event.inputs.partitions || '1' }}" \
            -f crawl_list="${{ github.event.inputs.crawl_list }}" \
            -f shard_count="$SHARD_COUNT" \
            -f concurrency="${{ github.event.inputs.concurrency || '700' }}" \
            -f run_time_minutes="${{ github.event.inputs.run_time_minutes || '330' }}" \
            -f loop_runs=true
            # reset_stats deliberately omitted -> defaults to false on the
            # redispatch, same as workable.yml's reset_seed=false-during-
            # loop rule: a mid-chain loop iteration must never re-wipe a
            # campaign's already-flushed cumulative stats.

      # 2026-09: the very last file of the very last partition, from
      # every shard, across every loop iteration this campaign has ever
      # run — this step is what actually prints that. It runs every time
      # finalize runs (looped or not), reading back whatever's
      # accumulated in crawl_stat_tallies so far (see
      # node.fetch_cumulative_stats); status_line above already says
      # plainly whether that's the true final total or a snapshot with
      # shards still in flight.
      - name: Print cumulative summary so far
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python "Common Crawl/common_crawl_probe.py" \
            --summarize-campaign "${{ needs.prepare-matrix.outputs.campaign }}" \
            --summary-status-line "${{ steps.checkpoints.outputs.status_line }}"
