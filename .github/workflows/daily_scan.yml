name: ATS Global Scanner

on:
  schedule:
    - cron: "0 6 * * *"   # 6:00 UTC = 7:00 AM WAT
  workflow_dispatch:       # manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180    # 3 hours for 100k+ companies

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: cerebras   # Options: cerebras, groq, anthropic
        run: python main.py   # TEMP: testing AI classification — change back to main.py when done
