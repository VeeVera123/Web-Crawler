name: ATS Global Scanner

on:
  schedule:
    - cron: "0 6 * * *"   # 6:00 UTC = 7:00 AM WAT
  workflow_dispatch:       # manual trigger

# Belt-and-suspenders: GitHub already serializes runs of the same workflow+ref
# by default for `schedule`/`workflow_dispatch` unless you opt into concurrent
# runs, but we don't rely on that — the finalize job's `needs:` gate is what
# actually prevents the stale-job race, not this.
concurrency:
  group: ats-global-scanner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 8-way matrix over ATS company slugs, sharded by hashlib.md5(f"{ats}|{slug}")
  # % 8 in main.py. 8 concurrent jobs (+ 1 for scrape-job-boards below = 9)
  # stays well under GitHub Free's 20-concurrent-job account-wide cap, with
  # headroom for a manual re-run or the weekly discover/enrich workflows if
  # their schedules ever happen to overlap (they currently don't).
  scrape-ats:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false   # one bad shard shouldn't cancel the other 7
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner (shard ${{ matrix.shard }}/8)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          LLM_PROVIDER: cerebras   # Legacy fallback (multi-provider mode used when keys are set)
          # 8 scrape-ats shards + 1 scrape-job-boards job all classify with AI
          # concurrently, sharing Gemini/Groq's free-tier per-key quota — this
          # tells each process to throttle itself to a 1/9 fair share instead
          # of racing the other 8 for the whole quota. See config.py.
          AI_RATE_SHARDS: "9"
        run: python main.py --shard ${{ matrix.shard }} --total-shards 8

  # Job boards (RemoteOK, WeWorkRemotely, Jobicy, etc.) hit entirely different
  # hosts than the ATS platforms, so they run as their own job in parallel
  # with the scrape-ats matrix rather than serialized after it.
  scrape-job-boards:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner (job boards only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          LLM_PROVIDER: cerebras
          AI_RATE_SHARDS: "9"   # same fair-share throttle as scrape-ats — see config.py
        run: python main.py --job-boards-only

  # Cleanup (cleanup_stale_jobs) only runs once ALL shards + the job-boards
  # job have finished — running it per-shard would race: a shard that
  # finishes early could mark jobs from a still-running peer shard's
  # companies as stale and delete them. `if: always()` means finalize still
  # runs (and still marks jobs seen by the shards that DID succeed) even if
  # one shard timed out or failed, instead of silently skipping cleanup.
  finalize:
    needs: [scrape-ats, scrape-job-boards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Finalize (cleanup stale jobs)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          LLM_PROVIDER: cerebras
        run: python main.py --finalize
