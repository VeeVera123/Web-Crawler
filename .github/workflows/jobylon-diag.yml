name: Jobylon Diagnostic

# Standalone, read-only evidence-gathering workflow for the Jobylon
# scraper's 100% failure rate (0 jobs / 40 boards failed in the last real
# crawl run). Does not touch ats_scrapers.py, discovery.py, Supabase, or
# any production crawl path -- only fetches public emp.jobylon.com URLs
# (sitemap + a few real company/job pages) and prints what it finds, so
# the fix can be based on live evidence instead of another guess.
#
# Manual-dispatch only -- this is a one-off diagnostic tool, not part of
# the daily crawl schedule. Temporarily also fires on push to this one
# working branch (the Claude GitHub App's token can't call the
# workflow_dispatch API -- 403 "Resource not accessible by integration" --
# so this is how this specific run gets kicked off without a human
# clicking "Run workflow"); remove the `push:` trigger once this
# diagnostic's evidence has been gathered.

on:
  workflow_dispatch: {}
  push:
    branches: [claude/cloud-lg97bh]
    paths: [jobylon_diag.py, .github/workflows/jobylon-diag.yml]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install httpx[http2]

      - name: Run Jobylon diagnostic
        run: python jobylon_diag.py
