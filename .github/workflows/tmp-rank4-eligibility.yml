name: tmp-rank4-eligibility

on:
  push:
    paths:
      - "rank4_eligibility_probe.py"
      - ".github/workflows/tmp-rank4-eligibility.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ats:
          - greenhouse
          - ashby
          - lever
          - workable
          - recruitee
          - smartrecruiters
          - teamtailor
          - breezyhr
          - jazzhr
          - hrmdirect
          - adp
          - zoho
          - oracle_cloud_hcm
          - rippling
          - bamboohr
          - icims
          - workday
          - personio
          - joincom
          - taleo
          - paylocity
          - jobvite
          - eploy
          - pageup
          - pinpoint
          - isolvedhire
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python rank4_eligibility_probe.py ${{ matrix.ats }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
