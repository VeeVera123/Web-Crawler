name: HTTPX Migration Diff Test

# Standalone, read-only evidence-gathering workflow for the requests->httpx
# migration OpenAI's reviewed plan calls for (Phase 0/1: prove byte-for-byte
# transport equivalence BEFORE any production scraper code switches
# transports). This workflow does not touch ats_scrapers.py, discovery.py,
# or any production crawl path -- it only fetches a handful of real,
# public, unauthenticated ATS job-board URLs through both `requests` and
# `httpx` and diffs the results, then uploads the JSON comparison as a
# downloadable artifact.
#
# Manual-dispatch only -- this is a one-off diagnostic tool, not part of
# the daily crawl schedule.

on:
  workflow_dispatch: {}

jobs:
  diff-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests httpx

      - name: Run requests-vs-httpx differential harness
        run: python httpx_migration_diff_harness.py
        continue-on-error: true  # non-zero exit means a mismatch was found -- still want the artifact uploaded

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: httpx-diff-harness-results
          path: httpx_diff_harness_results.json
          retention-days: 14
