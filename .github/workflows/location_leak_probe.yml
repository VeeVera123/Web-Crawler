name: Location Leak Probe

# One-off diagnostic, workflow_dispatch only, never scheduled. Pulls real
# rows from Supabase's jobs table matching user-reported leaked locations
# (New York NY, Bangalore India, a Thalgau/Austria address, Kenya, Brazil,
# South Africa) so the actual cause can be diagnosed from real production
# data -- which rank/pipeline/role_category let each one in, and whether
# its real description_snippet actually contained a restrictive
# application question that should have blocked it.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run location leak probe
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: exec python location_leak_probe.py
