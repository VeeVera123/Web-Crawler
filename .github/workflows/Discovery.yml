name: Discovery

on:
  schedule:
    - cron: "0 3 * * 0"   # Every Sunday at 3:00 UTC
  workflow_dispatch:       # manual trigger

# Belt-and-suspenders, same reasoning as daily_scan.yml's concurrency block —
# GitHub already serializes same-workflow schedule/workflow_dispatch runs by
# default, but we don't rely on that.
concurrency:
  group: discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 11-job matrix over 7 sources, all running in parallel — instead of one
  # job running everything back-to-back. Each source is already an
  # independent fetch-and-resolve pass (bulk single download for most,
  # thousands of live per-company fetches for sources 6-7), so sharding
  # BY SOURCE is the natural split here — unlike daily_scan.yml's ATS-board
  # matrix, there's no single flat pool of "work items" to hash-shard
  # across a fixed number of workers. Concurrent writes across different
  # sources/shards are safe: every upsert already goes through
  # `on_conflict=ats,slug` per-row, so there's no shared mutable state to
  # race on.
  #
  # commoncrawl runs as 4 separate jobs (platform-sharded, not source-
  # sharded) rather than 1 — originally split into 2 in 2026-08 when a 9th
  # source, Web Data Commons, was retired for a bad cost/payoff ratio (37
  # net-new slugs for ~4 minutes of live fetching against a 3000-page
  # sample) and its matrix slot was handed to Common Crawl instead, since
  # Common Crawl was already the slowest single job in this matrix (27
  # platforms x up to 6 crawls x however many patterns each, all
  # sequential in one job) and actually benefits from being split, unlike
  # WDC which was just spending runtime for near-nothing. Bumped from 2 to
  # 4 shards in 2026-09 when TheirStack (formerly source 7) was removed,
  # freeing up another matrix slot for the same reason — Common Crawl
  # remained the slowest source and splitting further keeps cutting
  # wall-clock. See discovery.py's fetch_commoncrawl_slugs docstring for
  # how the platform-sharding works.
  #
  # TheirStack (freemium technology-usage API) was removed 2026-09 at the
  # user's request — see discovery.py's module docstring for the full
  # list of remaining sources.
  #
  # httparchive runs as 2 separate jobs too (date-sharded, via --ha-shard/
  # --ha-total-shards), added 2026-09 because this source's single ~90min
  # job was the slowest thing left in the matrix and often didn't finish.
  # Deliberately NOT sharded by ATS tech the way commoncrawl is sharded by
  # platform: `httparchive.crawl.pages` is partitioned by `date`, not by
  # `technology`, so splitting the resolved crawl-date list in half means
  # each shard's BigQuery query scans roughly half the partition bytes —
  # summed across shards, same total bytes scanned as one unsharded run,
  # just parallelized. Splitting by tech instead would have each shard
  # rescan the SAME full-date-range bytes regardless of which tech it
  # filters for (no cost benefit from that WHERE clause, since technology
  # isn't a partition/clustering key) — multiplying this source's BigQuery
  # cost by the shard count for zero extra coverage, which is why THAT
  # path was rejected rather than just cranking this shard count up
  # further. See fetch_httparchive_candidate_urls' docstring for the full
  # reasoning.
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false   # one bad source/shard shouldn't cancel the rest
      matrix:
        include:
          - source: feashliaa
          - source: kalil
          - source: openpostings
          - source: commoncrawl
          - source: wayback_adp
          - source: yc
            extra_args: "--cc-shard 0 --cc-total-shards 4"
          - source: commoncrawl
            extra_args: "--cc-shard 1 --cc-total-shards 4"
          - source: commoncrawl
            extra_args: "--cc-shard 2 --cc-total-shards 4"
          - source: httparchive
            extra_args: "--ha-shard 0 --ha-total-shards 2"
          - source: httparchive
            extra_args: "--ha-shard 1 --ha-total-shards 2"
          - source: httparchive
            extra_args: "--ha-shard 1 --ha-total-shards 2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests python-dotenv google-cloud-bigquery

      - name: Write GCP service account key (for HTTP Archive/BigQuery source)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        if: ${{ env.GCP_SA_KEY != '' && matrix.source == 'httparchive' }}
        run: echo "$GCP_SA_KEY" > "${{ runner.temp }}/gcp-key.json"

      - name: "Run discovery (source: ${{ matrix.source }})"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
      # 2026-09: `exec` (see people_data_labs.yml for the full explanation) makes GitHub's Cancel-workflow signal reach python directly instead of stopping at bash.
        run: exec python discovery.py --source ${{ matrix.source }} ${{ matrix.extra_args }}
        # GCP_PROJECT_ID/GCP_SA_KEY are optional — discovery.py logs a
        # one-line notice and skips the httparchive source cleanly if
        # they aren't set, rather than failing the run. See discovery.py's
        # module docstring (source 7) for what's needed and how to set it
        # up. THEIRSTACK_API_KEY was removed 2026-09 along with the
        # TheirStack source itself.
