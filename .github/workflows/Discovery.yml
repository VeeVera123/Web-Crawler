name: Discovery

on:
  schedule:
    - cron: "0 3 * * 0"   # Every Sunday at 3:00 UTC
  workflow_dispatch:       # manual trigger
    inputs:
      timeout_minutes:
        description: "Per-job timeout, in minutes"
        required: false
        default: "300"
      # only_ct_logs REMOVED 2026-09 at the user's request, alongside
      # disabling ct_logs itself (see the matrix comment below) — with no
      # ct_logs matrix jobs left to filter down to, this input would do
      # nothing. Re-add both together if ct_logs is ever turned back on.

# Belt-and-suspenders, same reasoning as daily_scan.yml's concurrency block —
# GitHub already serializes same-workflow schedule/workflow_dispatch runs by
# default, but we don't rely on that.
concurrency:
  group: discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 2026-09: matrix rebalanced twice this week. First pass cut httparchive
  # from 3 shards to 1 to free budget for three new Hugging Face bulk
  # sources (Aramente H.F, Open Jobs Daily H.F, Zalize H.F). Second pass,
  # immediately after — Aramente H.F and Zalize H.F were REMOVED entirely
  # at the user's request (their discovery.py functions are left defined/
  # unused; see discovery.py's module docstring, Source 13/14 comments).
  # Open Jobs Daily H.F stays, newly wired in here (existed in discovery.py
  # already but had no matrix job until this week) with its own 3-way
  # file-sharding. With those two sources' 4 job slots freed again,
  # httparchive is restored to its original 3 date-sharded jobs — that
  # reduction was purely a matrix-budget trade with no cost difference
  # either way (see its own comment below), so reverting it is free now
  # that the budget it was freed for no longer exists. Latmay stays a
  # single unsharded job, same single-Parquet-file reasoning as always.
  #
  # 16-job matrix over 9 sources (was 23 jobs/12 sources — ct_logs' 4
  # shards removed 2026-09, and feashliaa/kalil/openpostings/github
  # (registries) collapsed from 4 separate jobs into 1 `github_combined`
  # job, both changes explicit user requests — see those sources' own
  # comments below), all running in parallel — instead of one
  # job running everything back-to-back. Each source is already an
  # independent fetch-and-resolve pass (bulk single download for most,
  # thousands of live per-company fetches for sources 6-7), so sharding
  # BY SOURCE is the natural split here — unlike daily_scan.yml's ATS-board
  # matrix, there's no single flat pool of "work items" to hash-shard
  # across a fixed number of workers. Concurrent writes across different
  # sources/shards are safe: every upsert already goes through
  # `on_conflict=ats,slug` per-row, so there's no shared mutable state to
  # race on.
  #
  # 2026-09 rebalance: wayback cut from 5 shards to 3, httparchive
  # restored to 1 unsharded job (it wasn't actually benefiting from 3 —
  # see its own comment below), and those freed slots handed to ct_logs,
  # which went from 1 unsharded job to 4 platform-sharded ones (see the
  # ct_logs comment below for why a full unsharded sweep was worth
  # splitting). Net matrix size unchanged.
  #
  # 2026-09: Y Combinator removed (companies surface via Common Crawl/
  # OpenPostings/the HF sources just as well — see discovery.py's module
  # docstring), replaced with two Hugging Face sources: Latmay H.F
  # (huggingface.co/datasets/latmay/ats-career-page-urls, already-resolved
  # ATS URLs, no live crawl needed) and Edward H.F
  # (huggingface.co/datasets/edwarddgao/open-apply-jobs, 31M+ job postings
  # across 375 Parquet shards — see fetch_edwarddgao_slugs' own time
  # budget for why it self-stops gracefully rather than needing sharding
  # here). Both write to Supabase under their own literal `source` values
  # ("Latmay H.F" / "Edward H.F") — see the 2026-09 archive_i.source CHECK
  # constraint migration.
  #
  # commoncrawl runs as 3 separate jobs (platform-sharded, not source-
  # sharded) rather than 1 — originally split into 2 in 2026-08 when a 9th
  # source, Web Data Commons, was retired for a bad cost/payoff ratio (37
  # net-new slugs for ~4 minutes of live fetching against a 3000-page
  # sample) and its matrix slot was handed to Common Crawl instead, since
  # Common Crawl was already the slowest single job in this matrix
  # (platforms x up to 6 crawls x however many patterns each, all
  # sequential in one job) and actually benefits from being split, unlike
  # WDC which was just spending runtime for near-nothing. Went 2 -> 4 -> 3
  # as the matrix's other slots shifted around (TheirStack removed, then
  # httparchive gained its own shards below) — 3 keeps it split without
  # over-provisioning past what this account's concurrent-job cap can
  # actually run at once (queued-but-not-running shards buy nothing, see
  # this conversation's own shard-count discussion). See discovery.py's
  # fetch_commoncrawl_slugs docstring for how the platform-sharding works.
  #
  # wayback runs as 3 separate jobs (platform-sharded, via --wayback-shard/
  # --wayback-total-shards, same scheme as commoncrawl above) — added
  # 2026-09 alongside raising discovery.py's _WAYBACK_MAX_PAGES from 25 to
  # 500. That cap was getting hit on every Greenhouse pattern in the same
  # unsharded run at exactly 125,000 snapshots (25 pages x 5000/page);
  # raising it lets a heavily-archived platform actually finish fetching,
  # but only makes sense paired with sharding — otherwise all that extra
  # allowed pagination would just stack onto one job's wall-clock instead
  # of running across shards in parallel. Cut from 5 shards to 3 in the
  # same 2026-09 rebalance that split ct_logs into 4 shards below — 5 was
  # more than this account's concurrent-job cap could usefully run at
  # once for a source that isn't the matrix's bottleneck. See
  # fetch_wayback_slugs' docstring.
  #
  # httparchive runs as 1 unsharded job again (was 3, date-sharded via
  # --ha-shard/--ha-total-shards). Cut to 1 briefly in 2026-09 to free
  # matrix slots for a batch of new HF sources, restored to 3 right after,
  # then cut back to 1 for good in the same rebalance that gave ct_logs
  # 4 shards — those 2 freed slots is what ct_logs' extra 3 shards cost.
  # Confirmed cost-neutral either way: `httparchive.crawl.pages` is
  # partitioned by `date`, not by `technology`, so splitting the resolved
  # crawl-date list just spreads the SAME total scanned bytes across N
  # jobs instead of scanning them all in one — no BigQuery cost or
  # correctness difference, purely a matrix-budget/wall-clock trade.
  # Deliberately NOT sharded by ATS tech instead — that WOULD multiply
  # BigQuery cost by the shard count, since technology isn't a partition/
  # clustering key. See fetch_httparchive_candidate_urls' docstring for
  # the full reasoning.
  #
  # ct_logs DISABLED 2026-09 at the user's request — takes NO matrix job
  # slots/shards here anymore (was 4 platform-sharded jobs; see git history
  # for the exact matrix entries if restoring). discovery.py's own
  # fetch_ct_log_slugs()/CT_LOG_SUFFIXES/crt.sh-querying code is left fully
  # intact and unused (same "commented out of the matrix, function still
  # defined" treatment this file already gives Y Combinator/Zalize H.F/
  # Aramente H.F — see discovery.py's module docstring and main()'s
  # "Source 6"/"Source 13"/"Source 14" comments for that precedent), and
  # discovery.py's CLI dispatcher still accepts `--source ct_logs`
  # explicitly (just no longer swept in by `--source all`) for exactly the
  # "run it yourself occasionally" manual use this source's own code
  # comments always described it as. To re-enable in CI: restore the 4
  # `ct_logs` matrix entries (platform-sharded via --ct-shard/
  # --ct-total-shards, same scheme as commoncrawl/wayback), the
  # `only_ct_logs` workflow_dispatch input above, and change
  # discovery.py main()'s `if args.source == "ct_logs":` back to
  # `if args.source in ("ct_logs", "all"):`. NOTE: archive_i.source's
  # CHECK constraint already includes 'ct_logs' (added when this source
  # was first built) so no migration is needed to turn it back on.
  #
  # GitHub repo registries (a short, manually-curated list of known public
  # GitHub repos, currently just datascry/openroles, that publish
  # pre-built ATS tenant/slug JSON files; fetched via jsDelivr's CDN
  # mirror, no GitHub API/auth involved, so no extra secret or rate-limit
  # concern here). Most mapped platforms are a free local reassembly from
  # that repo's own metadata (workday, brassring, oracle_cloud_hcm); csod
  # needs one bounded live per-tenant HTTP resolve instead (see
  # --csod-resolve-budget-minutes, default 15min). See discovery.py's
  # module docstring (source 11) and fetch_github_registries_slugs' own
  # docstring for the full research trail, including why successfactors
  # and UKG/ultipro are deliberately excluded rather than mapped.
  #
  # 2026-09 FOLLOW-UP (explicit user request): this job used to run
  # standalone (--source github). It's now folded into the single
  # `github_combined` job above alongside feashliaa/kalil/openpostings —
  # all 4 upsert under the same consolidated 'Github' archive_i.source
  # value already (see discovery.py's CONSOLIDATION comment), so running
  # them as 4 separate matrix jobs/runners wasn't actually consolidated in
  # the sense meant. See discovery.py's "FOLLOW-UP" comment on its 4
  # `if args.source in (X, "github_combined", "all")` blocks.
  #
  # 2026-09: Open Jobs Daily H.F (huggingface.co/datasets/Yigit-Karaman/
  # open-jobs-daily, 15 Parquet files across 2 configs, CC0-1.0) added as
  # its own 3-way file-sharded matrix job — existed in discovery.py
  # already but had no matrix job until now. Two sibling HF sources added
  # alongside it the same week, Aramente H.F (eu-tech-jobs) and Zalize H.F
  # (tech-job-postings-salary-dataset), were REMOVED again immediately
  # after at the user's request — see discovery.py's module docstring
  # (Source 13/14 comments) for why; their functions are left defined/
  # unused there, and they have no matrix job here.
  #
  # Every sharded entry below also sets `name:` — without it, GitHub's
  # default matrix job display name spells out every matrix key verbatim
  # (e.g. "discover (commoncrawl, --cc-shard 0 --cc-total-shards 3)"),
  # which gets long and repetitive fast across this many shards. The job
  # itself still just uses `name:` for display; `matrix.source` (and
  # extra_args) are what actually drive the run.
  #
  # TheirStack (freemium technology-usage API) was removed 2026-09 at the
  # user's request — see discovery.py's module docstring for the full
  # list of remaining sources.
  #
  # 2026-09: timeout-minutes was hardcoded to 90, completely independent of
  # discovery.py's own --httparchive-resolve-budget-minutes (default 300)
  # — every HTTP Archive shard was getting hard-killed by GitHub's job
  # timeout at 90min with a KeyboardInterrupt, 210 minutes before its own
  # internal time budget would have stopped it gracefully and written out
  # whatever it had resolved so far. Now driven by the timeout_minutes
  # input above (default "300", matching the internal budget so the two
  # limits don't fight each other) so it can also be raised for one-off
  # manual runs without editing this file. The other 8 (non-httparchive)
  # shards finish in a few minutes each regardless — a generous shared job
  # timeout costs them nothing, it just means a genuinely wedged job doesn't
  # sit queued/running for hours before GitHub notices.
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.timeout_minutes || '300') }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false   # one bad source/shard shouldn't cancel the rest
      matrix:
        include:
          - source: github_combined
            name: Github 
          - source: commoncrawl
            name: common crawl 1
            extra_args: "--cc-shard 0 --cc-total-shards 3"
          - source: commoncrawl
            name: common crawl 2
            extra_args: "--cc-shard 1 --cc-total-shards 3"
          - source: commoncrawl
            name: common crawl 3
            extra_args: "--cc-shard 2 --cc-total-shards 3"
          - source: wayback
            name: wayback 1
            extra_args: "--wayback-shard 0 --wayback-total-shards 3"
          - source: wayback
            name: wayback 2
            extra_args: "--wayback-shard 1 --wayback-total-shards 3"
          - source: wayback
            name: wayback 3
            extra_args: "--wayback-shard 2 --wayback-total-shards 3"
          - source: latmay
            name: Latmay H.F
          - source: icims_hrjobs
            name: iCIMS HR Jobs
          - source: edwarddgao
            name: Edward H.F 1
            extra_args: "--hf-shard 0 --hf-total-shards 3"
          - source: edwarddgao
            name: Edward H.F 2
            extra_args: "--hf-shard 1 --hf-total-shards 3"
          - source: edwarddgao
            name: Edward H.F 3
            extra_args: "--hf-shard 2 --hf-total-shards 3"
          - source: httparchive
            name: http archive
          - source: openjobsdaily
            name: Open Jobs Daily H.F 1
            extra_args: "--hf-shard 0 --hf-total-shards 3"
          - source: openjobsdaily
            name: Open Jobs Daily H.F 2
            extra_args: "--hf-shard 1 --hf-total-shards 3"
          - source: openjobsdaily
            name: Open Jobs Daily H.F 3
            extra_args: "--hf-shard 2 --hf-total-shards 3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # only_ct_logs (workflow_dispatch input) REMOVED 2026-09 alongside
      # disabling ct_logs itself — see the matrix comment above. These
      # steps ran unconditionally before only_ct_logs existed and do again
      # now.
      - name: Install dependencies
        # pyarrow: needed by the Latmay/Edward/Open Jobs Daily H.F sources
        # to read Hugging Face's auto-converted Parquet dataset exports.
        # psycopg2-binary: needed by the ct_logs source, which queries
        # crt.sh's public Postgres database directly (its HTTP endpoint's
        # own robots.txt disallows automated access — see discovery.py's
        # module comment above CRTSH_PG_HOST for the full explanation).
        # 2026-09 FIX (real production evidence): aiohttp/selectolax/
        # aiodns/beautifulsoup4 added — discovery.py's
        # _get_verification_module() bridges into
        # Verification/verification.py for the CC/Wayback live pre-check
        # (see discovery.py's own module comment on that function).
        # verification.py's own top-level imports are `import aiohttp`,
        # `import node` (which itself does `import aiohttp`,
        # `from selectolax.lexbor import LexborHTMLParser` at ITS top
        # level, and a guarded, optional `import aiodns` a few call sites
        # deep — see node.py's own comments on that one degrading
        # gracefully if absent, unlike the other three), and
        # `from ats_scrapers import scrape_board` (which needs
        # `bs4`/beautifulsoup4). NONE of these were ever installed here
        # because, until a separate 2026-09 fix to the bridge's own
        # directory-resolution math, the whole import silently failed for
        # an UNRELATED reason (couldn't even locate the file) before ever
        # reaching any of these — so this missing-dependency gap was
        # masked the entire time. Confirmed live: fixing the path bug
        # immediately surfaced "No module named 'aiohttp'" instead, on
        # this exact step. verification.yml (which runs verification.py
        # directly, never through this bridge) already installs
        # `aiohttp aiodns selectolax requests beautifulsoup4
        # python-dotenv` for exactly this reason — this brings
        # Discovery.yml's INDIRECT use of the same module up to the same
        # requirement (aiodns included for parity/DNS-resolver
        # performance even though node.py degrades fine without it).
        run: pip install requests python-dotenv google-cloud-bigquery pyarrow psycopg2-binary aiohttp aiodns selectolax beautifulsoup4

      - name: Write GCP service account key (for HTTP Archive/BigQuery source)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        if: ${{ env.GCP_SA_KEY != '' && matrix.source == 'httparchive' }}
        run: echo "$GCP_SA_KEY" > "${{ runner.temp }}/gcp-key.json"

      - name: "Run discovery (source: ${{ matrix.source }})"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
          # 2026-09 FIX (real production evidence): discovery.py's
          # verification.py bridge (_get_verification_module, see
          # discovery.py's own module comment on that function) does
          # `import ats_scrapers` transitively (verification.py itself
          # does `from ats_scrapers import scrape_board`), which pulls in
          # config.py -- and config.py's legacy single-provider fallback
          # does a BARE `os.environ["CEREBRAS_API_KEY"]` lookup (raises
          # KeyError, not a graceful default) whenever LLM_PROVIDER
          # resolves to "cerebras" (its own default when unset) and no
          # multi-provider role/location keys are configured -- see
          # verification.py's own top-of-file "NOTE ON CEREBRAS_API_KEY"
          # comment, which already documented this exact gotcha for
          # anything that imports ats_scrapers.scrape_board(), including
          # verification.py's own direct runs (verification.yml already
          # passes this same secret on every one of its steps for exactly
          # this reason). Discovery.yml never needed it before because
          # the bridge always failed earlier (first a directory-
          # resolution bug, then a missing aiohttp/selectolax/
          # beautifulsoup4 dependency) -- confirmed live: fixing BOTH of
          # those immediately surfaced this exact KeyError next, on this
          # exact step, nothing here actually calls an LLM. Cerebras
          # never fires a real request as a result of this -- it exists
          # solely to satisfy config.py's own import-time key check.
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      # 2026-09: `exec` (see people_data_labs.yml for the full explanation) makes GitHub's Cancel-workflow signal reach python directly instead of stopping at bash.
        run: exec python discovery.py --source ${{ matrix.source }} ${{ matrix.extra_args }}
        # GCP_PROJECT_ID/GCP_SA_KEY are optional — discovery.py logs a
        # one-line notice and skips the httparchive source cleanly if
        # they aren't set, rather than failing the run. See discovery.py's
        # module docstring (source 7) for what's needed and how to set it
        # up. THEIRSTACK_API_KEY was removed 2026-09 along with the
        # TheirStack source itself.
