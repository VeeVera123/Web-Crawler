name: Discovery

on:
  schedule:
    - cron: "0 3 * * 0"   # Every Sunday at 3:00 UTC
  workflow_dispatch:       # manual trigger

# Belt-and-suspenders, same reasoning as daily_scan.yml's concurrency block —
# GitHub already serializes same-workflow schedule/workflow_dispatch runs by
# default, but we don't rely on that.
concurrency:
  group: discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 9-job matrix over 8 sources, all running in parallel — instead of one
  # job running everything back-to-back. Each source is already an
  # independent fetch-and-resolve pass (bulk single download for most,
  # thousands of live per-company fetches for sources 6-8), so sharding
  # BY SOURCE is the natural split here — unlike daily_scan.yml's ATS-board
  # matrix, there's no single flat pool of "work items" to hash-shard
  # across a fixed number of workers. Concurrent writes across different
  # sources/shards are safe: every upsert already goes through
  # `on_conflict=ats,slug` per-row, so there's no shared mutable state to
  # race on.
  #
  # commoncrawl runs as 2 separate jobs (platform-sharded, not source-
  # sharded) rather than 1 — added 2026-08 when a 9th source, Web Data
  # Commons, was retired for a bad cost/payoff ratio (37 net-new slugs for
  # ~4 minutes of live fetching against a 3000-page sample) and its matrix
  # slot was handed to Common Crawl instead, since Common Crawl was
  # already the slowest single job in this matrix (27 platforms x up to 6
  # crawls x however many patterns each, all sequential in one job) and
  # actually benefits from being split, unlike WDC which was just
  # spending runtime for near-nothing. See discovery.py's
  # fetch_commoncrawl_slugs docstring for how the platform-sharding works.
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false   # one bad source/shard shouldn't cancel the rest
      matrix:
        include:
          - source: feashliaa
          - source: kalil
          - source: openpostings
          - source: commoncrawl
            extra_args: "--cc-shard 0 --cc-total-shards 2"
          - source: commoncrawl
            extra_args: "--cc-shard 1 --cc-total-shards 2"
          - source: wayback_adp
          - source: yc
          - source: theirstack
          - source: httparchive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests python-dotenv google-cloud-bigquery

      - name: Write GCP service account key (for HTTP Archive/BigQuery source)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        if: ${{ env.GCP_SA_KEY != '' && matrix.source == 'httparchive' }}
        run: echo "$GCP_SA_KEY" > "${{ runner.temp }}/gcp-key.json"

      - name: "Run discovery (source: ${{ matrix.source }})"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          THEIRSTACK_API_KEY: ${{ secrets.THEIRSTACK_API_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
      # 2026-09: `exec` (see people_data_labs.yml for the full explanation) makes GitHub's Cancel-workflow signal reach python directly instead of stopping at bash.
        run: exec python discovery.py --source ${{ matrix.source }} ${{ matrix.extra_args }}
        # THEIRSTACK_API_KEY and GCP_PROJECT_ID/GCP_SA_KEY are optional —
        # discovery.py logs a one-line notice and skips that source cleanly
        # if either isn't set, rather than failing the run. See
        # discovery.py's module docstring (sources 7 and 8) for what each
        # needs and how to set it up.
