name: Discovery

on:
  schedule:
    - cron: "0 3 * * 0"   # Every Sunday at 3:00 UTC
  workflow_dispatch:       # manual trigger
    inputs:
      timeout_minutes:
        description: "Per-job timeout, in minutes"
        required: false
        default: "300"

# Belt-and-suspenders, same reasoning as daily_scan.yml's concurrency block —
# GitHub already serializes same-workflow schedule/workflow_dispatch runs by
# default, but we don't rely on that.
concurrency:
  group: discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 2026-09: matrix rebalanced twice this week. First pass cut httparchive
  # from 3 shards to 1 to free budget for three new Hugging Face bulk
  # sources (Aramente H.F, Open Jobs Daily H.F, Zalize H.F). Second pass,
  # immediately after — Aramente H.F and Zalize H.F were REMOVED entirely
  # at the user's request (their discovery.py functions are left defined/
  # unused; see discovery.py's module docstring, Source 13/14 comments).
  # Open Jobs Daily H.F stays, newly wired in here (existed in discovery.py
  # already but had no matrix job until this week) with its own 3-way
  # file-sharding. With those two sources' 4 job slots freed again,
  # httparchive is restored to its original 3 date-sharded jobs — that
  # reduction was purely a matrix-budget trade with no cost difference
  # either way (see its own comment below), so reverting it is free now
  # that the budget it was freed for no longer exists. Latmay stays a
  # single unsharded job, same single-Parquet-file reasoning as always.
  #
  # 24-job matrix over 12 sources, all running in parallel — instead of one
  # job running everything back-to-back. Each source is already an
  # independent fetch-and-resolve pass (bulk single download for most,
  # thousands of live per-company fetches for sources 6-7), so sharding
  # BY SOURCE is the natural split here — unlike daily_scan.yml's ATS-board
  # matrix, there's no single flat pool of "work items" to hash-shard
  # across a fixed number of workers. Concurrent writes across different
  # sources/shards are safe: every upsert already goes through
  # `on_conflict=ats,slug` per-row, so there's no shared mutable state to
  # race on.
  #
  # 2026-09: Y Combinator removed (companies surface via Common Crawl/
  # OpenPostings/the HF sources just as well — see discovery.py's module
  # docstring), replaced with two Hugging Face sources: Latmay H.F
  # (huggingface.co/datasets/latmay/ats-career-page-urls, already-resolved
  # ATS URLs, no live crawl needed) and Edward H.F
  # (huggingface.co/datasets/edwarddgao/open-apply-jobs, 31M+ job postings
  # across 375 Parquet shards — see fetch_edwarddgao_slugs' own time
  # budget for why it self-stops gracefully rather than needing sharding
  # here). Both write to Supabase under their own literal `source` values
  # ("Latmay H.F" / "Edward H.F") — see the 2026-09 archive_i.source CHECK
  # constraint migration.
  #
  # commoncrawl runs as 3 separate jobs (platform-sharded, not source-
  # sharded) rather than 1 — originally split into 2 in 2026-08 when a 9th
  # source, Web Data Commons, was retired for a bad cost/payoff ratio (37
  # net-new slugs for ~4 minutes of live fetching against a 3000-page
  # sample) and its matrix slot was handed to Common Crawl instead, since
  # Common Crawl was already the slowest single job in this matrix
  # (platforms x up to 6 crawls x however many patterns each, all
  # sequential in one job) and actually benefits from being split, unlike
  # WDC which was just spending runtime for near-nothing. Went 2 -> 4 -> 3
  # as the matrix's other slots shifted around (TheirStack removed, then
  # httparchive gained its own shards below) — 3 keeps it split without
  # over-provisioning past what this account's concurrent-job cap can
  # actually run at once (queued-but-not-running shards buy nothing, see
  # this conversation's own shard-count discussion). See discovery.py's
  # fetch_commoncrawl_slugs docstring for how the platform-sharding works.
  #
  # wayback runs as 5 separate jobs (platform-sharded, via --wayback-shard/
  # --wayback-total-shards, same scheme as commoncrawl above) — added
  # 2026-09 alongside raising discovery.py's _WAYBACK_MAX_PAGES from 25 to
  # 500. That cap was getting hit on every Greenhouse pattern in the same
  # unsharded run at exactly 125,000 snapshots (25 pages x 5000/page);
  # raising it lets a heavily-archived platform actually finish fetching,
  # but only makes sense paired with sharding — otherwise all that extra
  # allowed pagination would just stack onto one job's wall-clock instead
  # of running across 5 in parallel. See fetch_wayback_slugs' docstring.
  #
  # httparchive runs as 3 separate jobs (date-sharded, via --ha-shard/
  # --ha-total-shards) — this source's single ~90min job was the slowest
  # thing left in the matrix. Briefly cut to 1 unsharded job 2026-09 to
  # free matrix slots for a batch of new HF sources, then restored back
  # to 3 immediately after two of those sources (Aramente H.F, Zalize
  # H.F) were removed again — the cut was a zero-cost matrix-budget trade
  # either way, since `httparchive.crawl.pages` is partitioned by `date`,
  # not by `technology`: splitting the resolved crawl-date list means each
  # shard scans roughly its own fraction of the same partition bytes,
  # summed across shards identical to one job scanning the whole range.
  # Deliberately NOT sharded by ATS tech instead — that WOULD multiply
  # BigQuery cost by the shard count, since technology isn't a partition/
  # clustering key. See fetch_httparchive_candidate_urls' docstring for
  # the full reasoning.
  #
  # 2026-09: added ct_logs (single job, unsharded — crt.sh's Certificate
  # Transparency index, queried directly, no seed file/dataset. Covers 18
  # subdomain-per-tenant platforms in one pass; each of the 18 is a single,
  # fast, non-paginated crt.sh lookup (unlike wayback/commoncrawl's CDX
  # pagination), so this doesn't need its own platform-sharding the way
  # those two do. See discovery.py's CT_LOG_SUFFIXES comment for exactly
  # which platforms this can/can't help and why. NOTE: archive_i.source's
  # CHECK constraint must include 'ct_logs' before this job's Supabase
  # upsert will succeed — see this repo's own migration history/chat log
  # for the exact ALTER TABLE statement; it has to be run manually in the
  # Supabase SQL editor.
  #
  # 2026-09: added github (single job, unsharded — a short,
  # manually-curated list of known public GitHub repos, currently just
  # datascry/openroles, that publish pre-built ATS tenant/slug JSON files;
  # fetched via jsDelivr's CDN mirror, no GitHub API/auth involved, so no
  # extra secret or rate-limit concern here). Most mapped platforms are a
  # free local reassembly from that repo's own metadata (workday, brassring,
  # oracle_cloud_hcm); csod needs one bounded live per-tenant HTTP resolve
  # instead (see --csod-resolve-budget-minutes, default 15min — cheap
  # enough this job doesn't need its own timeout override). See
  # discovery.py's module docstring (source 11) and
  # fetch_github_registries_slugs' own docstring for the full research
  # trail, including why successfactors and UKG/ultipro are deliberately
  # excluded rather than mapped.
  #
  # 2026-09: Open Jobs Daily H.F (huggingface.co/datasets/Yigit-Karaman/
  # open-jobs-daily, 15 Parquet files across 2 configs, CC0-1.0) added as
  # its own 3-way file-sharded matrix job — existed in discovery.py
  # already but had no matrix job until now. Two sibling HF sources added
  # alongside it the same week, Aramente H.F (eu-tech-jobs) and Zalize H.F
  # (tech-job-postings-salary-dataset), were REMOVED again immediately
  # after at the user's request — see discovery.py's module docstring
  # (Source 13/14 comments) for why; their functions are left defined/
  # unused there, and they have no matrix job here.
  #
  # Every sharded entry below also sets `name:` — without it, GitHub's
  # default matrix job display name spells out every matrix key verbatim
  # (e.g. "discover (commoncrawl, --cc-shard 0 --cc-total-shards 3)"),
  # which gets long and repetitive fast across this many shards. The job
  # itself still just uses `name:` for display; `matrix.source` (and
  # extra_args) are what actually drive the run.
  #
  # TheirStack (freemium technology-usage API) was removed 2026-09 at the
  # user's request — see discovery.py's module docstring for the full
  # list of remaining sources.
  #
  # 2026-09: timeout-minutes was hardcoded to 90, completely independent of
  # discovery.py's own --httparchive-resolve-budget-minutes (default 300)
  # — every HTTP Archive shard was getting hard-killed by GitHub's job
  # timeout at 90min with a KeyboardInterrupt, 210 minutes before its own
  # internal time budget would have stopped it gracefully and written out
  # whatever it had resolved so far. Now driven by the timeout_minutes
  # input above (default "300", matching the internal budget so the two
  # limits don't fight each other) so it can also be raised for one-off
  # manual runs without editing this file. The other 8 (non-httparchive)
  # shards finish in a few minutes each regardless — a generous shared job
  # timeout costs them nothing, it just means a genuinely wedged job doesn't
  # sit queued/running for hours before GitHub notices.
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.timeout_minutes || '300') }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false   # one bad source/shard shouldn't cancel the rest
      matrix:
        include:
          - source: feashliaa
            name: feashliaa
          - source: kalil
            name: kalil
          - source: openpostings
            name: openpostings
          - source: commoncrawl
            name: common crawl 1
            extra_args: "--cc-shard 0 --cc-total-shards 3"
          - source: commoncrawl
            name: common crawl 2
            extra_args: "--cc-shard 1 --cc-total-shards 3"
          - source: commoncrawl
            name: common crawl 3
            extra_args: "--cc-shard 2 --cc-total-shards 3"
          - source: wayback
            name: wayback 1
            extra_args: "--wayback-shard 0 --wayback-total-shards 5"
          - source: wayback
            name: wayback 2
            extra_args: "--wayback-shard 1 --wayback-total-shards 5"
          - source: wayback
            name: wayback 3
            extra_args: "--wayback-shard 2 --wayback-total-shards 5"
          - source: wayback
            name: wayback 4
            extra_args: "--wayback-shard 3 --wayback-total-shards 5"
          - source: wayback
            name: wayback 5
            extra_args: "--wayback-shard 4 --wayback-total-shards 5"
          - source: ct_logs
            name: CT logs (crt.sh)
          - source: latmay
            name: Latmay H.F
          - source: icims_hrjobs
            name: iCIMS HR Jobs
          - source: github
            name: GitHub registries
          - source: edwarddgao
            name: Edward H.F 1
            extra_args: "--hf-shard 0 --hf-total-shards 3"
          - source: edwarddgao
            name: Edward H.F 2
            extra_args: "--hf-shard 1 --hf-total-shards 3"
          - source: edwarddgao
            name: Edward H.F 3
            extra_args: "--hf-shard 2 --hf-total-shards 3"
          - source: httparchive
            name: http archive 1
            extra_args: "--ha-shard 0 --ha-total-shards 3"
          - source: httparchive
            name: http archive 2
            extra_args: "--ha-shard 1 --ha-total-shards 3"
          - source: httparchive
            name: http archive 3
            extra_args: "--ha-shard 2 --ha-total-shards 3"
          - source: openjobsdaily
            name: Open Jobs Daily H.F 1
            extra_args: "--hf-shard 0 --hf-total-shards 3"
          - source: openjobsdaily
            name: Open Jobs Daily H.F 2
            extra_args: "--hf-shard 1 --hf-total-shards 3"
          - source: openjobsdaily
            name: Open Jobs Daily H.F 3
            extra_args: "--hf-shard 2 --hf-total-shards 3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # pyarrow: needed by the Latmay/Edward/Open Jobs Daily H.F sources
        # to read Hugging Face's auto-converted Parquet dataset exports.
        # psycopg2-binary: needed by the ct_logs source, which queries
        # crt.sh's public Postgres database directly (its HTTP endpoint's
        # own robots.txt disallows automated access — see discovery.py's
        # module comment above CRTSH_PG_HOST for the full explanation).
        run: pip install requests python-dotenv google-cloud-bigquery pyarrow psycopg2-binary

      - name: Write GCP service account key (for HTTP Archive/BigQuery source)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        if: ${{ env.GCP_SA_KEY != '' && matrix.source == 'httparchive' }}
        run: echo "$GCP_SA_KEY" > "${{ runner.temp }}/gcp-key.json"

      - name: "Run discovery (source: ${{ matrix.source }})"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
      # 2026-09: `exec` (see people_data_labs.yml for the full explanation) makes GitHub's Cancel-workflow signal reach python directly instead of stopping at bash.
        run: exec python discovery.py --source ${{ matrix.source }} ${{ matrix.extra_args }}
        # GCP_PROJECT_ID/GCP_SA_KEY are optional — discovery.py logs a
        # one-line notice and skips the httparchive source cleanly if
        # they aren't set, rather than failing the run. See discovery.py's
        # module docstring (source 7) for what's needed and how to set it
        # up. THEIRSTACK_API_KEY was removed 2026-09 along with the
        # TheirStack source itself.
