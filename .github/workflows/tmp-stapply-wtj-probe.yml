name: TEMP - stapply.ai welcometothejungle probe

# Temporary, throwaway diagnostic workflow — answers one question: does
# stapply.ai carry a welcometothejungle source, and if so, do its rows
# link directly to the underlying ATS (extractable slug) or only to the
# welcometothejungle.com application page? Delete this file once that's
# answered (see chat/commit history for the decision this fed).
#
# Triggered via `push` (not `workflow_dispatch`) because the token running
# this session doesn't have Actions:write to dispatch a workflow_dispatch
# run directly — pushing a change to this exact path is what fires it.
#
# v2: manifest.json 403'd urllib's default User-Agent (Python-urllib/3.x)
# — likely a bot-WAF, since crawl_iii.py's aiohttp client already fetches
# these same-family CSV URLs fine in production. Added a browser UA and
# skip straight to guessing the per-source CSV path instead of relying on
# manifest.json.
on:
  push:
    paths:
      - ".github/workflows/tmp-stapply-wtj-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe stapply.ai for a welcometothejungle source
        run: |
          cat > /tmp/probe.py <<'PYEOF'
          import json
          import urllib.request
          import csv
          import io

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36")

          def fetch(url, timeout=60, byte_limit=None):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  data = r.read(byte_limit) if byte_limit else r.read()
                  return r.status, data.decode(errors="replace")

          print("=== manifest.json ===")
          try:
              status, text = fetch("https://storage.stapply.ai/jobhive/v1/manifest.json")
              print(f"status={status}")
              manifest = json.loads(text)
              print(json.dumps(manifest, indent=2)[:8000])
          except Exception as e:
              print(f"manifest fetch FAILED: {e}")

          guesses = ["welcometothejungle", "welcome_to_the_jungle", "wtj",
                     "welcome-to-the-jungle", "weltothejungle", "jungle"]
          for g in guesses:
              url = f"https://storage.stapply.ai/jobhive/v1/{g}/jobs.csv"
              print(f"\n=== {g} ===")
              try:
                  status, text = fetch(url, byte_limit=500_000)
                  print(f"[{g}] status={status}  bytes={len(text)}")
                  reader = csv.DictReader(io.StringIO(text))
                  print(f"[{g}] columns: {reader.fieldnames}")
                  for i, row in enumerate(reader):
                      if i >= 10:
                          break
                      print(f"[{g}] row {i}: url={row.get('url')!r} "
                            f"apply_url={row.get('apply_url')!r} "
                            f"ats_type={row.get('ats_type')!r} "
                            f"ats_id={row.get('ats_id')!r} "
                            f"company={row.get('company')!r} "
                            f"location={row.get('location')!r}")
              except Exception as e:
                  print(f"[{g}] FAILED: {e}")
          PYEOF
          python3 /tmp/probe.py
