name: Verification Engine — archive_i + archive_ii

# Scans archive_i (ats + slug boards) and archive_ii (in-house career pages) 
# and removes ONLY rows confirmed dead — the board/page genuinely doesn't exist anymore.[cite: 2]
# Supports ~6-month stale pruning on schedule[cite: 2].

on:
  schedule:
    - cron: "0 3 1 1,7 *"   # ~every 6 months: Jan 1 + Jul 1, 03:00 UTC[cite: 2]
  workflow_dispatch:
    inputs:
      table:
        description: "Archive(s) to check"
        required: false
        type: choice
        options:
          - both
          - archive_i
          - archive_ii
        default: both
      execute:
        description: "Check: deletes dead entries across chosen archive(s). Unchecked: just reports."
        required: false
        type: boolean
        default: false
      ats:
        description: "archive_i only — one ATS platform. Blank = all."
        required: false
        default: ""
      shard_count:
        description: "Parallel shards (default 20, more = faster)"
        required: false
        default: "20"
      concurrency:
        description: "Concurrent checks per shard (keep low, raise shard_count instead)"
        required: false
        default: "2"
      stale_role_cleanup:
        description: "Run the 6-month no-role-found cleanup now too"
        required: false
        type: boolean
        default: false

concurrency:
  group: verification-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build shard-index matrix from shard_count input
        id: build
        run: |
          SHARD_COUNT="${{ github.event.inputs.shard_count || '20' }}"
          MATRIX_JSON=$(python3 -c "
          import json
          shard_count = int('$SHARD_COUNT')
          print(json.dumps({'include': [{'shard': s} for s in range(shard_count)]}))
          ")
          echo "shard_count: $SHARD_COUNT"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp aiodns selectolax requests beautifulsoup4 python-dotenv

      - name: "Verify shard ${{ matrix.shard }}/${{ github.event.inputs.shard_count || '20' }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          exec python Verification/verification.py \
            --table ${{ github.event.inputs.table || 'both' }} \
            --concurrency ${{ github.event.inputs.concurrency || '30' }} \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ github.event.inputs.shard_count || '20' }} \
            --summary-out "summary-${{ matrix.shard }}.json" \
            ${{ github.event.inputs.execute == 'true' && '--execute' || '' }} \
            ${{ github.event.inputs.ats != '' && format('--ats {0}', github.event.inputs.ats) || '' }}

      - name: Upload shard summary
        uses: actions/upload-artifact@v4
        with:
          name: verification-summary-${{ matrix.shard }}
          path: summary-${{ matrix.shard }}.json
          retention-days: 14

  finalize:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp aiodns selectolax requests beautifulsoup4 python-dotenv

      - name: Download every shard's summary
        uses: actions/download-artifact@v4
        with:
          pattern: verification-summary-*
          path: summaries
          merge-multiple: true

      - name: Combined report — all shards
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: python Verification/verification.py --summarize summaries

  stale-role-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'schedule' || github.event.inputs.stale_role_cleanup == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp aiodns selectolax requests beautifulsoup4 python-dotenv

      - name: "Stale-role cleanup (~183 days, no role found)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          exec python Verification/verification.py \
            --stale-role-cleanup \
            --table ${{ github.event.inputs.table || 'both' }} \
            ${{ (github.event_name == 'schedule' || github.event.inputs.execute == 'true') && '--execute' || '' }}
