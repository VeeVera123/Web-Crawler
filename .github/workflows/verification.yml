name: Verification Engine — archive_i + archive_ii

# Scans archive_i (ats + slug boards) and archive_ii (in-house career
# pages) and removes ONLY rows confirmed dead — the board/page genuinely
# doesn't exist anymore, never just "zero jobs right now" (see
# verification.py's own module docstring for the full rule and the
# 2026-08 research behind which of the 29 ATS platforms have a safe
# not-found signal — 18 do, 11 explicitly don't and are skipped/left
# untouched).
#
# 2026-09: table names here were archive_ii/archive_iii until this
# update — stale from an EARLIER rename (slug_registry/quarantine ->
# archive_ii, scrape_test -> archive_iii) that itself got superseded by a
# LATER 2026-08 restructure (archive_ii -> archive_i, archive_iii ->
# archive_ii) that this workflow (and verification.py) never picked up.
# That left verification.py's Supabase calls pointing at node.py
# constants (STAGING_TABLE/ARCHIVE_III_TABLE) that no longer exist —
# a real, live AttributeError bug, same class as the slug_registry 404
# already fixed elsewhere this session. Both files are now caught up to
# archive_i/archive_ii.
#
# Same shard + finalize shape as Main/main.py's ATS scanner: N parallel
# shards each check their own slice and upload a small JSON summary as a
# build artifact, then a `finalize` job (needs: verify) downloads every
# shard's summary and prints ONE combined report — active/empty/dead/
# unverified totals across the whole run.
#
# 2026-09: default shards bumped 10 -> 20 (editable via shard_count).
# Checking `execute` (table left on "both") deletes every confirmed-dead
# row right now — this is the live dead-board/page check, NOT last_seen-
# based (see the separate stale-role-cleanup job below for that one).
#
# Also added a SEPARATE stale-role-cleanup job — every ~183
# days (~6 months), delete archive_i/archive_ii rows whose last_seen
# (repurposed by Crawl I/II to mean "last time a role was actually
# found," see crawl_i.py/crawl_ii.py and supabase_handler.py's
# touch_archive_i_last_seen/touch_archive_ii_last_seen) is older than
# that cutoff. This is DIFFERENT from, and additional to, the live
# dead-board/page HTTP check above: it doesn't care whether the board is
# still technically reachable, only whether it has produced a single
# role (any role — not scoped to CSM/AM) in the last ~6 months. See
# verification.py's run_stale_role_cleanup.
on:
  schedule:
    # GitHub Actions cron has no native "every N days" — a day-of-month
    # step value only repeats within a month and resets at month
    # boundaries, so it can't express a clean 183-day cadence. Jan 1 and
    # Jul 1 UTC are ~181/~184 days apart (close enough to "every 183
    # days" for a 6-month prune) and are easy to reason about/audit,
    # unlike a drifting step value.
    - cron: "0 3 1 1,7 *"   # ~every 6 months: Jan 1 + Jul 1, 03:00 UTC
  workflow_dispatch:
    inputs:
      table:
        description: "Archive(s) to check"
        required: false
        type: choice
        options:
          - both
          - archive_i
          - archive_ii
        default: both
      execute:
        description: "Check: deletes dead entries across chosen archive(s). Unchecked: just reports."
        required: false
        type: boolean
        default: false
      ats:
        description: "archive_i only — one ATS platform. Blank = all."
        required: false
        default: ""
      shard_count:
        description: "Parallel shards (default 20, more = faster)"
        required: false
        default: "20"
      concurrency:
        description: "Concurrent checks per shard (keep low, raise shard_count instead)"
        required: false
        default: "2"
      stale_role_cleanup:
        description: "Run the 6-month no-role-found cleanup now too"
        required: false
        type: boolean
        default: false

concurrency:
  group: verification-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-matrix:
    # Same reason as people_data_labs.yml's prepare-matrix job — workflow_dispatch
    # inputs can't be referenced directly inside a matrix, so shard_count ->
    # [0, 1, ..., shard_count-1] is computed here first.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build shard-index matrix from shard_count input
        id: build
        run: |
          SHARD_COUNT="${{ github.event.inputs.shard_count || '20' }}"
          MATRIX_JSON=$(python3 -c "
          import json
          shard_count = int('$SHARD_COUNT')
          print(json.dumps({'include': [{'shard': s} for s in range(shard_count)]}))
          ")
          echo "shard_count: $SHARD_COUNT"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false   # one shard's flakiness shouldn't cancel the rest
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp aiodns selectolax requests beautifulsoup4 python-dotenv

      - name: "Verify shard ${{ matrix.shard }}/${{ github.event.inputs.shard_count || '20' }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # ats_scrapers.py (imported for the active/empty job-count split)
          # pulls in Main/config.py, which requires SOME LLM key to even
          # finish importing even though nothing here calls an LLM — reusing
          # the same secret daily_scan.yml already has configured is enough
          # to satisfy that import. See verification.py's module docstring.
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          # 2026-09: `exec` (see people_data_labs.yml for the full explanation) makes GitHub's Cancel-workflow signal reach python directly instead of stopping at bash.
          exec python Verification/verification.py \
            --table ${{ github.event.inputs.table || 'both' }} \
            --concurrency ${{ github.event.inputs.concurrency || '30' }} \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ github.event.inputs.shard_count || '20' }} \
            --summary-out "summary-${{ matrix.shard }}.json" \
            ${{ github.event.inputs.execute == 'true' && '--execute' || '' }} \
            ${{ github.event.inputs.ats != '' && format('--ats {0}', github.event.inputs.ats) || '' }}

      - name: Upload shard summary
        uses: actions/upload-artifact@v4
        with:
          name: verification-summary-${{ matrix.shard }}
          path: summary-${{ matrix.shard }}.json
          retention-days: 14

  finalize:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp aiodns selectolax requests beautifulsoup4 python-dotenv

      - name: Download every shard's summary
        uses: actions/download-artifact@v4
        with:
          pattern: verification-summary-*
          path: summaries
          merge-multiple: true

      - name: Combined report — all shards
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: python Verification/verification.py --summarize summaries

  stale-role-cleanup:
    # Not sharded (unlike `verify` above) — this is a single server-side
    # PostgREST filter+DELETE per table (Postgres finds every stale row
    # itself), not a per-row live HTTP check, so one job is enough.
    # Runs automatically on the Jan 1 / Jul 1 schedule (and always
    # --execute's for real on a schedule firing — the whole point of this
    # cron is to actually prune, not just report); on workflow_dispatch,
    # only runs if the stale_role_cleanup checkbox is on, and only
    # --execute's if the execute checkbox is also on (report-only
    # otherwise), matching the safety default the `verify` job already
    # uses.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'schedule' || github.event.inputs.stale_role_cleanup == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp aiodns selectolax requests beautifulsoup4 python-dotenv

      - name: "Stale-role cleanup (~183 days, no role found)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          exec python Verification/verification.py \
            --stale-role-cleanup \
            --table ${{ github.event.inputs.table || 'both' }} \
            ${{ (github.event_name == 'schedule' || github.event.inputs.execute == 'true') && '--execute' || '' }}
