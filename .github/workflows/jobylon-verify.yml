name: Jobylon Fix Verification

# One-off, temporary workflow: runs the real (unmodified) fixed
# scrape_jobylon against real tenant slugs, end-to-end, before this
# branch's Jobylon fix is considered done. Removed again once confirmed.
#
# Push-triggered (this branch only) for the same reason
# jobylon-diag.yml was: the Claude GitHub App's token can't call the
# workflow_dispatch API (403 "Resource not accessible by integration").

on:
  workflow_dispatch: {}
  push:
    branches: [claude/cloud-lg97bh]
    paths: [jobylon_verify.py, .github/workflows/jobylon-verify.yml]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run real scrape_jobylon against real tenants
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: python jobylon_verify.py
