name: Discover New Slugs

on:
  schedule:
    - cron: "0 4 * * 0"   # Every Sunday at 4:00 UTC
  workflow_dispatch:       # manual trigger

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Discover slugs from Common Crawl
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python discover_slugs.py --crawls 3

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet slugs/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push new slugs
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add slugs/
          git commit -m "Auto-discover: update slug lists from Common Crawl"
          git push
