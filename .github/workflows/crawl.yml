name: Crawl

# Unified daily crawl workflow (formerly daily_scan.yml, ATS Global Scanner).
# 2026-08 restructure: runs Crawl I (crawl_i.py, formerly main.py — the
# known-ATS scanner reading archive_i, formerly slug_registry) and/or
# Crawl II (crawl_ii.py — the heuristic in-house/unsupported career-page
# scraper reading archive_ii, formerly archive_iii), selected via the
# `scope` dropdown (both / archive_i / archive_ii).
#
# 2026-09: replaced the old `include_archive_ii` checkbox with this
# dropdown — the checkbox could only ever ADD Crawl II on top of Crawl I
# (which always ran unconditionally), so there was no way to run Crawl II
# by itself. `scope` picks exactly which crawl(s) run: default "both"
# (matches the old default-unchecked... plus the checkbox's own default
# of Crawl-I-only was actually the OPPOSITE of "both" — see the two `if:`
# conditions below for the exact logic), or either archive alone. The
# scheduled/cron trigger never sets `scope` at all (github.event.inputs.scope
# is blank on that trigger), and both `if:` conditions treat a blank scope
# the same as the old cron default: Crawl I only, Crawl II always skipped
# — the daily automatic run's behavior is unchanged by this rename. Crawl I
# and Crawl II write to the SAME `jobs` table but
# every row is tagged jobs.source_pipeline ('crawl_i' / 'crawl_ii'), and
# each pipeline's finalize job only cleans up its own tagged rows — see
# crawl_i.py's and crawl_ii.py's run_finalize() docstrings.
#
# 2026-09: removed the crawl-i-job-boards job (ran `crawl_i.py
# --job-boards-only`) — that flag doesn't exist in crawl_i.py anymore
# (job board aggregators were disabled and job_board_scrapers.py deleted
# entirely in an earlier 2026-08 restructure; see crawl_i.py's own module
# docstring: "--job-boards-only mode is gone"). This workflow never got
# updated when that happened, so the job was failing every single run
# with "unrecognized arguments: --job-boards-only" — same stale-reference
# bug class as the slug_registry/Certificate-Transparency ones already
# fixed elsewhere this session.
#
# Note: crawl-i and crawl-ii do NOT depend on each other — both just list
# `needs: prepare-matrix`, the one job they share. GitHub's dependency
# graph draws that as two arrows fanning out from prepare-matrix, which
# can look like a line connecting Crawl I and Crawl II, but there's no
# `needs: crawl-i` anywhere on crawl-ii (or vice versa) — they run fully
# in parallel, as designed.
#
# 2026-09: added NVIDIA_API_KEY (free NIM tier — see config.py's
# _LOCATION_PROVIDER_DEFS) as a third location-classification provider
# alongside Gemini/OpenAI, on the crawl-i and crawl-ii shard steps only
# (finalize steps don't classify anything, so they don't need it). Add an
# NVIDIA_API_KEY repo secret before relying on it — until then config.py
# just skips that provider and runs Gemini+OpenAI as before, same as any
# other missing provider key.

on:
  schedule:
    - cron: "0 6 * * 1-5"   # 6:00 UTC = 7:00 AM WAT, Mon-Fri only — Crawl I only, Crawl II always skipped here (blank `scope` on this trigger)
  workflow_dispatch:
    inputs:
      scope:
        description: "Which crawl(s) to run this time"
        required: false
        type: choice
        options:
          - both
          - archive_i
          - archive_ii
        default: both
      archive_i_shard_count:
        description: "Crawl I: parallel shards over archive_i (known ATS boards) — only used if scope includes archive_i"
        required: false
        default: "10"
      archive_ii_shard_count:
        description: "Crawl II: parallel shards over archive_ii (in-house career pages) — only used if scope includes archive_ii"
        required: false
        default: "10"

# Belt-and-suspenders: GitHub already serializes runs of the same workflow+ref
# by default for `schedule`/`workflow_dispatch` unless you opt into concurrent
# runs, but we don't rely on that — each finalize job's `needs:` gate is what
# actually prevents the stale-job race, not this.
concurrency:
  group: crawl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-matrix:
    # workflow_dispatch inputs can't be referenced directly inside a
    # matrix expression, so each shard_count input -> [0, 1, ..., N-1] is
    # computed here first (same pattern as verification.yml/people_data_labs.yml).
    # Runs unconditionally (cheap) even when Crawl II ends up skipped —
    # simpler than duplicating the shard-count parsing logic per pipeline.
    runs-on: ubuntu-latest
    outputs:
      archive_i_matrix: ${{ steps.build.outputs.archive_i_matrix }}
      archive_ii_matrix: ${{ steps.build.outputs.archive_ii_matrix }}
    steps:
      - name: Build shard-index matrices from shard_count inputs
        id: build
        run: |
          ARCHIVE_I_SHARDS="${{ github.event.inputs.archive_i_shard_count || '10' }}"
          ARCHIVE_II_SHARDS="${{ github.event.inputs.archive_ii_shard_count || '10' }}"
          python3 -c "
          import json
          for name, count in [('archive_i', int('$ARCHIVE_I_SHARDS')), ('archive_ii', int('$ARCHIVE_II_SHARDS'))]:
              matrix = json.dumps({'include': [{'shard': s} for s in range(count)]})
              print(f'{name}_matrix={matrix}')
          " >> "$GITHUB_OUTPUT"
          echo "archive_i shards: $ARCHIVE_I_SHARDS, archive_ii shards: $ARCHIVE_II_SHARDS"

  # ── Prefix - Supabase — Notion statuses -> Supabase ─────────────────────
  # 2026-09 (explicit user instruction): runs ONCE, before any crawl shard
  # starts, regardless of `scope` — it's read Notion, write Supabase, which
  # has nothing to do with which crawl pipeline runs this cycle. Named for
  # what it writes TO. See prefix_supabase.py / notion_sync.py.
  prefix-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "Prefix - Supabase"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: exec python prefix_supabase.py

  # ── Crawl I — known ATS boards (archive_i) ───────────────────────────────
  # Runs unless `scope` was explicitly set to archive_ii-only. Covers the
  # scheduled cron trigger (blank scope), workflow_dispatch with scope=both,
  # and workflow_dispatch with scope=archive_i. Pure Supabase writer — no
  # Notion calls happen here at all (see Prefix/Postfix above and below).

  crawl-i:
    needs: [prepare-matrix, prefix-supabase]
    if: ${{ github.event.inputs.scope != 'archive_ii' }}
    runs-on: ubuntu-latest
    # 2026-09: was 90 — not enough for a shard to get through its slice
    # in one run. Raised to 350, same headroom-under-the-hard-ceiling
    # pattern opendata.yml (345)/common_crawl.yml (350) already use —
    # GitHub hard-caps a single hosted-runner job at 360 minutes (6h),
    # so this is as high as it can go without a self-hosted runner.
    timeout-minutes: 350
    strategy:
      fail-fast: false   # one bad shard shouldn't cancel the rest
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.archive_i_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "Crawl I — shard ${{ matrix.shard }}/${{ github.event.inputs.archive_i_shard_count || '10' }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          LLM_PROVIDER: cerebras
          # Every AI-classifying job in this workflow shares Gemini/Groq's
          # free-tier per-key quota — see config.py. Sized generously (12)
          # to cover the worst case (10 crawl-i shards + up to 10 crawl-ii
          # shards all running at once); a run with fewer shards or Crawl
          # II skipped just under-uses its share, which is harmless.
          AI_RATE_SHARDS: "12"
      # 2026-09: `exec` (see people_data_labs.yml for the full explanation) makes GitHub's Cancel-workflow signal reach python directly instead of stopping at bash.
        run: exec python crawl_i.py --shard ${{ matrix.shard }} --total-shards ${{ github.event.inputs.archive_i_shard_count || '10' }}

  # ── Crawl II — in-house/unsupported career pages (archive_ii) ──────────
  # Opt-in only: skipped entirely unless `scope` is explicitly "both" or
  # "archive_ii" on a manual run. The scheduled cron trigger has no
  # `github.event.inputs` at all (blank scope), so this condition is
  # always false for the automatic daily run — Crawl II never runs
  # unattended, same as before this was a dropdown. Pure Supabase writer,
  # same as Crawl I — no Notion calls here either.

  crawl-ii:
    needs: [prepare-matrix, prefix-supabase]
    if: ${{ github.event.inputs.scope == 'both' || github.event.inputs.scope == 'archive_ii' }}
    runs-on: ubuntu-latest
    # 2026-09: same reasoning as crawl-i's timeout-minutes above — raised
    # 90 -> 350 (GitHub's 360min hard ceiling for a hosted-runner job).
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.archive_ii_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "Crawl II — shard ${{ matrix.shard }}/${{ github.event.inputs.archive_ii_shard_count || '10' }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          LLM_PROVIDER: cerebras
          AI_RATE_SHARDS: "12"
      # 2026-09: `exec` (see people_data_labs.yml for the full explanation) makes GitHub's Cancel-workflow signal reach python directly instead of stopping at bash.
        run: exec python crawl_ii.py --shard ${{ matrix.shard }} --total-shards ${{ github.event.inputs.archive_ii_shard_count || '10' }}

  # ── Postfix - Notion — new Supabase jobs -> Notion, then cleanup ────────
  # 2026-09 (explicit user instruction): merges the old crawl-i-finalize +
  # crawl-ii-finalize into ONE job that runs once both crawl-i and crawl-ii
  # are done (`needs: [crawl-i, crawl-ii]` + `if: ${{ !cancelled() }}` —
  # still runs even if a shard failed/timed out, or if crawl-ii was
  # skipped entirely by `scope`, same as the two old finalize jobs did
  # separately — but, unlike `always()`, does NOT run if the whole
  # workflow run was manually cancelled. 2026-09 fix at explicit user
  # request: `always()` was firing this job even after a manual cancel,
  # which reads as "cancelling did nothing" — `!cancelled()` keeps the
  # failure/skip-tolerant behavior but actually stops on a real cancel).
  # Named for what it writes TO: it takes whatever's new in Supabase and
  # pushes it to Notion, THEN does the regular stale-job cleanup — see
  # postfix_notion.py for the two clearly-separated steps and why Crawl
  # II's cleanup is conditional on Crawl II having actually run this cycle.
  postfix-notion:
    needs: [crawl-i, crawl-ii]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "Postfix - Notion"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: cerebras
        run: |
          if [ "${{ github.event.inputs.scope == 'both' || github.event.inputs.scope == 'archive_ii' }}" = "true" ]; then
            exec python postfix_notion.py --run-crawl-ii-cleanup
          else
            exec python postfix_notion.py
          fi
