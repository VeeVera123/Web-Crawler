name: Crawl

# Unified daily crawl workflow (formerly daily_scan.yml, ATS Global Scanner).
# Runs up to three independent pipelines against the same `jobs` table:
#   Crawl I   (crawl_i.py)   — known-ATS scanner reading archive_i
#   Crawl II  (crawl_ii.py)  — heuristic in-house/unsupported career-page scraper reading archive_ii
#   Crawl III (crawl_iii.py) — stapply.ai direct job-board CSV consumer (Phenom/UKG/SAP/Dayforce/Eightfold/Recruitee)
# Every row is tagged jobs.source_pipeline ('crawl_i'/'crawl_ii'/'crawl_iii'),
# and each pipeline's own finalize step only ever cleans up its own tagged
# rows — see each crawl_*.py's run_finalize() docstring.
#
# 2026-09 (this revision, explicit user instruction — replaces the earlier
# `scope` single-choice dropdown entirely): the dropdown had a real bug —
# picking "both" (Crawl I + Crawl II) silently left Crawl III unselectable
# in the SAME run, because "both" only ever meant "Crawl I + Crawl II",
# never "everything." There was no dropdown value that meant "all three."
# Replaced with three independent checkboxes — run_crawl_i/run_crawl_ii/
# run_crawl_iii — each `type: boolean`, each `default: true`. On a manual
# dispatch, all three run unless you UNTICK the ones you don't want (the
# opt-OUT model the user asked for, not opt-in). On the unattended cron
# trigger, ALL THREE now run every scheduled morning — previously only
# Crawl I ran on schedule (Crawl II/III were opt-in-only, dispatch-only);
# that restriction is gone. See each crawl-*/postfix-notion job's `if:`
# condition below for the exact expression
# (`github.event_name == 'schedule' || inputs.run_crawl_*`) that
# implements both halves of this at once.
#
# Historical note: `github.event.inputs.*` (all-string) was used
# throughout the old `scope`-dropdown version of this file; this revision
# uses the typed `inputs.*` context instead, since `type: boolean` inputs
# need to evaluate as real booleans in the `if:` expressions above, not as
# the literal strings "true"/"false".
#
# 2026-09: removed the crawl-i-job-boards job (ran `crawl_i.py
# --job-boards-only`) — that flag doesn't exist in crawl_i.py anymore
# (job board aggregators were disabled and job_board_scrapers.py deleted
# entirely in an earlier 2026-08 restructure; see crawl_i.py's own module
# docstring: "--job-boards-only mode is gone"). This workflow never got
# updated when that happened, so the job was failing every single run
# with "unrecognized arguments: --job-boards-only" — same stale-reference
# bug class as the slug_registry/Certificate-Transparency ones already
# fixed elsewhere this session.
#
# Note: crawl-i, crawl-ii, and crawl-iii do NOT depend on each other — all
# three just list `needs: [prepare-matrix, prefix-supabase]`, the two jobs
# they share. GitHub's dependency graph draws that as arrows fanning out
# from those two, which can look like the three crawls are chained
# together, but there's no `needs: crawl-i` anywhere on crawl-ii or
# crawl-iii (or vice versa) — all three run fully in parallel, as designed.
#
# 2026-09: added NVIDIA_API_KEY (free NIM tier — see config.py's
# _LOCATION_PROVIDER_DEFS) as a third location-classification provider
# alongside Gemini/OpenAI, on every crawl's shard steps (finalize steps
# don't classify anything, so they don't need it). Add an NVIDIA_API_KEY
# repo secret before relying on it — until then config.py just skips that
# provider and runs Gemini+OpenAI as before, same as any other missing
# provider key.
#
# 2026-09: added Crawl III (crawl_iii.py) — a third, independent pipeline
# consuming stapply.ai's bulk pre-scraped CSVs instead of live-scraping
# ATS boards. Writes to the SAME `jobs` table, tagged
# jobs.source_pipeline='crawl_iii', with its own `needs`-gated finalize
# step (archives stale Notion pages, then hard-deletes same-day-stale rows
# — see crawl_iii.py's run_finalize() docstring for why its cutoffs are
# far more aggressive than Crawl I/II's). No per-source sharding on the
# Supabase side is possible here (stapply publishes one bulk CSV per
# platform, not a queryable per-row endpoint), so crawl_iii_shard_count
# just splits the ALREADY-DOWNLOADED rows by a URL hash — see crawl_iii.py's
# module docstring's "SHARDING" section.

on:
  schedule:
    - cron: "0 6 * * 1-5"   # 6:00 UTC = 7:00 AM WAT, Mon-Fri only — runs ALL THREE crawls (see the `if:` conditions below)
  workflow_dispatch:
    inputs:
      run_crawl_i:
        description: "Run Crawl I (known ATS boards, archive_i)"
        required: false
        type: boolean
        default: true
      run_crawl_ii:
        description: "Run Crawl II (in-house/unsupported career pages, archive_ii)"
        required: false
        type: boolean
        default: true
      run_crawl_iii:
        description: "Run Crawl III (stapply.ai direct job-board CSVs — Phenom/UKG/SAP/Dayforce/Eightfold/Recruitee)"
        required: false
        type: boolean
        default: true
      archive_i_shard_count:
        description: "Crawl I: parallel shards over archive_i (known ATS boards) — only used if run_crawl_i is checked"
        required: false
        default: "10"
      archive_ii_shard_count:
        description: "Crawl II: parallel shards over archive_ii (in-house career pages) — only used if run_crawl_ii is checked"
        required: false
        default: "10"
      crawl_iii_shard_count:
        description: "Crawl III: parallel shards over stapply.ai's direct job-board CSVs — only used if run_crawl_iii is checked"
        required: false
        default: "10"

# Belt-and-suspenders: GitHub already serializes runs of the same workflow+ref
# by default for `schedule`/`workflow_dispatch` unless you opt into concurrent
# runs, but we don't rely on that — each finalize job's `needs:` gate is what
# actually prevents the stale-job race, not this.
concurrency:
  group: crawl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-matrix:
    # workflow_dispatch inputs can't be referenced directly inside a
    # matrix expression, so each shard_count input -> [0, 1, ..., N-1] is
    # computed here first (same pattern as verification.yml/people_data_labs.yml).
    # Runs unconditionally (cheap) even when a crawl ends up skipped —
    # simpler than duplicating the shard-count parsing logic per pipeline.
    runs-on: ubuntu-latest
    outputs:
      archive_i_matrix: ${{ steps.build.outputs.archive_i_matrix }}
      archive_ii_matrix: ${{ steps.build.outputs.archive_ii_matrix }}
      crawl_iii_matrix: ${{ steps.build.outputs.crawl_iii_matrix }}
    steps:
      - name: Build shard-index matrices from shard_count inputs
        id: build
        run: |
          ARCHIVE_I_SHARDS="${{ github.event.inputs.archive_i_shard_count || '10' }}"
          ARCHIVE_II_SHARDS="${{ github.event.inputs.archive_ii_shard_count || '10' }}"
          CRAWL_III_SHARDS="${{ github.event.inputs.crawl_iii_shard_count || '10' }}"
          python3 -c "
          import json
          for name, count in [('archive_i', int('$ARCHIVE_I_SHARDS')), ('archive_ii', int('$ARCHIVE_II_SHARDS')), ('crawl_iii', int('$CRAWL_III_SHARDS'))]:
              matrix = json.dumps({'include': [{'shard': s} for s in range(count)]})
              print(f'{name}_matrix={matrix}')
          " >> "$GITHUB_OUTPUT"
          echo "archive_i shards: $ARCHIVE_I_SHARDS, archive_ii shards: $ARCHIVE_II_SHARDS, crawl_iii shards: $CRAWL_III_SHARDS"

  # ── Prefix - Supabase — Notion statuses -> Supabase ─────────────────────
  # 2026-09 (explicit user instruction): runs ONCE, before any crawl shard
  # starts, regardless of which crawls are enabled — it's read Notion,
  # write Supabase, which has nothing to do with which crawl pipeline runs
  # this cycle. Named for what it writes TO. See prefix_supabase.py /
  # notion_sync.py.
  prefix-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "Prefix - Supabase"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: exec python prefix_supabase.py

  # ── Crawl I — known ATS boards (archive_i) ───────────────────────────────
  # Runs on the scheduled cron trigger (all three run there — see the
  # top-of-file 2026-09 note) OR on a manual dispatch with run_crawl_i
  # checked (the default). Pure Supabase writer — no Notion calls happen
  # here at all (see Prefix/Postfix above and below).

  crawl-i:
    needs: [prepare-matrix, prefix-supabase]
    if: ${{ github.event_name == 'schedule' || inputs.run_crawl_i }}
    runs-on: ubuntu-latest
    # 2026-09: was 90 — not enough for a shard to get through its slice
    # in one run. Raised to 350, same headroom-under-the-hard-ceiling
    # pattern opendata.yml (345)/common_crawl.yml (350) already use —
    # GitHub hard-caps a single hosted-runner job at 360 minutes (6h),
    # so this is as high as it can go without a self-hosted runner.
    timeout-minutes: 350
    strategy:
      fail-fast: false   # one bad shard shouldn't cancel the rest
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.archive_i_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "Crawl I — shard ${{ matrix.shard }}/${{ github.event.inputs.archive_i_shard_count || '10' }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          LLM_PROVIDER: cerebras
          # Every AI-classifying job in this workflow shares Gemini/Groq's
          # free-tier per-key quota — see config.py. Sized generously (12)
          # to cover the worst case (all three crawls' shards running at
          # once, now the default on both schedule and manual dispatch);
          # a run with fewer shards or a crawl unticked just under-uses
          # its share, which is harmless.
          AI_RATE_SHARDS: "12"
      # 2026-09: `exec` (see people_data_labs.yml for the full explanation) makes GitHub's Cancel-workflow signal reach python directly instead of stopping at bash.
        run: exec python crawl_i.py --shard ${{ matrix.shard }} --total-shards ${{ github.event.inputs.archive_i_shard_count || '10' }}

  # ── Crawl II — in-house/unsupported career pages (archive_ii) ──────────
  # Runs on the scheduled cron trigger OR on a manual dispatch with
  # run_crawl_ii checked (the default — see the top-of-file 2026-09 note:
  # this used to be opt-in/dispatch-only, no longer). Pure Supabase
  # writer, same as Crawl I — no Notion calls here either.

  crawl-ii:
    needs: [prepare-matrix, prefix-supabase]
    if: ${{ github.event_name == 'schedule' || inputs.run_crawl_ii }}
    runs-on: ubuntu-latest
    # 2026-09: same reasoning as crawl-i's timeout-minutes above — raised
    # 90 -> 350 (GitHub's 360min hard ceiling for a hosted-runner job).
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.archive_ii_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "Crawl II — shard ${{ matrix.shard }}/${{ github.event.inputs.archive_ii_shard_count || '10' }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          LLM_PROVIDER: cerebras
          AI_RATE_SHARDS: "12"
      # 2026-09: `exec` (see people_data_labs.yml for the full explanation) makes GitHub's Cancel-workflow signal reach python directly instead of stopping at bash.
        run: exec python crawl_ii.py --shard ${{ matrix.shard }} --total-shards ${{ github.event.inputs.archive_ii_shard_count || '10' }}

  # ── Crawl III — stapply.ai direct job-board CSVs ────────────────────────
  # Runs on the scheduled cron trigger OR on a manual dispatch with
  # run_crawl_iii checked (the default). Same-table writer as Crawl I/II
  # (tagged source_pipeline='crawl_iii'), no Notion calls here either — see
  # postfix-notion below for its finalize step.

  crawl-iii:
    needs: [prepare-matrix, prefix-supabase]
    if: ${{ github.event_name == 'schedule' || inputs.run_crawl_iii }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.crawl_iii_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "Crawl III — shard ${{ matrix.shard }}/${{ github.event.inputs.crawl_iii_shard_count || '10' }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          LLM_PROVIDER: cerebras
          AI_RATE_SHARDS: "12"
      # 2026-09: `exec` (see people_data_labs.yml for the full explanation) makes GitHub's Cancel-workflow signal reach python directly instead of stopping at bash.
        run: exec python crawl_iii.py --shard ${{ matrix.shard }} --total-shards ${{ github.event.inputs.crawl_iii_shard_count || '10' }}

  # ── Postfix - Notion — new Supabase jobs -> Notion, then cleanup ────────
  # 2026-09 (explicit user instruction): one job that runs once crawl-i,
  # crawl-ii, and crawl-iii are all done (`needs: [crawl-i, crawl-ii,
  # crawl-iii]` + `if: ${{ !cancelled() }}` — still runs even if a shard
  # failed/timed out, or if a crawl was skipped entirely by its checkbox
  # (GitHub treats a skipped `needs` dependency as satisfied) — but, unlike
  # `always()`, does NOT run if the whole workflow run was manually
  # cancelled). Named for what it writes TO: it takes whatever's new in
  # Supabase and pushes it to Notion, THEN does the regular stale-job
  # cleanup — see postfix_notion.py for the clearly-separated steps and
  # why Crawl II's/Crawl III's cleanup are each conditional on that
  # pipeline having actually run this cycle (Crawl I's cleanup always
  # runs unconditionally inside postfix_notion.py — see that file).
  postfix-notion:
    needs: [crawl-i, crawl-ii, crawl-iii]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "Postfix - Notion"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: cerebras
        run: |
          ARGS=""
          if [ "${{ github.event_name == 'schedule' || inputs.run_crawl_ii }}" = "true" ]; then
            ARGS="$ARGS --run-crawl-ii-cleanup"
          fi
          if [ "${{ github.event_name == 'schedule' || inputs.run_crawl_iii }}" = "true" ]; then
            ARGS="$ARGS --run-crawl-iii-cleanup"
          fi
          exec python postfix_notion.py $ARGS
