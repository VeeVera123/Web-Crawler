name: Crawl

# Unified daily crawl workflow (formerly daily_scan.yml, ATS Global Scanner).
# 2026-08 restructure: runs Crawl I (crawl_i.py, formerly main.py — the
# known-ATS scanner reading archive_i, formerly slug_registry) and
# optionally Crawl II (crawl_ii.py — the heuristic in-house/unsupported
# career-page scraper reading archive_ii, formerly archive_iii), gated by
# the archives_to_run dropdown below. The scheduled/cron trigger NEVER sets
# that input, so the daily automatic run always does Crawl I only — same as
# picking "Archive I only" on a manual run. Crawl I and Crawl II write to
# the SAME `jobs` table but every row is tagged jobs.source_pipeline
# ('crawl_i' / 'crawl_ii'), and each pipeline's finalize job only cleans up
# its own tagged rows — see crawl_i.py's and crawl_ii.py's run_finalize()
# docstrings.

on:
  schedule:
    - cron: "0 6 * * *"   # 6:00 UTC = 7:00 AM WAT — Crawl I only, Crawl II always skipped here
  workflow_dispatch:
    inputs:
      archives_to_run:
        description: "Which archive(s) to crawl"
        required: false
        type: choice
        options:
          - "Both archives"
          - "Archive I only"
          - "Archive II only"
        default: "Both archives"
      archive_i_shard_count:
        description: "Crawl I parallel shards"
        required: false
        default: "10"
      archive_ii_shard_count:
        description: "Crawl II parallel shards"
        required: false
        default: "10"
      crawl_ii_timeout_minutes:
        description: "Crawl II per-shard timeout (minutes)"
        required: false
        default: "300"

# Belt-and-suspenders: GitHub already serializes runs of the same workflow+ref
# by default for `schedule`/`workflow_dispatch` unless you opt into concurrent
# runs, but we don't rely on that — each finalize job's `needs:` gate is what
# actually prevents the stale-job race, not this.
concurrency:
  group: crawl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-matrix:
    # workflow_dispatch inputs can't be referenced directly inside a
    # matrix expression, so each shard_count input -> [0, 1, ..., N-1] is
    # computed here first (same pattern as verification.yml/people_data_labs.yml).
    # Runs unconditionally (cheap) even when Crawl II ends up skipped —
    # simpler than duplicating the shard-count parsing logic per pipeline.
    runs-on: ubuntu-latest
    outputs:
      archive_i_matrix: ${{ steps.build.outputs.archive_i_matrix }}
      archive_ii_matrix: ${{ steps.build.outputs.archive_ii_matrix }}
    steps:
      - name: Build shard-index matrices from shard_count inputs
        id: build
        run: |
          ARCHIVE_I_SHARDS="${{ github.event.inputs.archive_i_shard_count || '10' }}"
          ARCHIVE_II_SHARDS="${{ github.event.inputs.archive_ii_shard_count || '10' }}"
          python3 -c "
          import json
          for name, count in [('archive_i', int('$ARCHIVE_I_SHARDS')), ('archive_ii', int('$ARCHIVE_II_SHARDS'))]:
              matrix = json.dumps({'include': [{'shard': s} for s in range(count)]})
              print(f'{name}_matrix={matrix}')
          " >> "$GITHUB_OUTPUT"
          echo "archive_i shards: $ARCHIVE_I_SHARDS, archive_ii shards: $ARCHIVE_II_SHARDS"

  # ── Crawl I — known ATS boards (archive_i) — always runs ────────────────

  crawl-i:
    needs: prepare-matrix
    # Runs unless "Archive II only" was explicitly picked. On the cron
    # trigger there's no archives_to_run input at all, so this is always
    # true there — matches the old "always runs" behavior for the daily
    # automatic run.
    if: ${{ github.event.inputs.archives_to_run != 'Archive II only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false   # one bad shard shouldn't cancel the rest
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.archive_i_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "Crawl I — shard ${{ matrix.shard }}/${{ github.event.inputs.archive_i_shard_count || '10' }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          LLM_PROVIDER: cerebras
          # Every AI-classifying job in this workflow shares each
          # free-tier provider's per-key quota — see config.py. Sized
          # generously (12) to cover the worst case (10 crawl-i shards +
          # up to 10 crawl-ii shards all running at once); a run with
          # fewer shards or Crawl II skipped just under-uses its share,
          # which is harmless.
          AI_RATE_SHARDS: "12"
        run: python crawl_i.py --shard ${{ matrix.shard }} --total-shards ${{ github.event.inputs.archive_i_shard_count || '10' }}

  # REMOVED 2026-09: the crawl-i-job-boards job (RemoteOK/WeWorkRemotely/
  # Jobicy/etc. via `python crawl_i.py --job-boards-only`). crawl_i.py's own
  # module docstring says job board aggregators and job_board_scrapers.py
  # were already disabled/removed entirely back in 2026-08, and
  # "--job-boards-only mode is gone" — but this workflow was never updated
  # to match, so that job has been failing on every run since with
  # "error: unrecognized arguments: --job-boards-only". Deleting the job
  # instead of trying to fix its command, since the feature it ran is gone,
  # not just misconfigured.

  # Cleanup only runs once ALL Crawl I shards have finished — running it
  # per-shard would race (see crawl_i.py's run_finalize() docstring).
  # `if: always()` means finalize still runs (marking jobs seen by whichever
  # shards DID succeed) even if one shard timed out or failed, instead of
  # silently skipping cleanup. Scoped to source_pipeline='crawl_i' only —
  # never touches Crawl II's rows.
  crawl-i-finalize:
    needs: [crawl-i]
    # always() so finalize still runs even if a shard failed/timed out —
    # but ALSO gated the same way as crawl-i itself, otherwise picking
    # "Archive II only" would still try to finalize a crawl-i that was
    # skipped (needs: satisfied by "skipped", not "failed").
    if: ${{ always() && github.event.inputs.archives_to_run != 'Archive II only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Crawl I — finalize (summary + 31-day stale-job cleanup)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          LLM_PROVIDER: cerebras
        run: python crawl_i.py --finalize

  # ── Crawl II — in-house/unsupported career pages (archive_ii) ──────────
  # Gated by the archives_to_run dropdown: runs for "Both archives" or
  # "Archive II only", skipped entirely (both jobs below) for "Archive I
  # only". The scheduled cron trigger has no `github.event.inputs` at all,
  # so this condition is always false for the automatic daily run — Crawl
  # II never runs unattended.

  # 2026-09: timeout-minutes used to be hardcoded to 90, completely
  # independent of crawl_ii.py's own CRAWL_II_TIME_BUDGET_MINUTES
  # (default 300) — real shards were getting hard-killed by GitHub's job
  # timeout at 90min with "The operation was canceled", 3.5 hours before
  # their own internal time budget would have stopped them gracefully
  # and written out whatever they had crawled so far (same mismatch
  # bug already fixed once for Discovery.yml's HTTP Archive shards — see
  # that workflow's own 2026-09 note). Now driven by the
  # crawl_ii_timeout_minutes input above (default "300", matching the
  # internal budget so the two limits don't fight each other), so it can
  # also be raised for one-off manual runs without editing this file.
  crawl-ii:
    needs: prepare-matrix
    if: ${{ github.event.inputs.archives_to_run == 'Both archives' || github.event.inputs.archives_to_run == 'Archive II only' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(github.event.inputs.crawl_ii_timeout_minutes || '300') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.archive_ii_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "Crawl II — shard ${{ matrix.shard }}/${{ github.event.inputs.archive_ii_shard_count || '10' }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          LLM_PROVIDER: cerebras
          AI_RATE_SHARDS: "12"
        run: python crawl_ii.py --shard ${{ matrix.shard }} --total-shards ${{ github.event.inputs.archive_ii_shard_count || '10' }}

  # Same reasoning as crawl-i-finalize, scoped to source_pipeline='crawl_ii'
  # only. `if: always()` on TOP of the archives_to_run check — otherwise a
  # skipped crawl-ii (needs: satisfied by "skipped", not "failed") would
  # still let this job through under an unconditional always().
  crawl-ii-finalize:
    needs: crawl-ii
    if: ${{ always() && (github.event.inputs.archives_to_run == 'Both archives' || github.event.inputs.archives_to_run == 'Archive II only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Crawl II — finalize (summary + stale-job cleanup)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          LLM_PROVIDER: cerebras
        run: python crawl_ii.py --finalize
