name: GitHub Org Seed — enumerate orgs, pull website field

# ONE JOB, NOT A MATRIX — deliberate, see github_org_seed.py's module
# docstring. GitHub's API is a single shared budget per token; running
# this as parallel shards against one token would divide/collide over
# that budget, not multiply it (the opposite of every other seed/crawl
# workflow in this project, which shard against an UNMETERED resource).
#
# TOKEN: set a repo secret GH_ENUM_PAT to a plain personal access token
# with NO scopes selected (this only ever reads fully public data — orgs'
# public profile fields — so no permissions are needed). Falls back to
# the workflow's own ambient GITHUB_TOKEN if GH_ENUM_PAT isn't set, but
# that ambient token's GraphQL budget is smaller (1,000 points/hour vs a
# real PAT's 5,000) — see github_org_seed.py's module docstring for the
# throughput math this changes.
#
# OUTPUT: writes a CSV, then publishes/updates it as a GitHub Release
# asset (tag below) — the SAME pattern class_a_probe.yml's PDL dataset
# already uses, so github_org_probe.yml can download it the same way.
on:
  workflow_dispatch:
    inputs:
      id_start:
        description: "Lowest GitHub org ID to start from"
        required: false
        default: "1"
      id_ceiling:
        description: "Highest org ID to walk up to (deliberately generous — see github_org_seed.py)"
        required: false
        default: "300000000"
      time_budget_minutes:
        description: "Graceful stop after this many minutes — logs the exact --id-start to resume from"
        required: false
        default: "330"
      release_tag:
        description: "Tag of the GitHub Release to publish the seed CSV under"
        required: false
        default: "github-org-seed-data"

concurrency:
  group: github-org-seed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp python-dotenv

      - name: Run GitHub org seed
        env:
          GITHUB_PAT: ${{ secrets.GH_ENUM_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python github_org_seed.py \
            --id-start ${{ github.event.inputs.id_start || '1' }} \
            --id-ceiling ${{ github.event.inputs.id_ceiling || '300000000' }} \
            --time-budget-minutes ${{ github.event.inputs.time_budget_minutes || '330' }} \
            --output github_org_companies.csv

      - name: Publish CSV as a GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag || 'github-org-seed-data' }}"
          zip -9 github_org_companies.zip github_org_companies.csv
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" github_org_companies.zip --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" github_org_companies.zip --repo "${{ github.repository }}" \
              --title "GitHub org seed data" \
              --notes "Auto-published by github_org_seed.yml — company name/domain pairs pulled from public GitHub org profiles."
          fi
          echo "Published github_org_companies.zip under release tag: $TAG"
