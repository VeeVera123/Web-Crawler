name: Class A — Domain-Crawl Discovery

# REWRITTEN (2026-08): this used to be a "guess a slug, ask the platform's
# API" prober (seed-and-probe). It's now a domain-crawl discovery tool
# instead — visits each company's OWN website (from PDL's domain field)
# and looks for a REAL link to any of the 25+ ATS platforms
# discovery.py's URL_TO_SLUG recognizes, using multiple independent
# detection methods per page (parsed links, raw-text regex scan for
# embedded/JS links, dedicated JSON-LD structured-data parsing) with a
# fallback chain (homepage -> common career-page paths -> sitemap.xml) if
# the homepage alone doesn't turn anything up. See class_a_probe.py's
# module docstring for the full rationale — short version: guessing
# slugs against Greenhouse's shared API is what got this project soft-
# blocked by their WAF, and separately produced a 4.5M-row false-positive
# incident against SmartRecruiters (their API 200'd identically for real
# and fake slugs, so body-shape checking could never have worked).
# Neither failure mode is possible with this technique: a match here
# means the literal URL is present on the company's OWN page, and every
# request goes to a different company's own domain instead of hammering
# one shared host, so there's no single target for a WAF to trip on.
#
# NO --platform ANYMORE: the old script probed one platform at a time.
# This one detects ALL platforms simultaneously from a single visit to
# each company's site, so there's nothing to select — sharding is purely
# over the company list now (see shard_count input).
#
# NO RATE LIMITING: deliberately removed (see class_a_probe.py's module
# docstring) — it existed specifically to survive hammering one shared
# host and would be pure overhead here, where the actual constraint is
# this runner's own network/CPU throughput, not any single target's
# tolerance for traffic.
#
# PDL SEED FILE: same as before — too large to commit into the repo
# (~1GB uncompressed), uploaded once as a GitHub Release asset (tag:
# pdl_release_tag below) and downloaded fresh each run via `gh release
# download` using the workflow's own built-in token.
#
# Writes into the SAME ctlog_probe_results staging table the CT-logs
# pipeline uses, now with root_domain finally holding the actual company
# domain that was crawled (previously a placeholder marker string, since
# the old technique had no real domain to put there) and source_hostname
# holding the exact page URL + detection tier the match was found on.
on:
  workflow_dispatch:
    inputs:
      pdl_release_tag:
        description: "Tag of the GitHub Release holding the PDL dataset zip asset"
        required: false
        default: "pdl-seed-data"
      shard_count:
        description: "Number of parallel shards to split the company list across"
        required: false
        default: "10"
      concurrency:
        description: "Companies crawled in parallel PER shard (no rate limiting — see class_a_probe.py)"
        required: false
        default: "400"
      countries:
        description: "'default' = a hand-picked 13-country set (US/UK/Canada/Australia/Ireland/New Zealand/Singapore/Malta/Bahamas/Guyana/Barbados/France/Germany — see class_a_probe.py's DEFAULT_COUNTRIES). 'all' = no filter, every country. Or a comma-separated custom list of PDL country values, e.g. 'united states,canada,japan'."
        required: false
        default: "default"

concurrency:
  group: class-a-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-matrix:
    # GitHub Actions matrices can't reference workflow_dispatch inputs
    # directly, so shard_count -> [0, 1, ..., shard_count-1] is computed
    # here first and passed to the crawl job via fromJson (same pattern
    # this workflow already used for its old platform x shard matrix).
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build shard-index matrix from shard_count input
        id: build
        run: |
          SHARD_COUNT="${{ github.event.inputs.shard_count || '20' }}"
          MATRIX_JSON=$(python3 -c "
          import json
          shard_count = int('$SHARD_COUNT')
          print(json.dumps({'include': [{'shard': s} for s in range(shard_count)]}))
          ")
          echo "shard_count: $SHARD_COUNT  |  total jobs: $SHARD_COUNT"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  crawl:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    # 350 keeps real headroom under GitHub-hosted runners' hard 360-min
    # ceiling. Unlike the old probe, there's no backoff/circuit-breaker
    # that could stall a shard indefinitely here — a slow shard is just
    # genuinely slow (network-bound crawling of however many companies
    # landed in its slice), not stuck waiting on a block.
    timeout-minutes: 350
    strategy:
      fail-fast: false   # one shard's issue shouldn't cancel the others
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp aiodns selectolax requests python-dotenv

      - name: Download PDL seed dataset from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.pdl_release_tag || 'pdl-seed-data' }}"
          if gh release download "$TAG" --repo "${{ github.repository }}" -p "*.zip" -D . ; then
            unzip -o ./*.zip
            if [ -f companies_sorted.csv ] && [ ! -f people_data_labs_companies.csv ]; then
              mv companies_sorted.csv people_data_labs_companies.csv
            fi
            echo "PDL dataset ready: $(ls -la people_data_labs_companies.csv 2>/dev/null || echo 'NOT FOUND after unzip — check the zip contents/filename')"
          else
            echo "No PDL release asset found (tag: $TAG) — nothing to crawl without it, this shard will find 0 companies."
          fi

      - name: "Crawl companies (shard ${{ matrix.shard }}/${{ github.event.inputs.shard_count || '20' }})"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # Translate the 'countries' input into the right class_a_probe.py
          # flag — 'default' needs NO flag at all (DEFAULT_COUNTRIES is
          # already what the script does with no --country/--all-countries
          # given), 'all' maps to --all-countries, and anything else is
          # treated as a comma-separated list of --country values.
          COUNTRIES="${{ github.event.inputs.countries || 'default' }}"
          COUNTRY_ARGS=()
          if [ "$COUNTRIES" = "all" ]; then
            COUNTRY_ARGS=(--all-countries)
          elif [ "$COUNTRIES" != "default" ]; then
            IFS=',' read -ra COUNTRY_LIST <<< "$COUNTRIES"
            for c in "${COUNTRY_LIST[@]}"; do
              COUNTRY_ARGS+=(--country "$c")
            done
          fi
          echo "countries input: '$COUNTRIES' -> flags: ${COUNTRY_ARGS[*]:-(none — uses DEFAULT_COUNTRIES)}"

          python class_a_probe.py \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ github.event.inputs.shard_count || '20' }} \
            --concurrency ${{ github.event.inputs.concurrency || '400' }} \
            "${COUNTRY_ARGS[@]}"
