name: Kaggle

on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: "Check to download/filter the Kaggle dataset. Uncheck to just crawl existing Release assets."
        required: false
        type: boolean
        default: false
      release_tag:
        description: "GitHub Release tag to upload to / download from"
        required: false
        default: "kaggle-companies"
      shard_count:
        description: "Crawl stage: parallel shards."
        required: false
        default: "10"

concurrency:
  group: kaggle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    if: ${{ github.event.inputs.run_seed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Download + stream-filter Kaggle Dataset
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          python Kaggle/kaggle_seed.py --output kaggle_companies_filtered.csv

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag || 'kaggle-companies' }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Kaggle Companies (filtered)" \
            --notes "Filtered Kaggle dataset. Regenerated $(date -u +%Y-%m-%d)."
          
          # Clear old assets
          gh release view "$TAG" --json assets -q '.assets[].name' | grep '^kaggle_' | \
            xargs -r -I{} gh release delete-asset "$TAG" {} -y || true
            
          # Kaggle datasets are usually small enough to not need splitting, 
          # but we rename it to match the probe's expected download pattern
          mv kaggle_companies_filtered.csv kaggle_chunk_00.csv
          gh release upload "$TAG" kaggle_chunk_*.csv --clobber

  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build shard-index matrix
        id: build
        run: |
          SHARD_COUNT="${{ github.event.inputs.shard_count || '10' }}"
          MATRIX_JSON=$(python3 -c "import json; print(json.dumps({'include': [{'shard': s} for s in range(int('$SHARD_COUNT'))]}))")
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  crawl:
    needs: [seed, prepare-matrix]
    if: ${{ always() && github.event.inputs.run_seed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp aiodns selectolax requests python-dotenv

      - name: Download Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag || 'kaggle-companies' }}"
          gh release download "$TAG" --pattern "kaggle_chunk_*.csv" --dir chunks
          cat chunks/kaggle_chunk_*.csv > kaggle_companies_filtered.csv

      - name: "Kaggle probe — shard ${{ matrix.shard }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENDATA_FILTERED_PATH: "kaggle_companies_filtered.csv"
          SEED_SOURCE_LABEL: "kaggle_probe"
        run: |
          python Kaggle/kaggle_probe.py \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ github.event.inputs.shard_count || '10' }}
