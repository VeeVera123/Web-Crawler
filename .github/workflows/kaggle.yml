name: Kaggle

# Visits each company's own website (from PDL's domain field) and looks
# for a real link to any known ATS platform, using multiple detection
# methods (parsed links, raw-text scan, JSON-LD) with a fallback chain
# (homepage -> career paths -> sitemap.xml). Every domain is crawled
# regardless of size — see kaggle_probe.py's docstring for the
# archive_i/archive_ii split.
#
# PDL SEED FILE: too large to commit (~1GB), uploaded once as a GitHub
# Release asset (tag: pdl_release_tag) and downloaded fresh each run.
on:
  workflow_dispatch:
    inputs:
      pdl_release_tag:
        description: "GitHub Release tag holding the PDL dataset zip"
        required: false
        default: "pdl-seed-data"
      shard_count:
        description: "Parallel shards to split the company list across"
        required: false
        default: "20"
      concurrency:
        description: "Companies crawled in parallel per shard"
        required: false
        default: "400"
      min_size:
        description: "Min employee count for a no-ATS company to enter archive_ii (doesn't affect which companies get crawled). 0 = no filter."
        required: false
        default: "100"

concurrency:
  group: kaggle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-matrix:
    # GitHub Actions matrices can't reference workflow_dispatch inputs
    # directly, so shard_count -> [0, 1, ..., shard_count-1] is computed
    # here first and passed to the crawl job via fromJson (same pattern
    # this workflow already used for its old platform x shard matrix).
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build shard-index matrix from shard_count input
        id: build
        run: |
          SHARD_COUNT="${{ github.event.inputs.shard_count || '20' }}"
          MATRIX_JSON=$(python3 -c "
          import json
          shard_count = int('$SHARD_COUNT')
          print(json.dumps({'include': [{'shard': s} for s in range(shard_count)]}))
          ")
          echo "shard_count: $SHARD_COUNT  |  total jobs: $SHARD_COUNT"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  crawl:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    # 350 keeps real headroom under GitHub-hosted runners' hard 360-min
    # ceiling. Unlike the old probe, there's no backoff/circuit-breaker
    # that could stall a shard indefinitely here — a slow shard is just
    # genuinely slow (network-bound crawling of however many companies
    # landed in its slice), not stuck waiting on a block.
    timeout-minutes: 350
    strategy:
      fail-fast: false   # one shard's issue shouldn't cancel the others
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp aiodns selectolax requests python-dotenv

      - name: Download PDL seed dataset from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.pdl_release_tag || 'pdl-seed-data' }}"
          if gh release download "$TAG" --repo "${{ github.repository }}" -p "*.zip" -D . ; then
            unzip -o ./*.zip
            if [ -f companies_sorted.csv ] && [ ! -f people_data_labs_companies.csv ]; then
              mv companies_sorted.csv people_data_labs_companies.csv
            fi
            echo "PDL dataset ready: $(ls -la people_data_labs_companies.csv 2>/dev/null || echo 'NOT FOUND after unzip — check the zip contents/filename')"
          else
            echo "No PDL release asset found (tag: $TAG) — nothing to crawl without it, this shard will find 0 companies."
          fi

      - name: "Crawl companies (shard ${{ matrix.shard }}/${{ github.event.inputs.shard_count || '20' }})"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python Kaggle/kaggle_probe.py \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ github.event.inputs.shard_count || '20' }} \
            --concurrency ${{ github.event.inputs.concurrency || '400' }} \
            --min-size ${{ github.event.inputs.min_size || '100' }}
