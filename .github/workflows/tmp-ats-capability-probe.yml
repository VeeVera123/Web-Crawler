name: TEMP - ATS capability probe

# Temporary, throwaway diagnostic workflow (2026-09, explicit user
# request). NOT for gating a future ranking tier — the user confirmed
# that isn't needed. This is a scraper-FIDELITY AUDIT: for each of the 39
# recognized ATS platforms, samples ~30 real company slugs from Supabase
# archive_i and runs them through the SAME live scrape_board() ->
# enrich_descriptions_async() -> enrich_application_questions_async()
# pipeline the real crawls use, logging what location/JD/application-
# question data actually comes back. See ats_capability_probe.py's own
# docstring. Delete both files once the results are reviewed.
#
# Triggered via `push` (not `workflow_dispatch`) — this session's token
# lacks Actions:write to dispatch directly; pushing a change to this
# exact path is what fires it (same technique used earlier this session
# for the stapply.ai/welcometothejungle probes).
on:
  push:
    paths:
      - ".github/workflows/tmp-ats-capability-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: ${{ matrix.ats }}
    strategy:
      fail-fast: false   # one platform's crash shouldn't cancel the rest
      matrix:
        ats:
          - rippling
          - greenhouse
          - lever
          - ashby
          - bamboohr
          - icims
          - workday
          - workable
          - recruitee
          - smartrecruiters
          - teamtailor
          - breezyhr
          - jazzhr
          - personio
          - joincom
          - taleo
          - oracle_cloud_hcm
          - paylocity
          - hrmdirect
          - zoho
          - softgarden
          - eploy
          - folkshr
          - jobadder
          - jobvite
          - adp
          - avature
          - brassring
          - pageup
          - pinpoint
          - flatchr
          - jobylon
          - csod
          - paycom
          - successfactors
          - hireology
          - isolvedhire
          - gem
          - recruiterbox

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "Probe ${{ matrix.ats }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Needed at import time — see verification.yml/Discovery.yml's
          # own CEREBRAS_API_KEY comments: ats_scrapers.py transitively
          # imports config.py, whose legacy single-provider fallback does
          # a bare os.environ["CEREBRAS_API_KEY"] lookup. Nothing in this
          # probe ever calls an LLM.
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        # `exec` makes GitHub's Cancel-workflow signal reach python
        # directly instead of stopping at bash (same reasoning as
        # people_data_labs.yml).
        run: exec python ats_capability_probe.py --ats ${{ matrix.ats }} --sample-size 30
