name: WebGraph

# Seed-only pipeline (no crawl stage — this doesn't crawl any domains
# itself). Downloads + reduces Common Crawl's own domain-level WebGraph
# release (harmonic centrality + PageRank) into a small (domain,band) CSV
# — graduated S+/S/A/B/C rank bands feeding node.py's Quality Index, not a
# flat tier cutoff (see webgraph_seed.py's RANK_BANDS comment) — and
# publishes it to a GitHub Release under a STABLE tag/filename (retained
# as "webgraph-domain-tiers"/"webgraph_domain_tiers.csv.gz" so
# common_crawl.yml and opendata.yml's crawl jobs never need updating just
# because the banding scheme changed). Manual/occasional — Common Crawl
# republishes this dataset roughly every 2-3 months, not on any tighter
# schedule.
#
# ALWAYS run with dry_run checked first against a new --release value and
# read the logged sample (domain, band) rows before unchecking it — see
# webgraph_seed.py's module docstring for exactly why (the ranks-file
# column format couldn't be independently verified before this was built).
#
# lookup_domains is a separate calibration mode (see webgraph_seed.py's
# lookup_ranks()) — set it to scan the full ranks file for one or more
# domains' actual rank and which band it lands in, instead of
# building/publishing the banded CSV, e.g. to sanity-check a band boundary
# against a known-real company.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Common Crawl webgraph release name, e.g. cc-main-2025-mar-apr-may — check https://commoncrawl.org/blog for the current one"
        required: true
      release_tag:
        description: "GitHub Release tag to publish the reduced CSV to"
        required: false
        default: "webgraph-domain-tiers"
      dry_run:
        description: "Parse + log a sample only, don't publish. Always run this first against a new release."
        required: false
        type: boolean
        default: true
      lookup_domains:
        description: "Calibration mode: comma-separated domains (e.g. heli.technology,example.com) to look up their real rank instead of building/publishing the tiered CSV. Leave blank for the normal seed flow."
        required: false
        default: ""

concurrency:
  group: webgraph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # hard ceiling — the ranks file alone is a real one-time download+stream
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Download + reduce (or look up) WebGraph release
        run: |
          if [ -n "${{ github.event.inputs.lookup_domains }}" ]; then
            LOOKUP_ARGS=()
            IFS=',' read -ra DOMAINS <<< "${{ github.event.inputs.lookup_domains }}"
            for d in "${DOMAINS[@]}"; do
              LOOKUP_ARGS+=(--lookup-domain "$d")
            done
            python WebGraph/webgraph_seed.py --release "${{ github.event.inputs.release }}" "${LOOKUP_ARGS[@]}"
          else
            ARGS=(--release "${{ github.event.inputs.release }}" --output webgraph_domain_tiers.csv.gz)
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              ARGS+=(--dry-run)
            fi
            python WebGraph/webgraph_seed.py "${ARGS[@]}"
          fi

      - name: Publish to Release (replacing the existing asset on this tag)
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.lookup_domains == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag || 'webgraph-domain-tiers' }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "WebGraph domain rank bands" \
            --notes "Reduced Common Crawl WebGraph domain-authority rank bands (S+/S/A/B/C) — see WebGraph/webgraph_seed.py. Source release: ${{ github.event.inputs.release }}. Regenerated $(date -u +%Y-%m-%d)."
          gh release upload "$TAG" webgraph_domain_tiers.csv.gz --clobber
