name: TEMP - welcometothejungle scrapability probe

# Temporary, throwaway diagnostic workflow — answers whether
# welcometothejungle.com itself is directly, live-scrapable (own company
# job-list pages + job detail pages), as an alternative/supplement to
# consuming stapply.ai's daily CSV snapshot. Delete once answered.
#
# Triggered via `push` (not `workflow_dispatch`) — same reasoning as the
# earlier stapply probe (this session's token lacks Actions:write).
on:
  push:
    paths:
      - ".github/workflows/tmp-wtj-scrapability-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe welcometothejungle.com directly
        run: |
          cat > /tmp/probe.py <<'PYEOF'
          import urllib.request
          import re

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36")

          def fetch(url, timeout=30, headers=None):
              h = {"User-Agent": UA}
              if headers:
                  h.update(headers)
              req = urllib.request.Request(url, headers=h)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.status, r.read().decode(errors="replace")

          targets = [
              ("company jobs list page",
               "https://www.welcometothejungle.com/en/companies/linking-talents/jobs"),
              ("job detail page (from real stapply sample row)",
               "https://www.welcometothejungle.com/en/companies/G0Y4aH/jobs/"
               "collaborateur-comptable-h-f_rennes_LT_GPO9bep"),
          ]

          for label, url in targets:
              print(f"\n=== {label} ===\n{url}")
              try:
                  status, html = fetch(url)
                  print(f"status={status}  bytes={len(html)}")
                  has_next_data = "__NEXT_DATA__" in html
                  has_apollo = "__APOLLO_STATE__" in html
                  print(f"__NEXT_DATA__ present: {has_next_data}")
                  print(f"__APOLLO_STATE__ present: {has_apollo}")
                  # crude visible-job-title check: does the raw HTML contain
                  # what looks like real job content, or just an SPA shell?
                  title_hits = len(re.findall(r'"title"\s*:\s*"', html))
                  print(f'literal "title": occurrences in HTML: {title_hits}')
                  print("first 1500 chars:")
                  print(html[:1500])
                  print("...")
                  # look for a script tag carrying embedded JSON state
                  m = re.search(r'<script[^>]*id="__NEXT_DATA__"[^>]*>(.*?)</script>', html, re.S)
                  if m:
                      print(f"\n__NEXT_DATA__ blob length: {len(m.group(1))}")
                      print(m.group(1)[:2000])
              except Exception as e:
                  print(f"FAILED: {e}")

          # Also probe for a public API host / sitemap that might expose
          # structured data without needing JS rendering.
          api_guesses = [
              "https://api.welcometothejungle.com/api/v1/organizations/linking-talents/jobs",
              "https://www.welcometothejungle.com/api/v1/organizations/linking-talents/jobs",
              "https://www.welcometothejungle.com/sitemap.xml",
          ]
          for url in api_guesses:
              print(f"\n=== API/sitemap guess: {url} ===")
              try:
                  status, text = fetch(url)
                  print(f"status={status}  bytes={len(text)}")
                  print(text[:800])
              except Exception as e:
                  print(f"FAILED: {e}")
          PYEOF
          python3 /tmp/probe.py
