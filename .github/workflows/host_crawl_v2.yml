name: Host Crawl v2 — Common Crawl Domain Discovery

# Single combined seed+crawl+detect pass over Common Crawl's Host Index —
# no queue tables, no multi-run convergence. Country is detected and
# attached when found, but is never a filter (most rows will have
# country=NULL — that's normal, see host_crawl_v2.py's module docstring).
# Sharding happens in the SQL query itself and seeding/crawling stream one
# Parquet file at a time, so memory stays bounded regardless of partition
# count or host_limit (there is no host_limit anymore — see module
# docstring's STREAMING SEED+CRAWL and HOW MANY PARTITIONS sections for
# the full history and reasoning).
on:
  workflow_dispatch:
    inputs:
      crawl_partition:
        description: "Pin a starting partition (e.g. CC-MAIN-2025-18). Blank = auto-detect the latest available EVERY run — leave blank unless you specifically want an older starting point; a hardcoded value here silently stops picking up a newer partition if/when one is published. Ignored if crawl_list is set."
        required: false
        default: ""
      partitions:
        description: "How many CONTIGUOUS partitions to crawl, starting there (walks backward through older ones). Time budget is shared across all of them, not multiplied. Ignored if crawl_list is set."
        required: false
        default: "1"
      crawl_list:
        description: "Comma-separated exact partitions instead, e.g. CC-MAIN-2025-18,CC-MAIN-2024-42. Overrides crawl_partition/partitions."
        required: false
        default: ""
      start_file_index:
        description: "Skip this many files in the first partition before starting (0-based)"
        required: false
        default: "0"
      shard_count:
        description: "Parallel shards to split the crawl across"
        required: false
        default: "10"
      concurrency:
        description: "Hosts crawled in parallel PER shard. 700 matches class_a_probe's own proven value on this runner size (4 vCPUs) — see class_a_probe.py's PARSE_WORKERS comment before raising further."
        required: false
        default: "700"

concurrency:
  group: host-crawl-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build shard-index matrix from shard_count input
        id: build
        run: |
          SHARD_COUNT="${{ github.event.inputs.shard_count || '10' }}"
          MATRIX_JSON=$(python3 -c "
          import json
          shard_count = int('$SHARD_COUNT')
          print(json.dumps({'include': [{'shard': s} for s in range(shard_count)]}))
          ")
          echo "shard_count: $SHARD_COUNT  |  total jobs: $SHARD_COUNT"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  crawl:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    # Same 350-under-360 margin class_a_probe.yml uses. Each shard here
    # ALSO pays the DuckDB seed-query cost up front (unlike class_a_probe,
    # which reads a pre-downloaded CSV) — the internal TIME_BUDGET_MINUTES
    # cutoff in host_crawl_v2.py still guards the crawl portion, but the
    # seed portion itself isn't budget-capped, so a genuinely stalled
    # Hugging Face connection (see HF_TOKEN comment) could eat into this
    # margin. Setting the HF_TOKEN secret is the real fix for that, not a
    # bigger number here.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp aiodns selectolax requests python-dotenv duckdb

      - name: "Host Crawl v2 (shard ${{ matrix.shard }}/${{ github.event.inputs.shard_count || '10' }})"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          CRAWL_ARGS=()
          if [ -n "${{ github.event.inputs.crawl_list }}" ]; then
            CRAWL_ARGS=(--crawl-list "${{ github.event.inputs.crawl_list }}")
          elif [ -n "${{ github.event.inputs.crawl_partition }}" ]; then
            CRAWL_ARGS=(--crawl "${{ github.event.inputs.crawl_partition }}")
          fi

          python host_crawl_v2.py \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ github.event.inputs.shard_count || '10' }} \
            --partitions ${{ github.event.inputs.partitions || '1' }} \
            --concurrency ${{ github.event.inputs.concurrency || '700' }} \
            --start-file-index ${{ github.event.inputs.start_file_index || '0' }} \
            "${CRAWL_ARGS[@]}"
