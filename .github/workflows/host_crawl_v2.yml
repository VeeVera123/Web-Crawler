name: Host Crawl v2 — Common Crawl Domain Discovery

# NEW (2026-08): replaces the old seed/crawl/finalize batch-pipeline
# design (host_crawl.yml, host_crawl_seed.py's h_seeding/h_file_count/
# h_total_seeded queue tables) with a single combined seed+crawl+detect
# pass, scoped to exactly ONE Common Crawl Host Index partition, per
# explicit instruction. host_crawl_v2.py does the seeding (a DuckDB
# hf:// query against Hugging Face's mirror of Common Crawl's Host Index,
# same proven memory-safe per-file pattern host_crawl_seed.py used) AND
# the crawl (reusing class_a_probe.py's fetch/parse/detect core directly)
# in one script — no queue tables, no multi-run convergence needed for a
# single-partition pass. See host_crawl_v2.py's module docstring for the
# full rationale, including why 1 partition (~1-2 months of crawl data,
# NOT a year) is a reasonable, deliberate scope for this build.
#
# COUNTRY IS NOT A GATE (2026-08 — see host_crawl_v2.py's module
# docstring): a row is written whenever a real ATS link is found. Country
# is detected and attached to the row when confidently found (JSON-LD /
# footer address text), left NULL otherwise — expect most rows to have
# country=NULL, since only ~15-30% of sites publish machine-readable
# address data at all. Narrowing by country, if wanted, is a query
# against ctlog_probe_results afterward, not a crawl-time filter here.
#
# SHARDING (rewritten 2026-08 after a real OOM crash — see host_crawl_v2.py's
# module docstring): the FIRST version seeded the whole partition into one
# Python list before crawling anything, then sliced hosts[shard::shard_count]
# — a live run with a high host_limit accumulated 126M+ hosts in memory
# and got OOM-killed by the runner's OS mid-seed (reported as the generic
# "Error: The operation was canceled."). Sharding now happens IN THE SQL
# QUERY itself (hash(surt_host_name) % shard_count = shard_index), so each
# shard's DuckDB query only ever pulls its own ~1/N slice over the wire —
# both cheaper and memory-safe — AND seeding/crawling are interleaved per
# Parquet file rather than seeding the whole partition up front, so memory
# never holds more than one file's worth of hosts at a time regardless of
# partition size. There's no host-count cap anymore — TIME_BUDGET_MINUTES
# alone governs how much of the partition a run covers.
on:
  workflow_dispatch:
    inputs:
      crawl_partition:
        description: "Common Crawl partition to use. Defaulted to CC-MAIN-2025-18 — confirmed live (2026-08) to actually be the most recent partition in this Host Index dataset, pinned explicitly so every shard uses the same one deterministically and skips the live 'list available partitions' lookup, which failed transiently on a real run (fell back to this same hardcoded value anyway, just with an unnecessary warning). Blank = fall back to the live lookup instead."
        required: false
        default: "CC-MAIN-2025-18"
      shard_count:
        description: "Number of parallel shards to split the seeded host list across"
        required: false
        default: "10"
      concurrency:
        description: "Hosts crawled in parallel PER shard (no rate limiting — see class_a_probe.py/host_crawl_v2.py)"
        required: false
        default: "300"

concurrency:
  group: host-crawl-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build shard-index matrix from shard_count input
        id: build
        run: |
          SHARD_COUNT="${{ github.event.inputs.shard_count || '10' }}"
          MATRIX_JSON=$(python3 -c "
          import json
          shard_count = int('$SHARD_COUNT')
          print(json.dumps({'include': [{'shard': s} for s in range(shard_count)]}))
          ")
          echo "shard_count: $SHARD_COUNT  |  total jobs: $SHARD_COUNT"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  crawl:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    # Same 350-under-360 margin class_a_probe.yml uses. Each shard here
    # ALSO pays the DuckDB seed-query cost up front (unlike class_a_probe,
    # which reads a pre-downloaded CSV) — the internal TIME_BUDGET_MINUTES
    # cutoff in host_crawl_v2.py still guards the crawl portion, but the
    # seed portion itself isn't budget-capped, so a genuinely stalled
    # Hugging Face connection (see HF_TOKEN comment) could eat into this
    # margin. Setting the HF_TOKEN secret is the real fix for that, not a
    # bigger number here.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp aiodns selectolax requests python-dotenv duckdb

      - name: "Host Crawl v2 (shard ${{ matrix.shard }}/${{ github.event.inputs.shard_count || '10' }})"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          CRAWL_ARGS=()
          if [ -n "${{ github.event.inputs.crawl_partition }}" ]; then
            CRAWL_ARGS=(--crawl "${{ github.event.inputs.crawl_partition }}")
          fi

          python host_crawl_v2.py \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ github.event.inputs.shard_count || '10' }} \
            --concurrency ${{ github.event.inputs.concurrency || '300' }} \
            "${CRAWL_ARGS[@]}"
