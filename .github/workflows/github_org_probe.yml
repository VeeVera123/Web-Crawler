name: GitHub Org Probe — crawl companies seeded from GitHub orgs

# Own thin wrapper (github_org_probe.py) around node.py, the shared engine
# — depends on node.py only, not on class_a_probe.py. Reads
# github_org_seed.yml's output CSV, crawls each company's OWN website. NOT
# GitHub-API-limited at all, so it shards freely across parallel jobs.
#
# Country is never filtered here: GitHub org profiles don't reliably carry
# one, so every row out of github_org_seed.py has country="".
on:
  workflow_dispatch:
    inputs:
      seed_release_tag:
        description: "Tag of the GitHub Release holding github_org_seed.py's output zip"
        required: false
        default: "github-org-seed-data"
      shard_count:
        description: "Number of parallel shards to split the company list across"
        required: false
        default: "10"
      concurrency:
        description: "Companies crawled in parallel PER shard (no rate limiting — see class_a_probe.py)"
        required: false
        default: "400"

concurrency:
  group: github-org-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build shard-index matrix from shard_count input
        id: build
        run: |
          SHARD_COUNT="${{ github.event.inputs.shard_count || '10' }}"
          MATRIX_JSON=$(python3 -c "
          import json
          shard_count = int('$SHARD_COUNT')
          print(json.dumps({'include': [{'shard': s} for s in range(shard_count)]}))
          ")
          echo "shard_count: $SHARD_COUNT  |  total jobs: $SHARD_COUNT"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  crawl:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp aiodns selectolax requests python-dotenv

      - name: Download GitHub-org seed dataset from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.seed_release_tag || 'github-org-seed-data' }}"
          if gh release download "$TAG" --repo "${{ github.repository }}" -p "*.zip" -D . ; then
            unzip -o ./*.zip
            echo "Seed dataset ready: $(ls -la github_org_companies.csv 2>/dev/null || echo 'NOT FOUND after unzip — check the zip contents/filename')"
          else
            echo "No seed release asset found (tag: $TAG) — run github_org_seed.yml first. This shard will find 0 companies."
          fi

      - name: "Crawl GitHub-seeded companies (shard ${{ matrix.shard }}/${{ github.event.inputs.shard_count || '10' }})"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GITHUB_ORG_CSV_PATH: github_org_companies.csv
        run: |
          python github_org_seed/github_org_probe.py \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ github.event.inputs.shard_count || '10' }} \
            --concurrency ${{ github.event.inputs.concurrency || '400' }}